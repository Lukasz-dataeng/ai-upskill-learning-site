# Plan for a generated deck. Stop 1: edit freely before answering "y".
# Change, add or remove questions; tier is Foundational, Intermediate or Deep-dive.
# New questions need no id. Removing a section renumbers the ones after it.
deck: software-architecture-designs
title: Software Architecture Designs
description: >-
  A study deck on common software architecture designs, covering fundamental patterns, their
  trade-offs, and when to apply them in system design.
sections:
  - id: s1
    title: Core Architectural Patterns
    summary: Understanding fundamental architectural styles and their basic principles.
    questions:
      - id: '1.1'
        tier: Foundational
        question: Describe the Monolithic architecture. What are its primary advantages and disadvantages?
      - id: '1.2'
        tier: Foundational
        question: >-
          Explain the Microservices architecture. What are the key benefits and challenges compared
          to a monolith?
      - id: '1.3'
        tier: Intermediate
        question: What is a Service-Oriented Architecture (SOA)? How does it differ from Microservices?
  - id: s2
    title: Event-Driven Architectures
    summary: Exploring systems that communicate through events and their implications.
    questions:
      - id: '2.1'
        tier: Foundational
        question: Explain the concept of an Event-Driven Architecture. What are the main components?
      - id: '2.2'
        tier: Intermediate
        question: >-
          Describe the Publisher-Subscriber (Pub/Sub) pattern. How is it used in event-driven
          systems?
      - id: '2.3'
        tier: Intermediate
        question: >-
          What are the trade-offs when choosing between synchronous and asynchronous communication
          in distributed systems?
      - id: '2.4'
        tier: Deep-dive
        question: >-
          Discuss potential challenges like event ordering, idempotency, and dead-letter queues in
          an event-driven system.
  - id: s3
    title: Data-Centric Architectures
    summary: Focusing on architectures where data flow and management are central concerns.
    questions:
      - id: '3.1'
        tier: Foundational
        question: What is a Layered Architecture? Provide an example of how layers are typically organized.
      - id: '3.2'
        tier: Intermediate
        question: >-
          Explain the Client-Server architecture. What are the main responsibilities of the client
          and server?
      - id: '3.3'
        tier: Intermediate
        question: >-
          Describe the Model-View-Controller (MVC) pattern. How does it promote separation of
          concerns?
      - id: '3.4'
        tier: Deep-dive
        question: Discuss the CAP theorem. How does it influence the design of distributed data stores?
  - id: s4
    title: Advanced and Hybrid Patterns
    summary: Examining more complex designs and combinations of architectural styles.
    questions:
      - id: '4.1'
        tier: Foundational
        question: >-
          What is the difference between a Monolith and a Microservices architecture in terms of
          deployment and scalability?
      - id: '4.2'
        tier: Intermediate
        question: >-
          Describe the Strangler Fig pattern. When is it a suitable approach for system
          modernization?
      - id: '4.3'
        tier: Intermediate
        question: What is a Peer-to-Peer (P2P) architecture? Compare it to a Client-Server model.
      - id: '4.4'
        tier: Deep-dive
        question: >-
          How might you combine different architectural patterns, such as Microservices with an
          Event-Driven approach, to build a robust system?
