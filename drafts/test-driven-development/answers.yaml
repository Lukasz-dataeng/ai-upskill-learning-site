# Answers cache for the topic pipeline. Edit the plan, not this file.
answers:
  '1.1':
    question: What is Test Driven Development (TDD) and what are its primary goals?
    status: ok
    rounds: 1
    lead: >-
      Test Driven Development is a development practice where an automated test expresses a small
      behavior before its implementation, and the code is then shaped to satisfy that test. Its
      primary goals are to clarify requirements, guide simple designs, and maintain a continuously
      checked specification of behavior.
    body: >-
      <p><strong>Test Driven Development (TDD)</strong> is a disciplined way to build software by
      treating tests as the starting point for each small behavior. The test is not merely a final
      verification step; it is an executable example of what the code should do and a feedback
      mechanism for the design.</p><p>Its primary goals are to:</p><ul><li><strong>Clarify
      requirements:</strong> turn an expected behavior into a precise, observable example before
      implementation.</li><li><strong>Guide design:</strong> encourage small, cohesive units with
      clear interfaces and manageable dependencies.</li><li><strong>Provide fast feedback:</strong>
      reveal incorrect assumptions close to the change that introduced them.</li><li><strong>Protect
      behavior:</strong> make intended behavior easy to check when code is changed or
      extended.</li><li><strong>Support incremental development:</strong> grow the system through
      small, understandable changes rather than speculative implementation.</li></ul><p>TDD does not
      mean testing every implementation detail or guaranteeing that software has no defects. The
      tests should focus on behavior that matters to users or collaborating code, while the
      implementation remains free to change as long as that behavior is preserved.</p><div
      class="box trap"><b class="t">Common trap</b><p>TDD is more than writing tests before—or
      alongside—production code. The tests must actively drive the design and describe useful
      behavior; a large test suite added after implementation is valuable testing, but it is not
      necessarily TDD.</p></div>
  '1.2':
    question: Describe the Red-Green-Refactor cycle in TDD. What happens in each phase?
    status: ok
    rounds: 1
    lead: >-
      Red means write a failing test that defines the next behavior, green means make the smallest
      change that passes it, and refactor means improve the design without changing behavior. Then
      repeat the cycle in small steps.
    body: >-
      <p>The cycle keeps development focused on observable
      behavior:</p><ol><li><strong>Red:</strong> Write a test for one small piece of desired
      behavior and run it to confirm that it fails for the expected reason. The failure shows that
      the behavior is not implemented yet and that the test is actually exercising the intended
      code.</li><li><strong>Green:</strong> Implement the simplest production code that makes the
      test pass. At this stage, prioritize correctness and feedback over elegance; avoid adding
      behavior that is not required by a failing test.</li><li><strong>Refactor:</strong> With the
      tests passing, improve the code and test structure while preserving externally visible
      behavior. Remove duplication, clarify names, and simplify design where appropriate, then rerun
      the tests to detect regressions.</li></ol><p>After refactoring, start the next small behavior
      at red. The short feedback loop provides evidence after each change and keeps the
      implementation aligned with executable examples of the desired behavior.</p><div class="box
      trap"><b class="t">Common trap</b><p>“Green” does not mean the code is complete or well
      designed; it means the current test suite passes. The tests must be meaningful, and
      refactoring should be done only with reliable tests that would expose an accidental behavior
      change.</p></div>
  '1.3':
    question: What are the benefits of writing tests before writing production code?
    status: ok
    rounds: 1
    lead: >-
      Writing tests first clarifies the intended behavior before implementation, gives fast feedback
      on mistakes, and creates a regression safety net. It also encourages smaller, more focused
      interfaces because the code must be easy to exercise from the test.
    body: >-
      <p>Writing tests before production code provides several practical
      benefits:</p><ul><li><strong>Clarifies requirements:</strong> A test makes expected inputs,
      outputs, and failure behavior concrete. Ambiguities are discovered before they are embedded in
      implementation.</li><li><strong>Provides fast, precise feedback:</strong> When a test fails,
      the change is usually small and the likely cause is easy to identify. This reduces the time
      spent debugging unrelated behavior.</li><li><strong>Improves design:</strong> Code written to
      be tested tends to have focused responsibilities, explicit dependencies, and interfaces that
      are easier to call. Awkward tests can reveal excessive coupling or unclear
      boundaries.</li><li><strong>Protects against regressions:</strong> The tests record important
      behavior, so later refactoring or feature work can be checked automatically rather than
      relying only on manual verification.</li><li><strong>Encourages deliberate edge-case
      thinking:</strong> Developers consider invalid input, boundary conditions, and error handling
      early instead of treating them as afterthoughts.</li><li><strong>Communicates intent:</strong>
      Well-named tests can serve as executable examples for teammates and future
      maintainers.</li></ul><p>The benefit is not simply having more tests; it is getting feedback
      while the design is still cheap to change. Tests still need to be maintained and should focus
      on observable behavior, otherwise they can become brittle and slow development.</p>
  '2.1':
    question: What characteristics define a 'good' unit test in the context of TDD?
    status: ok
    rounds: 1
    lead: >-
      A good TDD unit test is focused, readable, fast, deterministic, and independent. It verifies
      one observable behavior through a clear Arrange–Act–Assert structure, and fails with enough
      information to explain what behavior is broken.
    body: >-
      <p>A good unit test gives the team confidence without becoming expensive to read or maintain.
      Its key characteristics are:</p><ul><li><strong>Focused:</strong> it checks one behavior or
      closely related outcome, so a failure points to a specific
      problem.</li><li><strong>Behavior-oriented:</strong> it tests the contract visible to a caller
      rather than incidental implementation details, which allows the code to be refactored
      safely.</li><li><strong>Readable:</strong> the test name and setup make the scenario, action,
      and expected result obvious.</li><li><strong>Deterministic and repeatable:</strong> the same
      code and inputs produce the same result, without depending on timing, random state, or
      environmental accidents.</li><li><strong>Fast:</strong> unit tests should provide rapid
      feedback during the TDD cycle.</li><li><strong>Independent:</strong> one test should not rely
      on another test having run first or on shared mutable state.</li><li><strong>Useful on
      failure:</strong> its assertion and failure message help identify the violated
      behavior.</li></ul><p>For example, a test might describe the rule
      directly:</p><pre><code>it("rejects an empty username", () =&gt; {
        const result = register({ username: "" });
        expect(result).toEqual({ error: "username is required" });
      });</code></pre><p>The exact syntax varies by language and test framework, but the principle
      is stable: each test should communicate a meaningful requirement and provide quick,
      trustworthy feedback.</p>
  '2.2':
    question: Explain the concept of 'Arrange, Act, Assert' (AAA) and how it applies to writing tests.
    status: ok
    rounds: 1
    lead: >-
      Arrange, Act, Assert is a test structure: first prepare the inputs and dependencies, then
      perform one operation, and finally verify the observable result. Keeping those phases distinct
      makes tests easier to read, diagnose, and maintain.
    body: >-
      <p>AAA gives each test a clear narrative:</p><ul><li><strong>Arrange:</strong> create the
      object under test, inputs, and any controlled collaborators or initial
      state.</li><li><strong>Act:</strong> call the behavior being tested, ideally once, and capture
      its result or the exception it produces.</li><li><strong>Assert:</strong> verify the relevant
      observable outcome, such as a return value, changed state, or interaction that is part of the
      contract.</li></ul><p>For example, a test for adding an item to a cart might look like
      this:</p><pre><code>def test_add_item_increases_cart_total():
          # Arrange
          cart = Cart()
          item = Item(price=10)

          # Act
          cart.add(item)

          # Assert
          assert cart.total() == 10</code></pre><p>The separation is a guideline rather than a requirement for exactly three lines. A test may have several setup statements, and assertions can be grouped when they describe the same outcome. The important parts are that setup is not mixed into the behavior being exercised, the act phase is focused, and assertions test externally meaningful behavior rather than implementation details.</p><div class="box trap"><b class="t">Common trap</b><p>Do not make Arrange so large that the test’s purpose is hidden, or add unrelated assertions merely because the required objects are already available. A focused test should fail for a clear reason.</p></div>
  '2.3':
    question: What is test isolation, and why is it important in TDD?
    status: ok
    rounds: 1
    lead: >-
      Test isolation means each test runs independently, with its own controlled state and no
      reliance on another test’s order or side effects. It matters in TDD because isolated tests
      fail for one understandable reason, run quickly, and give reliable feedback while the design
      evolves.
    body: >-
      <p>In an isolated test, the result depends only on the behavior being tested and the inputs
      arranged by that test. Tests do not share mutable state, depend on execution order, read
      leftover files or database records, or rely on the current clock, randomness, network, or
      another test’s setup. Isolation is especially valuable in TDD because the test suite is run
      repeatedly during small implementation and refactoring
      steps.</p><ul><li><strong>Independent:</strong> a test can run alone, in a different order, or
      in parallel and still produce the same result.</li><li><strong>Focused:</strong> a failure
      points to the unit or behavior under test rather than to unrelated infrastructure or prior
      tests.</li><li><strong>Repeatable:</strong> the same code and inputs produce the same outcome
      across runs and environments.</li><li><strong>Fast:</strong> tests avoid unnecessary real
      resources, so developers receive feedback quickly.</li></ul><p>Practical techniques include
      creating fresh fixtures per test, restoring or discarding changed state, using deterministic
      inputs, and replacing slow or nondeterministic boundaries with controlled test doubles where
      appropriate. Isolation does not mean every test must be a unit test; integration tests can be
      isolated from one another while exercising real components, although they usually need more
      setup and cleanup.</p><div class="box trap"><b class="t">Common trap</b><p>A test that passes
      only when the whole suite runs in a particular order is not merely flaky; it is revealing
      hidden coupling. Fix the shared state or uncontrolled dependency instead of rearranging the
      tests.</p></div>
  '2.4':
    question: >-
      How do you handle dependencies (like databases, network calls, or external services) when
      writing unit tests in TDD?
    status: ok
    rounds: 1
    lead: >-
      In unit tests, keep the unit fast and deterministic by replacing databases, network clients,
      clocks, and external services with interfaces and controlled test doubles. Verify the unit’s
      behavior and the calls or data it needs, while testing real integrations separately.
    body: >-
      <p>In TDD, I first identify the unit’s boundary and inject its dependencies rather than
      constructing concrete clients inside the code. The test can then provide a stub, fake, spy, or
      mock with controlled behavior.</p><ul><li><strong>Stub or fake:</strong> return useful data,
      failures, timeouts, or empty results so the test covers meaningful
      branches.</li><li><strong>Spy or mock:</strong> verify an important interaction, such as
      saving a record or publishing an event, but avoid asserting incidental implementation
      details.</li><li><strong>Failure behavior:</strong> explicitly test dependency errors, retries
      where relevant, cancellation, and invalid responses.</li><li><strong>State and time:</strong>
      control generated identifiers, current time, randomness, and configuration so outcomes are
      repeatable.</li></ul><p>For example, the production code can depend on a small
      interface:</p><pre><code>interface UserStore {
        find(id: UserId): User | null
      }


      function greeting(id: UserId, store: UserStore): string {
        const user = store.find(id)
        return user ? `Hello, ${user.name}` : "Unknown user"
      }</code></pre><p>The unit test supplies an in-memory implementation or a test double. I keep
      the abstraction narrow and prefer realistic fakes when interaction-based mocks would make
      tests brittle. A separate set of integration tests checks that the real adapter works with the
      database or service; unit tests should not require those systems to be available.</p><div
      class="box trap"><b class="t">Common trap</b><p>Mocking every internal call can produce tests
      that merely reproduce the implementation. Assert observable behavior first, and verify an
      interaction only when that interaction is part of the contract.</p></div>
  '3.1':
    question: What is refactoring, and why is it a crucial part of the TDD process?
    status: ok
    rounds: 1
    lead: >-
      Refactoring is improving a system’s internal structure without changing its observable
      behavior. In TDD, it is crucial because passing tests provide a safety net, allowing the
      design to be cleaned up continuously instead of accumulating complexity.
    body: >-
      <p>Refactoring changes how code is organized, not what it does from a caller’s perspective.
      The externally visible behavior should remain the same: existing tests should continue to
      pass, and no new feature should be introduced during the refactoring step.</p><p>It is central
      to TDD because the first implementation is often deliberately minimal and may not yet have the
      clearest structure. Once the test is green, the developer can improve names, boundaries,
      duplication, and dependencies while using the tests as a fast feedback mechanism. This keeps
      design decisions small and reversible, and prevents working code from gradually becoming
      harder to understand or change.</p><p>A safe refactoring loop is:</p><ol><li>Start with
      passing tests.</li><li>Make one structural improvement.</li><li>Run the relevant
      tests.</li><li>Keep the change only if behavior remains correct.</li></ol><div class="box
      trap"><b class="t">Common trap</b><p>Refactoring is not a license to change behavior or add
      scope. If behavior must change, first capture that change in a test; then implement it
      separately from purely structural cleanup.</p></div>
  '3.2':
    question: How can TDD lead to better code design and simpler architectures?
    status: ok
    rounds: 1
    lead: >-
      TDD improves design by forcing developers to use each component through a clear, testable
      interface before committing to its implementation. Fast feedback encourages small
      responsibilities, explicit dependencies, low coupling, and simpler solutions instead of
      speculative architecture.
    body: >-
      <p>TDD is a design feedback loop, not just a way to verify code. Because a test must interact
      with the code from the outside, awkward APIs, excessive setup, and tightly coupled
      responsibilities become visible early.</p><ul><li><strong>Small responsibilities:</strong> A
      difficult-to-write test often indicates that one component is doing too
      much.</li><li><strong>Explicit dependencies:</strong> Code tends to accept collaborators
      through clear boundaries rather than reaching into global state or constructing infrastructure
      internally.</li><li><strong>Low coupling:</strong> Tests expose when a small behavior requires
      many unrelated objects, making it easier to separate stable policy from replaceable
      details.</li><li><strong>Incremental architecture:</strong> Starting with the behavior
      actually required discourages speculative frameworks, abstractions, and extension
      points.</li><li><strong>Safe change:</strong> A focused test suite provides feedback while the
      design is simplified, so improvements do not depend solely on manual checking.</li></ul><p>For
      example, testing a checkout policy through a small interface can reveal that pricing, payment,
      and notification should not be embedded in one large method. The result may be a few focused
      collaborators rather than a complex layered architecture.</p><div class="box trap"><b
      class="t">Common trap</b><p>TDD does not automatically produce good design. Tests can preserve
      poor structure if they inspect implementation details or if developers optimize only for easy
      tests. The tests should express useful behavior, while design decisions remain open to
      review.</p></div>
  '3.3':
    question: Describe common refactoring techniques used after the 'green' phase in TDD.
    status: ok
    rounds: 1
    lead: >-
      After the tests are green, I refactor without changing behavior: remove duplication, clarify
      names and structure, and simplify responsibilities while keeping the tests passing. Typical
      moves include extracting methods or classes, simplifying conditionals, and improving
      interfaces, followed by rerunning the tests.
    body: >-
      <p>The green phase proves the current behavior; refactoring improves the design while
      preserving that behavior. I make one small structural change at a time and run the tests
      frequently so a failure identifies the change that introduced it.</p><ul><li><strong>Rename
      for clarity:</strong> improve names of variables, methods, classes, and parameters so intent
      is explicit.</li><li><strong>Extract a method:</strong> give a coherent block of logic a name,
      especially when a method has multiple responsibilities or a nested section is hard to
      read.</li><li><strong>Extract a class or module:</strong> move behavior and data that form a
      separate responsibility, reducing coupling and oversized classes.</li><li><strong>Remove
      duplication:</strong> consolidate repeated logic behind a shared method or abstraction, but
      only when the duplicated behavior is genuinely the same.</li><li><strong>Simplify control
      flow:</strong> use guard clauses, remove unnecessary conditionals, or replace complicated
      branching with a clearer polymorphic or data-driven structure where
      appropriate.</li><li><strong>Improve boundaries:</strong> introduce a small interface,
      parameter object, or value object when it makes dependencies and invariants easier to
      understand.</li></ul><p>For example, a long conditional can first be extracted without
      changing its logic:</p><pre><code>bool CanShip(Order order) =&gt; IsPaid(order) &amp;&amp;
      HasAddress(order);</code></pre><p>After each change, I run the focused tests and then the
      broader suite. The key constraint is that refactoring changes structure, not the externally
      observable behavior established by the tests.</p>
  '3.4':
    question: What are some common anti-patterns or mistakes to avoid when refactoring during TDD?
    status: ok
    rounds: 1
    lead: >-
      During TDD refactoring, preserve behavior and keep the suite green: make one small structural
      change at a time, run the tests, and avoid mixing refactoring with new behavior. Common
      mistakes are speculative abstractions, large rewrites, changing tests merely to fit the
      implementation, and ignoring tests that reveal a real regression.
    body: >-
      <p>Refactoring should change the code’s structure without changing its externally observable
      behavior. In a TDD cycle, keep the feedback loop short and make the smallest safe
      step.</p><ul><li><strong>Mixing concerns:</strong> Do not add a feature, fix a bug, and
      reorganize the design in one change. It becomes difficult to tell whether a failure is a
      regression or an expected behavior change.</li><li><strong>Large-bang rewrites:</strong>
      Prefer small, independently testable transformations. A broad rewrite removes the safety net
      precisely when it is most needed.</li><li><strong>Changing tests to make them pass:</strong>
      Update a test only when the intended contract has changed or the test is incorrectly coupled
      to an implementation detail. Do not weaken assertions or delete failing tests just to restore
      a green build.</li><li><strong>Premature abstraction:</strong> Avoid extracting a framework,
      hierarchy, or generic helper before the duplication or variation is understood. An abstraction
      built from guesses can make future changes harder.</li><li><strong>Refactoring toward
      test-shaped code:</strong> Tests should verify meaningful behavior, not force production code
      to expose private state or implementation details. If tests are brittle, improve their design
      deliberately rather than hiding the problem.</li><li><strong>Skipping validation:</strong> Run
      the relevant tests after each meaningful step, then the broader suite before completing the
      change. Also inspect the diff for accidental behavior changes.</li></ul><div class="box
      trap"><b class="t">Common trap</b><p>A green suite is evidence, not proof, that a refactor is
      safe. If important behavior is untested, first add characterization tests or otherwise
      establish the missing contract before making a risky structural change.</p></div>
  '4.1':
    question: When might TDD be less suitable or more challenging to apply?
    status: ok
    rounds: 1
    lead: >-
      TDD is harder when requirements are uncertain, the work is highly exploratory, or the code is
      tightly coupled to legacy, UI, hardware, or external systems. It can still help, but the team
      may need smaller experiments, characterization tests, or a less test-first approach initially.
    body: >-
      <p>TDD is not equally practical in every situation. It becomes more challenging
      when:</p><ul><li><strong>Requirements are unclear or changing rapidly:</strong> tests may
      encode assumptions that are likely to be discarded. Exploratory prototypes can be more useful
      until the behavior is understood.</li><li><strong>The work is experimental:</strong> when the
      main question is whether an approach is feasible, writing a full test suite first can add
      friction before the design has stabilized.</li><li><strong>The code is legacy or tightly
      coupled:</strong> it may be difficult to exercise one behavior without constructing a large
      amount of surrounding state. The first step may be to add a few characterization tests or make
      a small seam for testing.</li><li><strong>The behavior depends heavily on visual, physical, or
      platform-specific details:</strong> automated tests may be expensive, brittle, or unable to
      capture the most important feedback.</li><li><strong>The team lacks the skills or feedback
      loop:</strong> poorly designed tests can slow development and create false confidence,
      especially if they are hard to maintain.</li></ul><p>This does not mean abandoning testing. It
      means adapting the level and order of testing to the risk: use lightweight experiments while
      learning, then apply TDD where behavior is understood and repeatable. The decision should
      balance feedback value against test maintenance cost.</p><div class="box trap"><b
      class="t">Common trap</b><p>Do not claim that TDD is unsuitable simply because tests take
      time. The relevant question is whether the tests provide fast, trustworthy feedback for the
      kind of uncertainty being addressed.</p></div>
  '4.2':
    question: How does TDD impact the development of legacy code or in situations with existing test suites?
    status: ok
    rounds: 1
    lead: >-
      TDD is usually applied incrementally to legacy code: first establish a safety net around the
      behavior you must preserve, then add a failing regression test for each change or bug fix.
      Existing tests provide useful feedback, but you should assess whether they are trustworthy
      before treating them as a design constraint.
    body: >-
      <p>With legacy code, starting with a clean test-first workflow may be impractical because the
      code is difficult to isolate and its intended behavior may be unclear. Begin by identifying a
      small change and writing <em>characterization tests</em>: tests that capture the current
      observable behavior, including behavior that may be awkward but must not change accidentally.
      These tests create a baseline before refactoring.</p><ul><li><strong>Work at seams.</strong>
      Introduce a small boundary around a database, file system, clock, or external service so new
      behavior can be tested without invoking the whole system.</li><li><strong>Use bug-driven
      tests.</strong> Reproduce a defect with a failing test, make it pass, then keep the test as a
      regression guard.</li><li><strong>Refactor in small steps.</strong> Once the baseline is
      reliable, simplify or extract code while running the relevant tests
      frequently.</li><li><strong>Evaluate the existing suite.</strong> Separate fast, deterministic
      tests from slow, flaky, or overly broad tests. Improve the latter gradually rather than
      assuming every existing assertion is valuable.</li></ul><p>For an existing test suite, TDD
      changes the role of tests from merely detecting regressions to guiding new behavior and safer
      design changes. You do not need to rewrite the suite before using TDD; apply it to new code
      and modified areas, while progressively improving the surrounding tests.</p><div class="box
      trap"><b class="t">Common trap</b><p>Passing legacy tests does not prove the system is
      correct. They may encode accidental behavior, miss important cases, or be coupled to
      implementation details, so treat them as evidence and improve their confidence over
      time.</p></div>
  '4.3':
    question: >-
      What is the role of integration tests and end-to-end tests in a TDD workflow, and how do they
      complement unit tests?
    status: ok
    rounds: 1
    lead: >-
      Unit tests drive small design decisions quickly; integration tests verify that real components
      work together, and end-to-end tests verify critical user journeys through the whole system. In
      a TDD workflow, the broader tests provide confidence at system boundaries while the unit tests
      provide fast, precise feedback.
    body: >-
      <p>These test levels answer different questions:</p><ul><li><strong>Unit tests</strong> check
      a small piece of behavior in isolation. They form the fast inner loop of TDD: specify one
      behavior, make it pass, then refactor.</li><li><strong>Integration tests</strong> check
      collaboration between real components, such as an application and its persistence layer, a
      message broker, or an HTTP boundary. They catch wiring, serialization, configuration, schema,
      and transaction problems that isolated unit tests can miss.</li><li><strong>End-to-end
      tests</strong> exercise the system through a realistic entry point, such as a user interface
      or public API, and verify an important business journey across multiple components. They
      provide evidence that the deployed system works as a whole.</li></ul><p>Integration and
      end-to-end tests complement unit tests rather than replace them. A practical TDD workflow may
      use a unit test to drive the design of a component, then add an integration or
      acceptance-level test for behavior that crosses a boundary. The broader tests are usually
      fewer and slower, so they should focus on valuable contracts and critical journeys. When one
      fails, unit tests help localize the defect, while the broader test confirms the system-level
      behavior.</p><div class="box trap"><b class="t">Common trap</b><p>Calling every test an
      end-to-end test can produce a slow, brittle suite. Keep most feedback at the unit level, add
      integration coverage where components meet, and reserve end-to-end tests for high-value
      workflows.</p></div>
  '4.4':
    question: How would you introduce TDD into a team that is not currently practicing it?
    status: ok
    rounds: 1
    lead: >-
      I would introduce TDD incrementally: align the team on the problem it solves, run a small
      pilot, and support it with pairing, review, and fast feedback. I would measure whether the
      pilot improves confidence and delivery flow, then adapt the practice before expanding it.
    body: >-
      <p>I would treat TDD as a team learning change, not a rule imposed by
      management.</p><ol><li><strong>Establish the purpose.</strong> Explain that the goal is fast,
      trustworthy feedback and clearer design—not maximizing a coverage percentage. Discuss where
      defects, regressions, or unclear requirements currently cost the team
      time.</li><li><strong>Choose a bounded pilot.</strong> Select one upcoming feature or
      component with a supportive engineer and a manageable risk profile. Agree on what success
      means, such as easier change, earlier defect detection, or more confidence during
      review.</li><li><strong>Make the workflow visible.</strong> Use pairing or a short
      demonstration to show the test-first loop on a real task. Keep the first tests focused on
      observable behavior and keep the feedback cycle fast. Add the approach to the team’s normal
      development and review process rather than creating a separate testing
      phase.</li><li><strong>Remove practical obstacles.</strong> Ensure tests run locally and in
      continuous integration, and reserve time for coaching. Experienced engineers should review
      test intent and production design, not just syntax or coverage.</li><li><strong>Inspect and
      adapt.</strong> After the pilot, ask what became easier, where tests were slow or brittle, and
      whether the practice affected delivery or defect rates. Adjust the scope, tooling, and
      training based on evidence, then expand gradually.</li></ol><p>I would avoid requiring every
      line of code to be written test-first immediately. A sustainable rollout combines leadership
      support, psychological safety, and explicit permission to experiment; otherwise developers may
      produce superficial tests simply to satisfy a policy.</p><div class="box trap"><b
      class="t">Common trap</b><p>Launching TDD as a coverage target can reward tests that execute
      code without checking meaningful behavior. Evaluate feedback quality and maintainability, not
      just the percentage reported by a tool.</p></div>
