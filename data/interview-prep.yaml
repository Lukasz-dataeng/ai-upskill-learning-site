            <text x="796" y="58" class="svg-s">system prompt</text>
            <rect x="500" y="76" width="280" height="26" rx="5" fill="var(--card)" stroke="var(--line2)"></rect>
            <rect x="500" y="76" width="150" height="26" rx="5" fill="var(--s2)" opacity=".75"></rect>
            <text x="796" y="94" class="svg-s">retrieved context</text>
            <rect x="500" y="112" width="280" height="26" rx="5" fill="var(--card)" stroke="var(--line2)"></rect>
            <rect x="500" y="112" width="70" height="26" rx="5" fill="var(--s3)" opacity=".75"></rect>
            <text x="796" y="130" class="svg-s">conversation history</text>
            <rect x="500" y="148" width="280" height="26" rx="5" fill="var(--card)" stroke="var(--line2)"></rect>
            <rect x="500" y="148" width="40" height="26" rx="5" fill="var(--s4)" opacity=".75"></rect>
            <text x="796" y="166" class="svg-s">user query</text>
            <rect x="500" y="184" width="280" height="26" rx="5" fill="var(--card)" stroke="var(--line2)" stroke-dasharray="4 3"></rect>
            <rect x="500" y="184" width="96" height="26" rx="5" fill="var(--s5)" opacity=".55"></rect>
            <text x="796" y="202" class="svg-s">reserved for output</text>
            <text x="640" y="236" class="svg-s" text-anchor="middle">every section is a budget line — decide the split before you build the prompt</text>
          </svg>
    diagram_caption: 'Two things to internalise: attention is not uniform across position, and the window is a budget you allocate rather than a bucket you fill.'
    tiers:
      - name: Foundational
        filter_value: Foundational
        questions:
          - id: '4.1'
            question: What is a context window in the context of LLMs, and why does it matter?
            lead: The context window is the maximum number of tokens a model can attend to in a single forward pass — system prompt, conversation history, retrieved documents, the user's question, and the generated output all share it. It is the model's entire working memory for that request.
            body: |-
              <p>Why it matters, in four directions:</p>
              <ul>
                        <li><strong>Capability.</strong> It bounds what the model can reason over at once — a 200-page contract, a whole codebase, a long support thread.</li>
                        <li><strong>Statelessness.</strong> LLMs have no memory between calls. A multi-turn conversation feels continuous only because you resend the history every turn. The context window is therefore the hard limit on apparent memory.</li>
                        <li><strong>Cost and latency.</strong> Attention cost grows quadratically with sequence length in the classic formulation, and you pay per input token. Prefill time scales with input size, so a large context directly increases time-to-first-token.</li>
                        <li><strong>Quality.</strong> The advertised maximum is not the useful maximum. Performance typically degrades well before the limit, so "it fits" and "it works well" are different claims.</li>
                      </ul>
              <div class="box tip"><b class="t">Definition to be precise about</b><p>Tokens aren't words. Roughly 1 token ≈ 4 characters ≈ 0.75 English words; code, JSON and non-English text tokenise less efficiently. Quoting the ratio shows you've actually budgeted a prompt.</p></div>
          - id: '4.2'
            question: How do token limits vary across models you've worked with? Can you give approximate figures?
            lead: Give tiers and ranges rather than precise numbers — they change every few months, and the strong answer signals that you know the difference between advertised and effective window size.
            body: |-
              <div class="tw"><table>
                        <thead><tr><th>Tier</th><th>Approx. window</th><th>Representative models (mid-2026)</th><th>Typical use</th></tr></thead>
                        <tbody>
                          <tr><td><b>Small / local</b></td><td>4K – 32K</td><td>Small open-weight and older/embedded models</td><td>Edge, classification, cheap high-volume tasks</td></tr>
                          <tr><td><b>Standard</b></td><td>128K – 200K</td><td>Claude Haiku 4.5 (200K); most mid-tier open models</td><td>Everyday RAG and chat — 200K ≈ a 400–500 page book</td></tr>
                          <tr><td><b>Large</b></td><td>500K</td><td>Claude Opus 4.6–4.8, Sonnet 4.6</td><td>Whole-repository and multi-document work</td></tr>
                          <tr><td><b>Frontier</b></td><td>~1M</td><td>Claude Sonnet 5 and Claude 4.6+ generally, plus the current GPT and Gemini flagships</td><td>Codebase-scale reasoning, long agentic sessions</td></tr>
                          <tr><td><b>Headline</b></td><td>2M – 10M advertised</td><td>Gemini Pro long-context tiers; Llama 4 Scout (10M)</td><td>Mostly a marketing ceiling — quality is not demonstrated near the top</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>The two caveats that make this a good answer:</strong> first, most models deliver reliable quality at only roughly 60–70% of their stated maximum, so treat the number as a hard limit rather than a working target. Second, <strong>output limits are separate and much smaller</strong> than input limits — a model with a 1M input window may cap generation at a few tens of thousands of tokens.</p>
              <div class="box tip"><b class="t">Say this</b><p>“I'd quote ranges rather than exact figures because they move quarterly — and in design reviews I check the vendor docs rather than trusting a remembered number. What I'd actually design around is the effective window, measured with a needle-in-a-haystack test on my own data.”</p></div>
          - id: '4.3'
            question: What happens when a user's input exceeds the model's maximum context length?
            lead: The request fails — you get a hard API error (a context-length-exceeded 400), not a graceful degradation. The model cannot process the sequence at all, because positional and attention structures are defined only up to the trained length.
            body: |-
              <p>The important nuance is that <em>input + reserved output</em> must fit, so you can be rejected while the input alone is under the limit. And behaviour differs by layer:</p>
              <ul>
                        <li><strong>Raw API:</strong> immediate error. Clean, and preferable — it's visible.</li>
                        <li><strong>Frameworks and chat products:</strong> often silently truncate the oldest messages or drop retrieved chunks. This is far more dangerous, because the system keeps answering while quietly forgetting the system prompt or the instruction that mattered.</li>
                      </ul>
              <p><strong>What I'd do about it:</strong> count tokens before sending, using the model's actual tokenizer rather than a character heuristic. Budget the window explicitly — a fixed reserve for the system prompt and output, then allocate what's left between retrieved context and history. When the budget is exceeded, degrade deliberately and log it: summarise older turns, drop the lowest-scoring chunks first, or fall back to a longer-context model. Never truncate blindly from the front, which is exactly how systems lose their safety instructions.</p>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Saying "the model just forgets the earliest part." That's the framework's truncation policy talking, not the model. Attributing framework behaviour to the model is a common tell.</p></div>
      - name: Intermediate
        filter_value: Intermediate
        questions:
          - id: '4.4'
            question: What strategies would you use for documents or conversations that exceed the context window?
            lead: Match the strategy to the task, because the right answer differs for "answer a question about this document" versus "summarise the whole thing" versus "keep this conversation coherent."
            body: |-
              <p><strong>For long documents:</strong></p>
              <ul>
                        <li><strong>Retrieval (RAG)</strong> — the default for targeted questions. Don't read the document; retrieve the relevant few thousand tokens.</li>
                        <li><strong>Map-reduce</strong> — for tasks that genuinely need the whole document (summarise, extract every clause of type X): process chunks independently, then combine.</li>
                        <li><strong>Refine / iterative</strong> — carry a running answer through the chunks sequentially. Better for narrative coherence, worse for latency, and drifts over many steps.</li>
                        <li><strong>Hierarchical summarisation</strong> — summarise sections, then summarise the summaries. Good for whole-corpus overviews; lossy by construction.</li>
                      </ul>
              <p><strong>For long conversations:</strong></p>
              <ul>
                        <li><strong>Sliding window</strong> — keep the last N turns verbatim. Simple, cheap, forgets abruptly.</li>
                        <li><strong>Rolling summary + recent window</strong> — the workhorse: a compact running summary of everything older, plus the last few turns in full.</li>
                        <li><strong>Retrieval over history</strong> — embed past turns and pull back only what's relevant now. Scales indefinitely.</li>
                        <li><strong>Structured state</strong> — extract durable facts (user's name, constraints, decisions) into a small key–value store that's always injected, so they never fall out of the window.</li>
                      </ul>
              <p><strong>Cross-cutting:</strong> use prompt caching for the stable prefix (system prompt, long shared documents) — it cuts cost dramatically on repeated calls; compress retrieved context; and always leave headroom for the output.</p>
          - id: '4.5'
            question: How does chunking strategy affect the quality of information passed into the context window in a RAG pipeline?
            lead: Chunking is the highest-leverage and most under-tuned decision in RAG. The chunk is simultaneously the unit of embedding, the unit of retrieval, and the unit of context — so a bad split degrades all three at once, and no downstream component can repair it.
            body: |-
              <p><strong>The core tension:</strong></p>
              <div class="tw"><table>
                        <thead><tr><th></th><th>Small chunks (~200 tokens)</th><th>Large chunks (~1500 tokens)</th></tr></thead>
                        <tbody>
                          <tr><td><b>Embedding quality</b></td><td><span class="g">Focused, one idea per vector</span></td><td><span class="r">Diluted — averaging many topics</span></td></tr>
                          <tr><td><b>Retrieval precision</b></td><td><span class="g">High</span></td><td><span class="y">Lower — matches for the wrong reason</span></td></tr>
                          <tr><td><b>Context sufficiency</b></td><td><span class="r">Fragments; answers get cut in half</span></td><td><span class="g">Self-contained</span></td></tr>
                          <tr><td><b>Cost per query</b></td><td>Low, but you need more of them</td><td>High token spend, more noise in the window</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>What actually fixes it</strong> isn't finding a magic number — it's respecting structure. Split on semantic boundaries (headings, sections, paragraphs, function definitions), never mid-table or mid-sentence. Add 10–20% overlap so a fact spanning a boundary survives. Prepend the document title and heading path to every chunk so a retrieved fragment still knows what it's about. And consider <strong>parent-document / small-to-big retrieval</strong>: embed small precise chunks for matching, but hand the LLM the surrounding parent section — which resolves the tension rather than compromising on it.</p>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Quoting "512 tokens with 50 overlap" as a rule. It's a reasonable starting point, not an answer. The right response is that chunk size is an empirical parameter you sweep against your golden set — and that the optimum for API reference docs, legal contracts and Slack threads are wildly different.</p></div>
          - id: '4.6'
            question: Difference between sliding window, hierarchical summarisation, and retrieval-based approaches to long contexts?
            lead: 'They differ in what they throw away: sliding window discards by <em>age</em>, hierarchical summarisation discards by <em>detail</em>, and retrieval discards by <em>relevance</em>. That framing answers the question in one sentence — then compare.'
            body: |-
              <div class="tw"><table>
                        <thead><tr><th></th><th>Sliding window</th><th>Hierarchical summarisation</th><th>Retrieval-based</th></tr></thead>
                        <tbody>
                          <tr><td><b>Mechanism</b></td><td>Keep the most recent N tokens/turns, drop the rest</td><td>Summarise chunks, then summarise summaries into a tree</td><td>Index everything; fetch only what's relevant to the current query</td></tr>
                          <tr><td><b>Keeps</b></td><td>Recency, verbatim</td><td>Global gist</td><td>Query-relevant detail from anywhere</td></tr>
                          <tr><td><b>Loses</b></td><td><span class="r">Anything older — abruptly</span></td><td><span class="r">Specifics; errors compound up the tree</span></td><td><span class="r">Anything retrieval misses; global overview</span></td></tr>
                          <tr><td><b>Cost</b></td><td>Cheapest — no extra LLM calls</td><td>Expensive to build, cheap to reuse</td><td>Index cost + per-query search</td></tr>
                          <tr><td><b>Latency</b></td><td>None added</td><td>High at build time</td><td>Low (single ANN lookup)</td></tr>
                          <tr><td><b>Best for</b></td><td>Short chat sessions</td><td>“Summarise this 500-page report”</td><td>“What does clause 14.2 say?”</td></tr>
                        </tbody>
                      </table></div>
              <p>The failure each one has: sliding windows forget a constraint the user set twenty turns ago; summarisation smooths away the exact number someone will later be held to; retrieval can't answer questions whose answer isn't localised in any chunk ("what's the overall tone of this contract?").</p>
              <div class="box tip"><b class="t">The production answer</b><p>“In practice I'd combine them — a recent verbatim window for immediacy, a rolling summary for continuity, and retrieval over the full archive for specifics. Each covers the others' blind spot, and that hybrid is essentially what a good conversational memory system is.”</p></div>
      - name: Deep-dive
        filter_value: Deep-Dive
        questions:
          - id: '4.7'
            question: How does the “lost in the middle” problem affect performance with long contexts, and how would you mitigate it?
            lead: 'Models attend unevenly across position: accuracy at retrieving a fact from the context follows a U-shape, highest at the beginning and end and measurably worse in the middle. So a relevant document buried mid-prompt can be effectively invisible even though it''s technically there.'
            body: |-
              <p><strong>Why it happens:</strong> a mix of primacy from causal attention and positional encoding behaviour, recency bias, and training-data distribution — instructions typically appear at the start of documents and conclusions at the end, so the model learns those positions carry weight. The effect worsens as context length grows.</p>
              <p><strong>Mitigations, roughly in order of impact:</strong></p>
              <ol>
                        <li><strong>Use less context.</strong> The most effective fix. Rerank aggressively and pass 3–5 excellent chunks instead of 20 mediocre ones — the U-curve barely matters when there's no middle.</li>
                        <li><strong>Order strategically.</strong> Put the highest-scoring chunks first and last, weakest in the middle (sometimes called "lost-in-the-middle reordering"). Cheap and measurable.</li>
                        <li><strong>Repeat the instruction at the end.</strong> Restate the question after the context block so it occupies a high-attention position.</li>
                        <li><strong>Structure the context.</strong> Numbered, delimited chunks with headers and source labels make retrieval-within-the-prompt easier than an undifferentiated wall of text.</li>
                        <li><strong>Compress.</strong> Extractive filtering of retrieved passages before they enter the prompt.</li>
                        <li><strong>Decompose.</strong> For genuinely long material, several focused calls beat one enormous one — map-reduce sidesteps the problem entirely.</li>
                      </ol>
              <div class="box tip"><b class="t">Show you'd verify it</b><p>“I'd run a needle-in-a-haystack test on my own model and prompt format — insert a known fact at varying depths and measure recall. Vendors' long-context claims are benchmark results; the position curve for <em>your</em> prompt shape is an empirical question.”</p></div>
          - id: '4.8'
            question: What are the cost and latency implications of large context windows in production, and how would you optimise both?
            lead: Cost scales roughly linearly with input tokens; latency is worse than linear because prefill attention scales quadratically with sequence length. A 10× bigger prompt costs about 10× more and adds disproportionately to time-to-first-token — and often produces a <em>worse</em> answer because of the middle-of-context effect.
            body: |-
              <p><strong>Where the money and milliseconds go:</strong></p>
              <ul>
                        <li><strong>Prefill</strong> — processing the input. Dominates TTFT and scales with prompt size.</li>
                        <li><strong>Decode</strong> — generating tokens, roughly linear in output length, and where most of the wall-clock time goes for long answers.</li>
                        <li><strong>KV cache memory</strong> — grows with sequence length and directly limits how many concurrent requests a served model can handle. On self-hosted infra this is the real constraint on throughput.</li>
                      </ul>
              <p><strong>Optimisations that actually move the numbers:</strong></p>
              <ol>
                        <li><strong>Prompt caching</strong> — the single biggest win for repeated stable prefixes. Cached reads are typically ~90% cheaper than fresh input tokens, so structure prompts with the static part (system prompt, long shared document, few-shot examples) first and the variable part last.</li>
                        <li><strong>Retrieve less, rerank harder.</strong> Fewer, better chunks cut cost and improve quality simultaneously — the rare free lunch.</li>
                        <li><strong>Route by difficulty.</strong> Send easy queries to a small cheap model, escalate only what needs a frontier model. Often a 5–10× blended cost reduction.</li>
                        <li><strong>Stream</strong> — doesn't reduce total latency, but cuts perceived latency dramatically.</li>
                        <li><strong>Cap and monitor</strong> — token budgets per request, plus dashboards on tokens-per-query and cost-per-resolved-question rather than raw spend.</li>
                        <li><strong>Semantic caching</strong> of whole responses for repeated or near-duplicate questions.</li>
                      </ol>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Treating a big context window as a replacement for RAG. "Just put everything in the prompt" is defensible at small scale and indefensible at 100 QPS — and it usually degrades accuracy too, so it fails on both axes at once.</p></div>
          - id: '4.9'
            question: How would you design a memory system for a multi-turn conversational AI that maintains coherence beyond a single context window?
            lead: I'd design it as tiers with different lifetimes and different retrieval rules, modelled loosely on working / episodic / semantic memory — because "keep the last N turns" and "remember the user is vegetarian" are different problems that shouldn't share a mechanism.
            body: |-
              <div class="tw"><table>
                        <thead><tr><th>Tier</th><th>Holds</th><th>Storage</th><th>Injection rule</th></tr></thead>
                        <tbody>
                          <tr><td><b>Working</b></td><td>Last 5–15 turns, verbatim</td><td>In the prompt</td><td>Always, until the budget runs out</td></tr>
                          <tr><td><b>Episodic</b></td><td>Everything said in this and past sessions</td><td>Vector store, chunked by turn/topic with timestamps</td><td>Retrieved on relevance to the current message</td></tr>
                          <tr><td><b>Semantic / profile</b></td><td>Durable facts: name, role, preferences, constraints, decisions</td><td>Structured key–value or small JSON doc</td><td>Always injected — small and high value</td></tr>
                          <tr><td><b>Summary</b></td><td>Rolling compressed narrative of older turns</td><td>Text, regenerated periodically</td><td>Always injected, refreshed on a turn or token threshold</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>Write path:</strong> after each turn, an extraction step decides what is worth promoting from working memory into the profile — and, critically, handles <strong>updates and contradictions</strong>. "I moved to Berlin" must overwrite the old city, not sit alongside it. Every fact carries a timestamp, a source turn, and a confidence, so newer explicit statements win.</p>
              <p><strong>Read path:</strong> assemble the prompt in a fixed budget — system prompt, profile, rolling summary, retrieved episodic snippets, recent turns verbatim, current message. Order matters: put durable instructions where attention is strongest.</p>
              <p><strong>The hard parts to name</strong> — these are what the interviewer is listening for: forgetting and decay (memory that only grows becomes noise), contradiction resolution, privacy and deletion (a user must be able to say "forget that", and GDPR erasure has to reach the vector store too), and evaluation — you need tests for "does it remember X after 50 turns" and for false memories, which are worse than forgetting.</p>
              <div class="terms"><span class="lbl">Terms</span><span class="chip">working memory</span><span class="chip">episodic</span><span class="chip">semantic memory</span><span class="chip">rolling summary</span><span class="chip">memory decay</span><span class="chip">right to erasure</span></div>
  - id: s5
    accent: s5
    title: Model Differentiation
    summary: 'Choosing between models: architecture families, proprietary vs. open weights, benchmarking, and quantization.'
    nav_tag: trade-offs, quantization
    diagram: |-
      <svg viewBox="0 0 860 210" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="a5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
              <path d="M0,1 L7,4 L0,7" fill="none" stroke="var(--tx3)" stroke-width="1.4"></path></marker></defs>
            <text x="130" y="20" class="svg-t" text-anchor="middle">Encoder-only</text>
            <rect x="55" y="40" width="150" height="60" rx="10" class="svg-box" stroke="var(--s2)"></rect>
            <text x="130" y="66" class="svg-t" text-anchor="middle">Bidirectional</text>
            <text x="130" y="82" class="svg-s" text-anchor="middle">sees left + right</text>
            <path d="M130,112 L130,132" class="svg-arr" marker-end="url(#a5)"></path>
            <rect x="70" y="136" width="120" height="30" rx="8" class="svg-box"></rect>
            <text x="130" y="156" class="svg-t" text-anchor="middle">label / vector</text>
            <text x="130" y="188" class="svg-s" text-anchor="middle">BERT · embedding models · rerankers</text>

            <text x="430" y="20" class="svg-t" text-anchor="middle">Decoder-only</text>
            <rect x="355" y="40" width="150" height="60" rx="10" class="svg-box" stroke="var(--s5)"></rect>
            <text x="430" y="66" class="svg-t" text-anchor="middle">Causal / masked</text>
            <text x="430" y="82" class="svg-s" text-anchor="middle">sees only the left</text>
            <path d="M430,112 L430,132" class="svg-arr" marker-end="url(#a5)"></path>
            <rect x="370" y="136" width="120" height="30" rx="8" class="svg-box"></rect>
            <text x="430" y="156" class="svg-t" text-anchor="middle">next token</text>
            <text x="430" y="188" class="svg-s" text-anchor="middle">GPT · Claude · Llama · Mistral · Gemini</text>

            <text x="720" y="20" class="svg-t" text-anchor="middle">Encoder–decoder</text>
            <rect x="630" y="40" width="82" height="60" rx="10" class="svg-box" stroke="var(--s2)"></rect>
            <text x="671" y="74" class="svg-t" text-anchor="middle">Encoder</text>
            <rect x="734" y="40" width="82" height="60" rx="10" class="svg-box" stroke="var(--s5)"></rect>
            <text x="775" y="74" class="svg-t" text-anchor="middle">Decoder</text>
            <path d="M714,70 L732,70" class="svg-arr" marker-end="url(#a5)"></path>
            <text x="723" y="60" class="svg-s" text-anchor="middle">cross-attn</text>
            <path d="M775,112 L775,132" class="svg-arr" marker-end="url(#a5)"></path>
            <rect x="715" y="136" width="120" height="30" rx="8" class="svg-box"></rect>
            <text x="775" y="156" class="svg-t" text-anchor="middle">output sequence</text>
            <text x="720" y="188" class="svg-s" text-anchor="middle">T5 · BART · translation models</text>
          </svg>
    diagram_caption: 'The attention mask is the real difference: bidirectional for understanding, causal for generation, both for sequence-to-sequence.'
    tiers:
      - name: Foundational
        filter_value: Foundational
        questions:
          - id: '5.1'
            question: What are the key differences between the GPT, Claude and Gemini families in terms of capabilities and use cases?
            lead: At the frontier the capability gaps are narrower than the marketing suggests and they change with every release — so answer in terms of ecosystem, integration and durable design differences rather than claiming one is smarter.
            body: |-
              <div class="tw"><table>
                        <thead><tr><th></th><th>OpenAI (GPT)</th><th>Anthropic (Claude)</th><th>Google (Gemini)</th></tr></thead>
                        <tbody>
                          <tr><td><b>Reputation for</b></td><td>Broadest ecosystem, strong tool/function calling, large third-party tooling surface</td><td>Long-form reasoning, coding and agentic workflows, careful instruction-following, low-drama refusals</td><td>Native multimodality (video, audio, image) and very long context; deep GCP integration</td></tr>
                          <tr><td><b>Deployment</b></td><td>OpenAI API + Azure OpenAI</td><td>Anthropic API, AWS Bedrock, Google Vertex</td><td>Vertex AI / Google Cloud</td></tr>
                          <tr><td><b>Picks itself when</b></td><td>You want the widest library/SDK support</td><td>Long documents, code, agents, enterprise governance</td><td>You're on GCP, or the input is video/audio</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>Where genuine differences persist:</strong> input modalities supported natively; context window and effective long-context behaviour; the shape of tool-calling and structured-output APIs; safety and refusal behaviour, which materially affects some enterprise domains; data-residency and compliance options; and price per million tokens, which can differ severalfold for comparable quality.</p>
              <div class="box tip"><b class="t">The framing that impresses</b><p>“I'd resist ranking them in the abstract. Published benchmarks saturate and leak; what I'd do is take 50–100 representative tasks from the actual product, run all three, and score on accuracy, latency, cost and failure mode. In my experience the ranking flips by task — and I'd build behind an abstraction layer so switching is a config change, not a rewrite.”</p></div>
          - id: '5.2'
            question: What is the difference between a proprietary model and an open-source model? What are the trade-offs?
            lead: 'Proprietary models are served to you through an API — you rent capability. Open-weight models give you the weights to run yourself — you own the deployment and everything that comes with it. Note the terminology point: most "open-source" LLMs are <strong>open-weight</strong>; the training data and code usually aren''t released, and licences vary.'
            body: |-
              <div class="tw"><table>
                        <thead><tr><th></th><th>Proprietary (API)</th><th>Open-weight (self-hosted)</th></tr></thead>
                        <tbody>
                          <tr><td><b>Capability ceiling</b></td><td><span class="g">Highest available</span></td><td>Close behind, and closing</td></tr>
                          <tr><td><b>Cost model</b></td><td>Per token — scales with usage, zero fixed cost</td><td>Fixed GPU cost — cheap per token at high, steady volume</td></tr>
                          <tr><td><b>Data control</b></td><td>Data leaves your perimeter (contractual protections)</td><td><span class="g">Never leaves — VPC or on-prem</span></td></tr>
                          <tr><td><b>Customisation</b></td><td>Prompting, limited fine-tuning</td><td><span class="g">Full fine-tuning, LoRA, quantization, custom decoding</span></td></tr>
                          <tr><td><b>Ops burden</b></td><td><span class="g">None</span></td><td><span class="r">GPUs, serving stack, scaling, on-call</span></td></tr>
                          <tr><td><b>Version stability</b></td><td>Vendor may deprecate or silently update</td><td><span class="g">Frozen forever — full reproducibility</span></td></tr>
                          <tr><td><b>Latency floor</b></td><td>Network + shared queue</td><td>Controllable; can co-locate</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>The crossover logic:</strong> API models win on time-to-market, spiky traffic and frontier capability. Self-hosting wins on strict data residency, very high steady volume, heavy customisation, or a need for reproducibility. The break-even is genuinely a spreadsheet exercise — a GPU costs the same whether it's busy or idle, so utilisation is the deciding variable.</p>
              <div class="box tip"><b class="t">Common production answer</b><p>“Hybrid: a small open model self-hosted for high-volume classification, routing and extraction, and a frontier API model for the hard reasoning tail. That usually beats either pure strategy on blended cost.”</p></div>
          - id: '5.3'
            question: How would you decide which LLM to use for a given business use case?
            lead: I'd work backwards from the constraints that can disqualify a model outright, then benchmark only the survivors on real tasks. Starting from "which model is best?" is the wrong direction — most decisions are settled by requirements, not by leaderboard position.
            body: |-
              <p><strong>Step 1 — hard constraints (these eliminate candidates):</strong> data residency and compliance; whether data may leave the perimeter at all; required modalities; latency SLA; maximum acceptable cost per request; licence terms for commercial use.</p>
              <p><strong>Step 2 — task requirements:</strong> what does the task actually demand? Extraction and classification need accuracy and structured output, not reasoning depth. Agentic workflows need reliable tool calling. Long-document analysis needs effective long context. Match the requirement, not the reputation.</p>
              <p><strong>Step 3 — build a task-specific evaluation.</strong> 50–200 real examples with expected outputs, scored automatically where possible plus human review of a sample. Run every surviving candidate, including a small cheap one — you will often find a model a tenth of the price is indistinguishable on your task.</p>
              <p><strong>Step 4 — score on the full picture:</strong> quality, p95 latency, cost per 1,000 requests at projected volume, failure modes (does it fail loudly or plausibly?), rate limits and availability, and switching cost.</p>
              <p><strong>Step 5 — design for change.</strong> Abstract the provider behind an interface, keep prompts versioned and portable, and re-run the eval when new models ship. The right model in six months is probably not today's.</p>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Defaulting to the biggest model "to be safe." That's how teams end up paying frontier prices for sentiment classification. The senior instinct is to start with the cheapest model that could plausibly work and escalate only where the eval says you must.</p></div>
      - name: Intermediate
        filter_value: Intermediate
        questions:
          - id: '5.4'
            question: What are the architectural differences between encoder-only, decoder-only, and encoder-decoder transformers? Give examples.
            lead: The difference reduces to the attention mask and the training objective. Encoders attend bidirectionally and are trained to <em>understand</em>; decoders attend causally and are trained to <em>continue</em>; encoder-decoders do both and are trained to <em>transform</em> one sequence into another.
            body: |-
              <div class="tw"><table>
                        <thead><tr><th></th><th>Encoder-only</th><th>Decoder-only</th><th>Encoder–decoder</th></tr></thead>
                        <tbody>
                          <tr><td><b>Attention</b></td><td>Bidirectional — every token sees all others</td><td>Causal mask — token <em>i</em> sees only 1…<em>i</em></td><td>Bidirectional encoder + causal decoder joined by cross-attention</td></tr>
                          <tr><td><b>Objective</b></td><td>Masked language modelling</td><td>Next-token prediction</td><td>Span corruption / seq2seq</td></tr>
                          <tr><td><b>Output</b></td><td>Representations — a vector or a label</td><td>Generated text</td><td>A transformed output sequence</td></tr>
                          <tr><td><b>Examples</b></td><td>BERT, RoBERTa, DeBERTa; <b>embedding models and cross-encoder rerankers</b></td><td>GPT, Claude, Llama, Mistral, Gemini, Qwen — essentially all modern chat LLMs</td><td>T5, FLAN-T5, BART, mT5; classical NMT</td></tr>
                          <tr><td><b>Can it generate?</b></td><td><span class="r">No</span></td><td><span class="g">Yes</span></td><td><span class="g">Yes</span></td></tr>
                        </tbody>
                      </table></div>
              <p><strong>Why decoder-only won</strong> is a good thing to be able to explain: it's a single stack, so it scales more simply; every token is a training signal, making pre-training data-efficient; the KV cache makes autoregressive inference efficient; and in-context learning turned out to make explicit task-specific architectures unnecessary — you just prompt.</p>
              <div class="box tip"><b class="t">Connect it back to RAG</b><p>This isn't trivia — your RAG stack uses all three families' descendants. The <em>embedding model</em> and the <em>cross-encoder reranker</em> are encoder-style; the <em>generator</em> is decoder-only. Saying that out loud ties Section 5 to Sections 1 and 2 and reads as real understanding.</p></div>
          - id: '5.5'
            question: When would you choose a smaller, fine-tuned model over a large general-purpose model?
            lead: When the task is narrow, high-volume and well-specified. A fine-tuned 7B model can match or beat a frontier model on a single task at a fraction of the cost and latency — the frontier model's advantage is breadth, and on a narrow task you're paying for breadth you don't use.
            body: |-
              <p><strong>Choose the small fine-tuned model when:</strong></p>
              <ul>
                        <li><strong>The task is stable and repetitive</strong> — classification, entity extraction, routing, structured parsing, tone rewriting, moderation.</li>
                        <li><strong>Volume is high.</strong> Millions of calls a day is where per-token pricing hurts and a fixed GPU cost wins.</li>
                        <li><strong>Latency matters.</strong> A small model on your own hardware can be an order of magnitude faster to first token.</li>
                        <li><strong>You have labelled data</strong> — ideally a few thousand examples, which you can bootstrap by distilling from a frontier model.</li>
                        <li><strong>Data can't leave your perimeter</strong>, or you need the exact same weights available in five years.</li>
                        <li><strong>Output format must be rigid</strong> — fine-tuning is very effective at locking in a schema, and it also shortens prompts, since the instructions are baked into the weights.</li>
                      </ul>
              <p><strong>Stay with the large general model when</strong> the task space is open-ended, requirements change weekly, you lack training data, reasoning depth is the actual product, or volume is low enough that engineering time dwarfs inference cost.</p>
              <div class="box tip"><b class="t">The pattern to name</b><p>“Prototype with the frontier model to prove the task is solvable and to generate labelled data; distil into a small fine-tuned model once the spec stabilises; keep an escalation path to the big model for the hard tail. And try prompt engineering and few-shot first — fine-tuning adds a training and evaluation pipeline you have to maintain forever.”</p></div>
          - id: '5.6'
            question: How do instruction-tuned models differ from base models, and when is each appropriate?
            lead: A base model is a raw next-token predictor trained on unlabelled text — ask it a question and it may well continue with more questions, because that's what documents do. An instruction-tuned model has been post-trained on instruction–response pairs (SFT) and usually aligned with preference optimisation (RLHF/DPO) so it treats input as a request to fulfil.
            body: |-
              <div class="tw"><table>
                        <thead><tr><th></th><th>Base / pretrained</th><th>Instruction-tuned (-Instruct / -Chat)</th></tr></thead>
                        <tbody>
                          <tr><td><b>Training</b></td><td>Next-token prediction on a large corpus</td><td>+ SFT on instruction pairs, + RLHF/DPO alignment</td></tr>
                          <tr><td><b>Behaviour on “Explain photosynthesis”</b></td><td>May continue with a list of similar exam questions</td><td>Explains photosynthesis</td></tr>
                          <tr><td><b>Chat template</b></td><td>None — plain text completion</td><td>Expects a specific role/turn format; <span class="r">using the wrong template degrades quality badly</span></td></tr>
                          <tr><td><b>Safety behaviour</b></td><td>Essentially none</td><td>Trained refusals and guardrails</td></tr>
                          <tr><td><b>Best for</b></td><td>Your own fine-tuning starting point; research; pure text completion; measuring raw capability</td><td>Practically every application — chat, RAG, agents, tools</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>The practical rule:</strong> if you're building a product, use the instruction-tuned variant. Reach for the base model only when you intend to do your own substantial fine-tuning — starting from base avoids inheriting another team's alignment and formatting habits, and gives you a cleaner canvas for a heavily domain-specific model.</p>
              <div class="box trap"><b class="t">Detail that signals hands-on experience</b><p>Mention the chat template. Silently formatting prompts incorrectly for an instruct model — wrong special tokens, missing system role — is one of the most common causes of "this open model is terrible," and it's a formatting bug, not a model quality issue.</p></div>
      - name: Deep-dive
        filter_value: Deep-Dive
        questions:
          - id: '5.7'
            question: Compare the performance trade-offs between a small open model (e.g. Mistral 7B), a mid-size open model (e.g. Llama 3/4) and a frontier API model for a cost-sensitive enterprise application.
            lead: Frame it as three cost structures, not three quality levels — and lead with the observation that for a cost-sensitive application the right architecture is usually a router across all three, not a single choice.
            body: |-
              <div class="tw"><table>
                        <thead><tr><th></th><th>Small open (~7B)</th><th>Mid/large open (~70B+ or MoE)</th><th>Frontier API</th></tr></thead>
                        <tbody>
                          <tr><td><b>Quality</b></td><td>Good on narrow tasks, weak multi-step reasoning</td><td>Strong on most enterprise tasks</td><td><span class="g">Best, especially on the hard tail</span></td></tr>
                          <tr><td><b>Cost shape</b></td><td>Fixed GPU; cheapest per token at volume — can run on a single mid-range GPU quantized</td><td>Fixed but substantial GPU footprint; needs real utilisation to pay off</td><td>Pure per-token; zero fixed cost</td></tr>
                          <tr><td><b>Latency</b></td><td><span class="g">Lowest, self-hosted</span></td><td>Moderate</td><td>Network-bound; variable under load</td></tr>
                          <tr><td><b>Ops</b></td><td>Modest</td><td><span class="r">Serious — multi-GPU serving, scaling</span></td><td><span class="g">None</span></td></tr>
                          <tr><td><b>Data residency</b></td><td><span class="g">Full control</span></td><td><span class="g">Full control</span></td><td>Contractual</td></tr>
                          <tr><td><b>Best role</b></td><td>Classification, extraction, routing, guardrails, high-volume simple turns</td><td>The main workhorse when volume is steady and data must stay in-house</td><td>Hard reasoning, low-volume high-value queries, rapid iteration</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>The economics to state explicitly:</strong> a self-hosted GPU costs the same whether it serves one request or a million, so self-hosting only wins above a utilisation threshold — and that threshold is a real calculation involving GPU-hour price, tokens/second throughput, and the vendor's per-million-token rate. Below it, the API is cheaper <em>and</em> better. Above it, self-hosting can be several times cheaper. Add engineering time honestly: an ML platform engineer costs more than a lot of API tokens.</p>
              <div class="box tip"><b class="t">The recommendation to give</b><p>“Start entirely on the API to establish quality and gather real traffic. Instrument which queries are actually easy. Then move the high-volume easy segment to a small self-hosted model behind a confidence-based router, keeping the frontier model for escalation. That typically cuts blended cost several-fold without a measurable quality loss — and I'd prove that with an A/B, not an assumption.”</p></div>
          - id: '5.8'
            question: What factors would you evaluate when benchmarking two competing LLMs for a specific production task?
            lead: Public benchmarks are close to useless for this decision — they're saturated, subject to training-set contamination, and measure tasks that aren't yours. I'd build a task-specific evaluation set and treat the comparison as an experiment with controls.
            body: |-
              <p><strong>Quality:</strong> accuracy against a golden set of 100–300 real examples; task-appropriate metrics (exact match for extraction, faithfulness and citation accuracy for RAG, pass@1 for code, LLM-as-judge with a human-validated rubric for open-ended text). Report <em>distributions</em>, not just means — a model that's usually great and occasionally catastrophic may be worse for you than a consistent one.</p>
              <p><strong>Reliability:</strong> structured-output validity rate, tool-call correctness, instruction adherence, refusal rate on legitimate requests, and behaviour under adversarial or malformed input. Crucially: <em>how</em> does it fail — loudly, or with a confident wrong answer?</p>
              <p><strong>Performance:</strong> p50/p95/p99 latency and time-to-first-token measured at realistic concurrency, not single-request; throughput; rate limits and observed availability.</p>
              <p><strong>Cost:</strong> cost per completed task (not per token — a chattier model with cheaper tokens can lose), including retries and failed attempts. Model prompt-cache savings if the workload has a stable prefix.</p>
              <p><strong>Fairness of the comparison — this is where candidates slip:</strong> prompts must be optimised for each model separately. Handing model B a prompt tuned for model A and declaring B worse is the most common benchmarking error. Fix sampling parameters, run multiple trials per example to measure variance, use held-out data neither model was tuned on, and blind the human raters.</p>
              <div class="box tip"><b class="t">Close with the operational point</b><p>“And I'd keep the harness — it becomes the regression suite that tells me whether next quarter's model is actually an upgrade.”</p></div>
          - id: '5.9'
            question: How does quantization (GGUF, INT8, INT4) affect model performance, accuracy, and deployment feasibility?
            lead: Quantization stores weights at lower numerical precision — 16-bit floats down to 8 or 4 bits — which shrinks the model roughly proportionally. Since LLM inference is memory-bandwidth-bound rather than compute-bound, smaller weights mean both a smaller footprint and faster generation, at some accuracy cost.
            body: |-
              <div class="tw"><table>
                        <thead><tr><th>Precision</th><th>Size, 7B model</th><th>Typical quality impact</th><th>Notes</th></tr></thead>
                        <tbody>
                          <tr><td><b>FP16 / BF16</b></td><td>~14 GB</td><td>Baseline</td><td>Standard training/serving precision</td></tr>
                          <tr><td><b>INT8</b></td><td>~7 GB</td><td><span class="g">Near-negligible</span></td><td>Safe default; widely supported</td></tr>
                          <tr><td><b>INT4</b></td><td>~3.5 GB</td><td><span class="y">Small but real</span> — worst on reasoning, math, long-context and rare knowledge</td><td>Where consumer-hardware deployment becomes possible</td></tr>
                          <tr><td><b>Below 4-bit</b></td><td>&lt;3 GB</td><td><span class="r">Noticeable degradation</span></td><td>Research/extreme-constraint territory</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>Terminology to keep straight</strong> — a common differentiator: <strong>GGUF</strong> is a <em>file format</em> (the llama.cpp ecosystem) that happens to package quantized weights at various levels like Q4_K_M or Q8_0, and it supports CPU and hybrid CPU/GPU offload. <strong>INT8/INT4</strong> are precisions. <strong>GPTQ</strong> and <strong>AWQ</strong> are post-training quantization <em>methods</em> for GPU serving; <strong>QLoRA</strong> is fine-tuning on a quantized base. Conflating the format with the precision is the mistake to avoid.</p>
              <p><strong>Deployment consequences:</strong> a 70B model at INT4 fits on a single 48 GB GPU instead of needing multiple cards — that's the difference between a feasible and infeasible deployment, and it's usually the actual motivation. It also frees VRAM for a bigger KV cache, which raises concurrency.</p>
              <div class="box tip"><b class="t">The judgement call to state</b><p>“Given a fixed memory budget, a larger model quantized to 4-bit usually beats a smaller model at full precision. But quantization damage is task-dependent — I'd evaluate the quantized model on my own task rather than trusting a perplexity delta, because perplexity can look fine while multi-step reasoning quietly degrades.”</p></div>
              <div class="terms"><span class="lbl">Terms</span><span class="chip">GGUF</span><span class="chip">GPTQ</span><span class="chip">AWQ</span><span class="chip">QLoRA</span><span class="chip">KV cache</span><span class="chip">memory-bandwidth-bound</span></div>
