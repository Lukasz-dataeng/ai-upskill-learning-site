    diagram_caption: 'The two halves of every RAG system: an offline indexing pipeline and an online query pipeline. They must share the same embedding model.'
    tiers:
      - name: Foundational
        filter_value: Foundational
        questions:
          - id: '1.1'
            question: Can you explain what Retrieval-Augmented Generation (RAG) is and walk me through its core workflow from user query to final response?
            lead: RAG is a pattern where, instead of relying on what a model memorised during training, you retrieve relevant documents at query time and put them into the prompt so the model answers from evidence you control.
            body: |-
              <p>There are two pipelines. <strong>Offline (indexing):</strong> documents are loaded, cleaned, split into chunks, passed through an embedding model that turns each chunk into a dense vector, and written to a vector store alongside the original text and metadata.</p>
              <p><strong>Online (query time):</strong></p>
              <ol>
                        <li>The user's query is embedded with the <em>same</em> model used at index time.</li>
                        <li>The vector store runs an approximate nearest-neighbour search and returns the top-k most similar chunks.</li>
                        <li>Optionally a reranker — usually a cross-encoder — rescores those candidates and keeps the best few.</li>
                        <li>The surviving chunks are pasted into a prompt template alongside the question and an instruction like “answer only from the context; if the answer isn't there, say so.”</li>
                        <li>The LLM generates the answer, ideally citing the chunk IDs it used.</li>
                      </ol>
              <p>The key insight to say out loud: <strong>RAG does not change the model's weights.</strong> It changes what is in the context window at inference time. That is why it is cheap to update — reindex a document and the system's knowledge changes instantly.</p>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Don't describe RAG as "the model searches the internet." The model does no searching — your retrieval layer does, and the model only sees text you chose to hand it. Interviewers use this to check whether you understand where the boundary sits.</p></div>
              <div class="terms"><span class="lbl">Say these words</span><span class="chip">chunking</span><span class="chip">embedding</span><span class="chip">top-k</span><span class="chip">ANN</span><span class="chip">reranker</span><span class="chip">grounding</span><span class="chip">citation</span></div>
          - id: '1.2'
            question: Why would you choose RAG instead of relying solely on a pre-trained LLM? What problem does it solve?
            lead: A pre-trained LLM knows only what was in its training data, has no idea which parts it actually knows, and cannot cite anything. RAG fixes all three by grounding answers in retrievable, attributable source text.
            body: |-
              <p>Concretely it solves four problems:</p>
              <dl class="kv">
                        <dt>Knowledge cutoff</dt><dd>The model cannot know about your product launched last week, or last night's incident report. Retrieval supplies it.</dd>
                        <dt>Private data</dt><dd>Your contracts, tickets and wiki were never in any public training set — and you don't want them there.</dd>
                        <dt>Hallucination</dt><dd>Grounding in retrieved text plus an instruction to abstain measurably reduces fabricated answers, and gives you something to check the answer against.</dd>
                        <dt>Attribution</dt><dd>You can show the user the source paragraph. In regulated domains this is often a hard requirement, not a nice-to-have.</dd>
                      </dl>
              <p>Compared with the alternatives: <strong>fine-tuning</strong> teaches style, format and task behaviour but is a poor and expensive way to inject facts — and you must retrain to update them. <strong>Long-context stuffing</strong> (dumping the whole corpus in the prompt) works for a few hundred pages but scales badly on cost, latency and attention quality. RAG is the option where knowledge updates are a database write.</p>
              <div class="box tip"><b class="t">Strong closing line</b><p>“Fine-tuning changes how the model behaves; RAG changes what it knows. Most production systems eventually need a bit of both.”</p></div>
          - id: '1.3'
            question: What are the key components of a RAG pipeline, and how do they interact with each other?
            lead: 'Seven components: ingestion, chunker, embedding model, vector store, retriever, reranker, and generator — plus an evaluation loop wrapped around the whole thing.'
            body: |-
              <div class="tw"><table>
                        <thead><tr><th>Component</th><th>Job</th><th>Contract with its neighbours</th></tr></thead>
                        <tbody>
                          <tr><td><b>Ingestion / parsing</b></td><td>Load PDFs, HTML, tickets; strip boilerplate; extract tables</td><td>Emits clean text + metadata (source, date, permissions)</td></tr>
                          <tr><td><b>Chunker</b></td><td>Split into retrievable units with overlap</td><td>Chunk size must fit the embedding model's window and leave room in the LLM's context</td></tr>
                          <tr><td><b>Embedding model</b></td><td>Text → dense vector</td><td><span class="r">Must be identical at index and query time</span>, and its dimensionality fixes the store's schema</td></tr>
                          <tr><td><b>Vector store</b></td><td>Persist vectors + payload, serve ANN search</td><td>Index type and metric (cosine / dot) must match how embeddings were trained</td></tr>
                          <tr><td><b>Retriever</b></td><td>Turn a query into candidate chunks; apply metadata filters</td><td>Returns top-k (often 20–50) for the reranker to narrow</td></tr>
                          <tr><td><b>Reranker</b></td><td>Cross-encoder rescoring of query+chunk pairs</td><td>High precision, high cost — runs on tens of candidates, not millions</td></tr>
                          <tr><td><b>Generator (LLM)</b></td><td>Synthesise a grounded answer with citations</td><td>Needs low temperature and an explicit abstain instruction</td></tr>
                        </tbody>
                      </table></div>
              <p>The interaction that matters most: <strong>quality is bounded by the weakest upstream stage.</strong> A frontier LLM cannot rescue a retriever that returned the wrong paragraph, and a great retriever cannot rescue a chunker that cut a table in half. That is why debugging starts at ingestion, not at the prompt.</p>
      - name: Intermediate
        filter_value: Intermediate
        questions:
          - id: '1.4'
            question: How does the retrieval step in RAG differ from a traditional keyword-based search?
            lead: Keyword search matches strings; vector search matches meaning. BM25 asks “which documents contain these tokens?”, dense retrieval asks “which chunks sit closest to this query in embedding space?”
            body: |-
              <div class="tw"><table>
                        <thead><tr><th></th><th>Keyword (BM25 / inverted index)</th><th>Dense vector retrieval</th></tr></thead>
                        <tbody>
                          <tr><td><b>Unit of match</b></td><td>Exact tokens, stemmed</td><td>Semantic proximity in ℝⁿ</td></tr>
                          <tr><td><b>Handles synonyms</b></td><td><span class="r">No</span> — “car” ≠ “automobile”</td><td><span class="g">Yes</span> — that's the whole point</td></tr>
                          <tr><td><b>Rare identifiers</b></td><td><span class="g">Excellent</span> — SKUs, error codes, names</td><td><span class="y">Weak</span> — rare tokens get smoothed away</td></tr>
                          <tr><td><b>Explainability</b></td><td>You can see which terms matched</td><td>A similarity score with no human-readable reason</td></tr>
                          <tr><td><b>Cost of index</b></td><td>Cheap, sparse</td><td>Embedding compute + memory-heavy index</td></tr>
                        </tbody>
                      </table></div>
              <p>Two things follow. First, dense retrieval returns something for <em>every</em> query — there's no "no results". A low-relevance answer still comes back with a plausible-looking score, so you need a similarity threshold or a reranker to decide when to say "I don't know."</p>
              <p>Second, and this is the answer interviewers want: <strong>in production you rarely pick one.</strong> Hybrid search runs both and fuses the rankings, because the two fail in opposite directions.</p>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Claiming vector search is simply "better." A user searching for invoice <code>INV-2024-8871</code> or the error <code>ECONNRESET</code> is far better served by BM25. Saying so signals production experience.</p></div>
          - id: '1.5'
            question: What happens when the retrieved context is irrelevant or contradicts the model's training data? How would you handle that?
            lead: Two distinct failures. Irrelevant context distracts the model into confidently wrong answers; contradictory context creates a conflict between parametric memory and retrieved evidence, and which one wins is not something you should leave to chance.
            body: |-
              <p><strong>Irrelevant context.</strong> Models are strongly biased toward using what they're given — a plausible-looking but wrong passage often produces a worse answer than no context at all. Mitigations:</p>
              <ul>
                        <li>Set a <strong>similarity floor</strong>; if nothing clears it, don't call the LLM with junk — return "no supporting information found."</li>
                        <li>Add a <strong>reranker</strong> and keep only the top 3–5 after rescoring.</li>
                        <li>Add a lightweight <strong>relevance grader</strong> (a cheap model that labels each chunk keep/discard) — this is the core idea behind Corrective RAG.</li>
                        <li>Prompt explicitly: “If the context does not contain the answer, reply exactly: <code>Not found in the provided sources.</code>”</li>
                      </ul>
              <p><strong>Contradiction with training data.</strong> Decide the precedence rule deliberately and state it in the system prompt: for enterprise knowledge, retrieved documents should win, because they're current and authoritative. Then reinforce it structurally — put source, date and authority level in the context block, and instruct the model to prefer the most recent authoritative source and to <em>surface</em> the disagreement rather than silently pick a side.</p>
              <div class="box tip"><b class="t">What they're really testing</b><p>Whether you know that "just tell it to use the context" is not enough on its own. The strong answer pairs a prompt-level rule with a retrieval-level filter and an evaluation metric (faithfulness) that catches regressions.</p></div>
          - id: '1.6'
            question: Can you describe the difference between naive RAG, advanced RAG, and modular RAG architectures?
            lead: 'They''re three generations of the same idea: naive RAG is retrieve-then-read in a straight line; advanced RAG adds pre- and post-retrieval optimisation around that line; modular RAG breaks the line into reconfigurable components with routing and loops.'
            body: |-
              <div class="tw"><table>
                        <thead><tr><th>Generation</th><th>Shape</th><th>Techniques</th><th>When it's enough</th></tr></thead>
                        <tbody>
                          <tr><td><b>Naive</b></td><td>Index → retrieve top-k → generate</td><td>Fixed chunk size, single dense retrieval, one prompt</td><td>Demos, small homogeneous corpora, first sprint</td></tr>
                          <tr><td><b>Advanced</b></td><td>Same line, optimised at both ends</td><td><em>Pre:</em> query rewriting, HyDE, multi-query expansion, semantic/structure-aware chunking, metadata enrichment. <em>Post:</em> cross-encoder reranking, context compression, deduplication, ordering the best chunk first and last</td><td>Most real production systems</td></tr>
                          <tr><td><b>Modular</b></td><td>A graph of swappable modules, possibly looping</td><td>Routers (vector vs SQL vs web), agentic/iterative retrieval, self-reflection and retry (Self-RAG), corrective retrieval fallbacks (CRAG), memory modules, multi-hop planning</td><td>Heterogeneous sources, multi-hop questions, agentic products</td></tr>
                        </tbody>
                      </table></div>
              <p>The progression is driven by failure, not fashion. You move to advanced RAG when you discover retrieval is missing obviously relevant documents. You move to modular RAG when a single retrieval pass structurally cannot answer the question — “compare our 2024 and 2025 refund policy and tell me what changed” needs two retrievals and a comparison step.</p>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Jumping straight to agentic RAG. Each loop multiplies latency and cost and adds new failure modes. The senior answer is: start naive, measure, and let the evaluation data justify each addition.</p></div>
              <div class="terms"><span class="lbl">Name-drop</span><span class="chip">HyDE</span><span class="chip">multi-query</span><span class="chip">Self-RAG</span><span class="chip">CRAG</span><span class="chip">GraphRAG</span><span class="chip">context compression</span></div>
      - name: Deep-dive
        filter_value: Deep-Dive
        questions:
          - id: '1.7'
            question: How would you evaluate the quality of a RAG system? What metrics would you use?
            lead: Evaluate retrieval and generation separately, because they fail separately — then add end-to-end and operational metrics on top. If you only measure the final answer you cannot tell whether a bad answer came from bad retrieval or bad synthesis.
            body: |-
              <p><strong>Retrieval metrics</strong> (need a labelled set of query → relevant-chunk pairs):</p>
              <ul>
                        <li><strong>Recall@k</strong> — did the right chunk appear in the top k? Usually the single most important number; if recall is low, nothing downstream can save you.</li>
                        <li><strong>Precision@k</strong> — how much of what you retrieved was noise.</li>
                        <li><strong>MRR / nDCG@k</strong> — rank-aware: was the right chunk near the top, not just present.</li>
                      </ul>
              <p><strong>Generation metrics</strong> (typically LLM-as-judge, e.g. RAGAS-style):</p>
              <ul>
                        <li><strong>Faithfulness / groundedness</strong> — is every claim supported by the retrieved context? This is your hallucination detector.</li>
                        <li><strong>Answer relevance</strong> — does it actually address the question asked.</li>
                        <li><strong>Context precision / recall</strong> — bridges the two halves: was the useful context ranked highly and was all needed context present.</li>
                        <li><strong>Citation accuracy</strong> — do the cited sources really contain the claim.</li>
                      </ul>
              <p><strong>Operational:</strong> p50/p95 latency by stage, cost per query, abstention rate, and — the one that matters commercially — human thumbs-up rate on real traffic.</p>
              <div class="box tip"><b class="t">How to sound senior</b><p>“I'd build a golden set of 100–300 real questions with annotated source chunks, run it in CI on every prompt or index change, and treat a Recall@10 or faithfulness regression as a failing build. Offline eval gates the deploy; online feedback and abstention rate tell me whether the offline set still reflects reality.”</p></div>
          - id: '1.8'
            question: What are the failure modes of a RAG pipeline, and how would you debug them in production?
            lead: 'Almost every RAG failure lands in one of six buckets, and you localise it by walking the pipeline backwards from the answer: check what was retrieved before you touch the prompt.'
            body: |-
              <div class="tw"><table>
                        <thead><tr><th>#</th><th>Failure mode</th><th>Symptom</th><th>Fix</th></tr></thead>
                        <tbody>
                          <tr><td>1</td><td><b>Missing content</b></td><td>Answer is wrong; correct chunk isn't in the index at all</td><td>Ingestion gaps, failed PDF parse, permissions filter too strict</td></tr>
                          <tr><td>2</td><td><b>Retrieval miss</b></td><td>Chunk exists but isn't in top-k</td><td>Hybrid search, query rewriting, better embedding model, raise k then rerank</td></tr>
                          <tr><td>3</td><td><b>Ranking failure</b></td><td>Right chunk retrieved but buried at rank 40</td><td>Add cross-encoder reranker; tune fusion weights</td></tr>
                          <tr><td>4</td><td><b>Context loss</b></td><td>Right chunk in the prompt, ignored by the model</td><td>“Lost in the middle” — trim context, reorder best-first, compress</td></tr>
                          <tr><td>5</td><td><b>Extraction / synthesis error</b></td><td>Answer contradicts the context it was given</td><td>Lower temperature, stricter prompt, stronger model, force citations</td></tr>
                          <tr><td>6</td><td><b>Chunking damage</b></td><td>Half a table, an orphaned "it depends", a split sentence</td><td>Structure-aware splitting, overlap, parent-document retrieval</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>The debugging procedure:</strong> log every query with its retrieved chunk IDs, scores, final prompt, and answer — this is non-negotiable and is the difference between debugging and guessing. Then for a failing query: (a) is the answer in the corpus at all? (b) if yes, does it appear at any k up to 100? (c) if yes, is it in the final prompt after reranking and truncation? (d) if yes, it's a generation problem. Each "no" points at exactly one stage.</p>
              <div class="box tip"><b class="t">Add if there's time</b><p>Mention silent regressions: an embedding model version bump, a document re-parse, or a chunk-size change can quietly wreck recall with no error anywhere. Version your index and pin your embedding model.</p></div>
          - id: '1.9'
            question: How would you handle a scenario where the user's query requires information from multiple retrieved chunks that may conflict with each other?
            lead: First establish whether it's a real contradiction or just two documents from different points in time — most "conflicts" in enterprise corpora are versioning problems, and metadata solves them before the LLM ever sees the text.
            body: |-
              <p><strong>1. Prevent avoidable conflicts at index time.</strong> Every chunk carries <code>source</code>, <code>effective_date</code>, <code>version</code>, <code>authority_tier</code> and <code>status</code>. Deprecated policies get filtered out or down-weighted at retrieval, so the model never has to arbitrate between the 2023 and 2025 handbook.</p>
              <p><strong>2. Deduplicate and cluster.</strong> Near-identical chunks waste context and amplify whichever version happens to be duplicated more. Collapse them, keeping the newest.</p>
              <p><strong>3. Give the model an explicit resolution policy.</strong> Present each chunk with a labelled header (<code>[S3 | Policy Manual | v4 | 2025-06-01]</code>) and instruct: prefer the most recent authoritative source; if sources genuinely disagree on a material point, state both positions with their citations rather than silently choosing.</p>
              <p><strong>4. For multi-hop questions, decompose.</strong> If the answer requires combining facts rather than choosing between them — "which of our EU customers is affected by the clause added in v4?" — a single retrieval pass is the wrong tool. Break the query into sub-questions, retrieve per sub-question, then synthesise.</p>
              <p><strong>5. Surface, don't hide.</strong> Returning “Source A says 30 days, Source B (newer) says 14 days — I've used 14” is a better product outcome than a confident single number, and it's usually what a compliance stakeholder actually wants.</p>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Suggesting the model should "average" or "pick the most common" answer. Majority voting across duplicated documents is how stale policies win. Recency plus authority beats frequency.</p></div>
  - id: s2
    accent: s2
    title: Vector Databases
    summary: Embeddings, index structures, the accuracy/speed/memory triangle, and hybrid retrieval at scale.
