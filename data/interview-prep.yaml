id: interview-prep
title: AI Engineering Interview Preparation
short_title: Interview Prep Handbook
description: Interview-ready answers to the 44 questions covered by the AI Upskill program — RAG architecture, vector databases, model configuration, context management, and model selection. Each answer opens with a spoken-length summary, then the depth an interviewer will probe for.
footer_note: <b>Model figures verified August 2026.</b> Context windows, prices and model lineups move fast — re-check vendor docs the week of your interview rather than quoting these numbers as gospel. Saying “roughly 1M tokens for the current frontier models, and I'd verify before designing around it” is a stronger answer than a confidently wrong figure.
