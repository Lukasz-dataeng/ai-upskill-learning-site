    diagram_caption: The three index families you will be asked to compare. Flat is exact and slow; IVF partitions the space; HNSW navigates a multi-layer proximity graph.
    tiers:
      - name: Foundational
        filter_value: Foundational
        questions:
          - id: '2.1'
            question: What is a vector database, and how is it fundamentally different from a traditional relational database?
            lead: 'A vector database is built around one operation a relational database cannot do efficiently: find the k items whose high-dimensional embeddings are closest to a query vector. Relational databases answer “which rows match exactly?”; vector databases answer “which rows are most similar?”'
            body: |-
              <div class="tw"><table>
                        <thead><tr><th></th><th>Relational DB</th><th>Vector DB</th></tr></thead>
                        <tbody>
                          <tr><td><b>Query type</b></td><td>Exact predicates, joins, ranges</td><td>k-nearest-neighbour by distance</td></tr>
                          <tr><td><b>Index</b></td><td>B-tree, hash — 1-D ordered keys</td><td>HNSW graph, IVF lists, PQ codebooks</td></tr>
                          <tr><td><b>Result</b></td><td>Deterministic set — a row matches or it doesn't</td><td>Ranked list with similarity scores; approximate by design</td></tr>
                          <tr><td><b>Correctness bar</b></td><td>100% — exactness is the contract</td><td>Recall of ~95–99% traded for speed</td></tr>
                          <tr><td><b>Scaling pain</b></td><td>Write throughput, join complexity</td><td>Memory footprint of the index; index rebuild cost</td></tr>
                        </tbody>
                      </table></div>
              <p>The deeper reason B-trees don't work: they rely on a total ordering of one dimension. In 768 or 1536 dimensions there is no meaningful sort order, and classic spatial structures like KD-trees degenerate to brute force — the “curse of dimensionality.” So the field gave up on exactness and built approximate structures instead.</p>
              <div class="box tip"><b class="t">Nuance worth adding</b><p>“Vector database” is increasingly a feature, not a product category — pgvector puts ANN indexes inside Postgres, and most warehouses and search engines now ship vector types. The interesting question is usually whether you need a dedicated system, not whether you need vectors.</p></div>
          - id: '2.2'
            question: Can you explain what an embedding is and how it is generated from raw text?
            lead: An embedding is a fixed-length list of floats — typically 384 to 3072 dimensions — that represents the meaning of a piece of text, arranged so that texts with similar meaning end up close together geometrically.
            body: |-
              <p><strong>How it's produced:</strong> the text is tokenised, the tokens go through a transformer encoder, and the resulting per-token hidden states are pooled into a single vector — usually mean pooling or the <code>[CLS]</code> token. That vector is then normalised so cosine similarity reduces to a dot product.</p>
              <p><strong>Why the geometry means anything</strong> is the part people skip: it's the training objective. Embedding models are trained contrastively — pull matched pairs (a question and its answer, a sentence and its paraphrase) together, push mismatched pairs apart, typically with InfoNCE loss over in-batch negatives. The geometry is <em>learned</em>, not inherent.</p>
              <p>Three practical consequences:</p>
              <ul>
                        <li><strong>Similarity is model-specific.</strong> Two models' vectors are not comparable, even at the same dimensionality.</li>
                        <li><strong>The training data defines "similar."</strong> A model trained on web Q&amp;A may cluster legal clauses badly; domain models exist for a reason.</li>
                        <li><strong>Asymmetric tasks need asymmetric handling.</strong> Many models expect prefixes like <code>query:</code> / <code>passage:</code>; omitting them quietly costs you recall.</li>
                      </ul>
              <div class="terms"><span class="lbl">Terms</span><span class="chip">contrastive learning</span><span class="chip">mean pooling</span><span class="chip">cosine similarity</span><span class="chip">dimensionality</span><span class="chip">Matryoshka</span></div>
          - id: '2.3'
            question: Why do we store embeddings in vector databases rather than in standard databases?
            lead: You <em>can</em> store them anywhere — a float array is just bytes. What you can't do in a standard database is search them fast, because there's no index that makes similarity search sublinear without a purpose-built ANN structure.
            body: |-
              <p>Put ten million 1536-dimension vectors in a plain table and every query becomes a full scan: ten million dot products of 1536 floats each. That's tens of gigabytes of memory bandwidth per query — hundreds of milliseconds to seconds, single-user. A vector index turns that into a few thousand comparisons and single-digit milliseconds.</p>
              <p>Beyond the index, purpose-built stores give you things you'd otherwise build yourself:</p>
              <ul>
                        <li><strong>Filtered ANN</strong> — combining metadata predicates with similarity search without destroying recall (harder than it sounds; naive post-filtering can return nothing).</li>
                        <li><strong>Quantization and compression</strong> — scalar/product/binary quantization to fit the index in RAM.</li>
                        <li><strong>Hybrid scoring</strong> — built-in BM25 + dense fusion.</li>
                        <li><strong>Operational tooling</strong> — sharding, replication, namespaces/multi-tenancy, live re-indexing.</li>
                      </ul>
              <div class="box tip"><b class="t">The answer that lands</b><p>“Below roughly a million vectors, pgvector in the database you already run is usually the right call — one less system, transactional consistency with your source rows. The argument for a dedicated vector DB is scale, filtered-search quality, and operational features, not the ability to store an array.”</p></div>
      - name: Intermediate
        filter_value: Intermediate
        questions:
          - id: '2.4'
            question: What indexing strategies are used in vector databases (HNSW, IVF, Flat)? Explain the trade-offs.
            lead: 'Every index is a point on the same triangle: recall, latency, and memory. Flat maximises recall, HNSW maximises speed at high recall but costs RAM, IVF is the memory-and-build-time compromise, and quantization is the lever you pull on any of them.'
            body: |-
              <div class="tw"><table>
                        <thead><tr><th>Index</th><th>How it works</th><th>Recall</th><th>Speed</th><th>Memory</th><th>Use when</th></tr></thead>
                        <tbody>
                          <tr><td><b>Flat</b></td><td>Exhaustive scan, exact distances</td><td><span class="g">100%</span></td><td><span class="r">O(N)</span></td><td>Vectors only</td><td>&lt;100k vectors, or generating ground truth to measure other indexes</td></tr>
                          <tr><td><b>IVF / IVF-PQ</b></td><td>k-means into <code>nlist</code> cells; search <code>nprobe</code> nearest cells</td><td><span class="y">Tunable via nprobe</span></td><td>Fast</td><td>Low (esp. with PQ)</td><td>Very large static corpora, memory-constrained, batch rebuilds acceptable</td></tr>
                          <tr><td><b>HNSW</b></td><td>Multi-layer navigable small-world graph; greedy descent</td><td><span class="g">95–99%+</span></td><td><span class="g">O(log N)</span></td><td><span class="r">High</span> — graph edges often exceed vector size</td><td>Default for online RAG; incremental inserts needed</td></tr>
                          <tr><td><b>ScaNN / DiskANN</b></td><td>Anisotropic quantization; graph on SSD</td><td>High</td><td>High</td><td>Disk-resident</td><td>Billion-scale where RAM is the binding cost</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>The knobs to name:</strong> HNSW has <code>M</code> (edges per node — more edges, better recall, more memory), <code>ef_construction</code> (build-time effort) and <code>ef_search</code> (query-time effort — the runtime recall/latency dial). IVF has <code>nlist</code> and <code>nprobe</code>. Being able to say “I'd fix M and ef_construction at build time and tune ef_search against a recall target measured on a Flat baseline” is what separates a read-about-it answer from a used-it answer.</p>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Forgetting HNSW's weakness: deletes are soft (tombstones) and the graph degrades under heavy churn, so high-update workloads need periodic rebuilds. IVF also drifts as data distribution shifts away from the centroids it was trained on.</p></div>
          - id: '2.5'
            question: How does Approximate Nearest Neighbor (ANN) search work, and why is it preferred over exact search in production?
            lead: ANN deliberately gives up the guarantee of finding the true nearest neighbours in exchange for sublinear search time — and it's the right trade because in RAG a 98%-correct neighbour list produces an indistinguishable answer at a fraction of the cost.
            body: |-
              <p><strong>The mechanism</strong> is always some form of "don't look at most of the data":</p>
              <ul>
                        <li><strong>Graph-based (HNSW):</strong> vectors become nodes connected to their neighbours across layers of decreasing sparsity. A search enters at the top layer, greedily hops toward the query, drops a layer, repeats. Long edges at the top cover distance; short edges at the bottom give precision. Roughly O(log N).</li>
                        <li><strong>Partition-based (IVF):</strong> cluster the space once, then only scan the few cells nearest the query.</li>
                        <li><strong>Hash-based (LSH):</strong> hash functions that collide for nearby vectors; check only the matching buckets.</li>
                      </ul>
              <p><strong>Why exact search loses:</strong> at 10M × 1536 dims, brute force is ~15 GFLOPs of dot products per query. That's fine offline, impossible at 100 QPS with a 50 ms budget. And the accuracy you're buying is largely illusory — the embedding itself is a lossy approximation of meaning, so insisting on the exact top-10 of an approximate representation is false precision.</p>
              <div class="box tip"><b class="t">Show you'd measure it</b><p>“Recall isn't a vibe — I'd compute ground truth on a sample with a Flat index and tune <code>ef_search</code> until Recall@10 hits, say, 0.98, then check what that costs in p95 latency. That's a business decision, not a default.”</p></div>
          - id: '2.6'
            question: Which vector databases have you worked with? What were your criteria for selecting one over another?
            lead: Answer this with a decision framework plus honest specifics — interviewers can tell instantly when someone lists six databases they've only read about. Name what you actually used, then show you know the landscape.
            body: |-
              <div class="tw"><table>
                        <thead><tr><th>Option</th><th>Shape</th><th>Strength</th><th>Watch out for</th></tr></thead>
                        <tbody>
                          <tr><td><b>pgvector</b></td><td>Postgres extension</td><td>No new infrastructure; joins and transactions with your real data; HNSW + quantization is enough for ~10M vectors</td><td>You inherit Postgres' scaling story; index builds are heavy</td></tr>
                          <tr><td><b>Qdrant</b></td><td>Open-source, Rust</td><td>Best-in-class filtered search, strong hybrid, memory-efficient, easy self-host</td><td>Smaller ecosystem than Pinecone</td></tr>
                          <tr><td><b>Pinecone</b></td><td>Managed SaaS</td><td>Zero ops, serverless scaling, mature RAG integrations</td><td>Cost at scale; vendor lock-in; data residency questions</td></tr>
                          <tr><td><b>Weaviate</b></td><td>OSS + cloud</td><td>Built-in hybrid search, GraphQL, modules that embed for you</td><td>Heavier resource footprint</td></tr>
                          <tr><td><b>Milvus</b></td><td>OSS, distributed</td><td>Genuinely billion-scale, many index types, GPU support</td><td>Complex — needs a platform team</td></tr>
                          <tr><td><b>Chroma / FAISS</b></td><td>Embedded library</td><td>Fastest path to a prototype; FAISS is the research reference</td><td>Not a production database on their own</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>My selection criteria, in order:</strong> (1) scale and expected growth — under a million vectors, the answer is usually "the database you already have"; (2) filtering requirements, especially multi-tenant permission filters, where naive post-filtering silently destroys recall; (3) hybrid search support; (4) ops model — managed vs. self-hosted vs. a team that can run a distributed system; (5) data residency and compliance; (6) cost at projected QPS, not at demo scale.</p>
              <div class="box tip"><b class="t">Honest framing that works</b><p>“I've run X in production and prototyped with Y. If I were starting today for &lt;10M vectors I'd default to pgvector, move to Qdrant when filtered-search quality or throughput demanded it, and only reach for Milvus at 100M+.”</p></div>
      - name: Deep-dive
        filter_value: Deep-Dive
        questions:
          - id: '2.7'
            question: How would you handle embedding drift when your embedding model is updated but your vector store still contains old embeddings?
            lead: You can't mix them. Vectors from two different models live in incomparable spaces, so a query embedded with v2 searched against a v1 index returns effectively random results — and it fails silently, with plausible-looking scores. The only correct answer is a full re-embed, executed as a versioned migration.
            body: |-
              <p><strong>The migration pattern:</strong></p>
              <ol>
                        <li><strong>Version everything.</strong> Every collection and every vector row carries <code>embedding_model</code> and <code>model_version</code>. Queries assert the version they expect and fail loudly on mismatch.</li>
                        <li><strong>Build alongside, don't mutate.</strong> Create a new v2 collection and backfill it from the stored raw chunk text — which is why you keep the source text in the payload, not just the vector.</li>
                        <li><strong>Evaluate before switching.</strong> Run the golden query set against v1 and v2. A newer model with better MTEB scores can still be worse on your domain; this step is not optional.</li>
                        <li><strong>Shadow, then cut over.</strong> Serve from v1 while mirroring traffic to v2, compare retrieved sets and downstream answer quality, then flip behind a feature flag with a one-line rollback.</li>
                        <li><strong>Retire v1</strong> after a bake period; keep the option to roll back until you're confident.</li>
                      </ol>
              <p><strong>Cost control:</strong> backfill in batches off-peak, prioritise hot documents, and use a queue so ingest of new documents continues writing to both collections during the transition.</p>
              <div class="box trap"><b class="t">The distinction to draw</b><p>Separate <em>model change</em> drift (incompatible spaces — must re-embed) from <em>data drift</em> (the model is unchanged but your corpus vocabulary has moved — new products, new jargon). The second doesn't require re-embedding; it requires monitoring retrieval quality and possibly fine-tuning or swapping models. Interviewers love candidates who notice they're two different problems.</p></div>
          - id: '2.8'
            question: What strategies would you use to optimize retrieval relevance in a vector database at scale?
            lead: 'Work the pipeline in order of leverage: representation first, then retrieval strategy, then ranking, then the index parameters. Tuning <code>ef_search</code> is the last thing I''d do, not the first — index tuning buys recall against your own embeddings, not relevance.'
            body: |-
              <p><strong>1 · Representation.</strong> Pick the embedding model empirically on your data, not from a leaderboard. Fix the chunking — structure-aware splits that respect headings, tables and code blocks, with overlap; prepend document title and section path to each chunk so a fragment carries its context. Consider parent-document retrieval: embed small precise chunks, return the larger parent for generation.</p>
              <p><strong>2 · Retrieval strategy.</strong> Hybrid dense + BM25 fused with Reciprocal Rank Fusion. Query rewriting for conversational follow-ups ("what about the second one?" is meaningless as an embedding). Multi-query expansion for recall. Metadata pre-filtering to shrink the candidate space before scoring.</p>
              <p><strong>3 · Ranking.</strong> Retrieve wide (k=50–100), rerank narrow (keep 3–8) with a cross-encoder. This is typically the single largest relevance gain available, because a cross-encoder sees query and passage jointly rather than comparing two independently-computed vectors. Add business-aware boosts: recency, authority, document type.</p>
              <p><strong>4 · Index and infra.</strong> Now tune <code>ef_search</code>/<code>nprobe</code> against measured recall; quantize to fit in RAM; shard by tenant so filters become cheap; cache embeddings for repeated queries.</p>
              <div class="box tip"><b class="t">Close with measurement</b><p>“All of this is guesswork without a golden set and offline eval in CI. I'd change one thing at a time and keep the Recall@k / nDCG deltas.”</p></div>
          - id: '2.9'
            question: How would you design a hybrid search system that combines vector similarity search with keyword-based filtering?
            lead: 'Distinguish two things that both get called "hybrid": <strong>fusion</strong> of two ranked result sets (dense + sparse), and <strong>filtering</strong> by structured metadata. They''re different problems with different failure modes.'
            body: |-
              <p><strong>Fusion — combining BM25 and vector results.</strong> The scores aren't comparable (BM25 is unbounded, cosine is [-1,1]), so don't naively add them. Use <strong>Reciprocal Rank Fusion</strong>: score = Σ 1/(k + rank_i), typically k=60. It's rank-based, needs no score normalisation, and is remarkably hard to beat. If you do want weighted score fusion, normalise per-query (min-max over the returned set) and expose the weight as a tunable α — then tune α on your golden set, not by intuition.</p>
              <p><strong>Filtering — the part that actually bites.</strong> Three strategies:</p>
              <div class="tw"><table>
                        <thead><tr><th>Strategy</th><th>How</th><th>Failure mode</th></tr></thead>
                        <tbody>
                          <tr><td><b>Post-filter</b></td><td>ANN first, drop non-matching results</td><td><span class="r">Empty or thin results</span> when the filter is selective — the top-100 may contain zero matches</td></tr>
                          <tr><td><b>Pre-filter</b></td><td>Resolve the predicate, then brute-force within the subset</td><td>Slow when the subset is still large</td></tr>
                          <tr><td><b>Filtered ANN</b></td><td>Predicate evaluated <em>during</em> graph traversal (Qdrant, Weaviate, Milvus)</td><td>Best of both; graph connectivity can degrade under very selective filters</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>The design I'd propose:</strong> permissions and tenancy as hard pre-filters (never post-filter security — it's a correctness and leak risk, and thin results are the least of it); soft attributes like recency and doc type as reranking boosts; dense + BM25 fused with RRF; cross-encoder rerank over the fused top-50; return top-5 with citations. Then measure each stage's contribution by ablation.</p>
              <div class="terms"><span class="lbl">Terms</span><span class="chip">RRF</span><span class="chip">BM25</span><span class="chip">SPLADE</span><span class="chip">pre/post-filter</span><span class="chip">cross-encoder</span></div>
  - id: s3
    accent: s3
    title: Model Configuration & Parameters
    summary: What each sampling knob actually does to the probability distribution — and which one to touch when output goes wrong.
    nav_tag: sampling, determinism
    diagram: |-
      <svg viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg">
