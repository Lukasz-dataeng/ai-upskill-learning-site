    diagram_caption: Temperature reshapes the distribution; top-k and top-p truncate it. Penalties act on the logits before any of this.
    tiers:
      - name: Foundational
        filter_value: Foundational
        questions:
          - id: '3.1'
            question: What does the temperature parameter control in an LLM, and when would you set it low versus high?
            lead: Temperature is a divisor applied to the logits before the softmax. It controls how sharply peaked the next-token probability distribution is — low temperature concentrates probability on the model's top candidates, high temperature flattens the distribution and lets unlikely tokens through.
            body: |-
              <p>Mathematically: <code>p_i = softmax(z_i / T)</code>. As T → 0 the distribution collapses onto the argmax (greedy decoding). At T = 1 you sample from the model's raw learned distribution. Above 1 you're deliberately flattening it.</p>
              <div class="tw"><table>
                        <thead><tr><th>Setting</th><th>Behaviour</th><th>Use for</th></tr></thead>
                        <tbody>
                          <tr><td><b>0 – 0.2</b></td><td>Near-deterministic, repetitive, safe</td><td>RAG answers, classification, extraction, JSON/tool-call generation, code, SQL</td></tr>
                          <tr><td><b>0.3 – 0.7</b></td><td>Slight variety, still coherent</td><td>Summarisation, chat assistants, rewriting</td></tr>
                          <tr><td><b>0.8 – 1.2</b></td><td>Creative, surprising, occasionally incoherent</td><td>Brainstorming, fiction, marketing variants, synthetic data diversity</td></tr>
                          <tr><td><b>&gt;1.5</b></td><td>Frequently degenerate</td><td>Rarely useful outside experiments</td></tr>
                        </tbody>
                      </table></div>
              <div class="box trap"><b class="t">Trap to avoid</b><p>Saying "temperature 0 stops hallucination." It doesn't. It makes the model deterministically produce its most likely output — and if the most likely output is wrong, you now get the same wrong answer every time. Temperature controls variance, not truth. Grounding controls truth.</p></div>
          - id: '3.2'
            question: What is the max tokens parameter, and how does it affect the model's response?
            lead: Max tokens is a hard ceiling on how many tokens the model may <em>generate</em>. It is not a length instruction — the model doesn't plan around it. When the limit is hit, generation stops mid-sentence and the API returns a <code>length</code> finish reason.
            body: |-
              <p>Three things to get right:</p>
              <ul>
                        <li><strong>It's output-only, but it competes with input.</strong> Input + output must fit the context window. Many APIs reserve the max-tokens budget up front, so an over-generous setting can cause a request to fail even though the actual answer would have been short.</li>
                        <li><strong>It's a cost and latency cap, not a style control.</strong> To get short answers, instruct the model ("answer in two sentences") <em>and</em> set max tokens as a safety net. Relying on the cap alone gives you truncated garbage.</li>
                        <li><strong>Always check the finish reason.</strong> A response truncated at the limit is a bug you should detect and handle — retry with a larger budget, or stream and continue — not silently ship. This is especially dangerous with JSON output, where truncation produces unparseable results.</li>
                      </ul>
              <p>Reasoning models add a wrinkle worth mentioning: thinking tokens consume the output budget before any visible text is produced, so a limit that was comfortable for a non-reasoning model can leave nothing for the actual answer.</p>
              <div class="box tip"><b class="t">One-liner that shows care</b><p>“I set max tokens to roughly 1.5× the longest legitimate answer I've observed, log every <code>finish_reason == "length"</code>, and alert if that rate rises.”</p></div>
      - name: Intermediate
        filter_value: Intermediate
        questions:
          - id: '3.3'
            question: Explain Top-P (nucleus sampling) and how it differs from Top-K. When would you use one over the other?
            lead: Both truncate the candidate set before sampling. Top-K keeps a fixed number of tokens; Top-P keeps however many tokens are needed to reach a cumulative probability mass. The difference is that Top-P adapts to the shape of the distribution and Top-K doesn't.
            body: |-
              <p><strong>Worked example.</strong> Suppose the model is very confident — the top token has p = 0.92. With Top-K = 40 you've just admitted 39 tokens with a combined 8% probability, giving nonsense a chance it didn't earn. With Top-P = 0.9 the nucleus is a single token; you sample the obvious continuation. Now suppose the model is genuinely uncertain, with 200 tokens each around 0.4%. Top-K = 40 arbitrarily amputates a legitimate long tail; Top-P = 0.9 expands to include ~180 of them.</p>
              <div class="tw"><table>
                        <thead><tr><th></th><th>Top-K</th><th>Top-P (nucleus)</th></tr></thead>
                        <tbody>
                          <tr><td><b>Rule</b></td><td>Keep the K highest-probability tokens</td><td>Keep the smallest set whose cumulative p ≥ P</td></tr>
                          <tr><td><b>Candidate count</b></td><td>Fixed</td><td>Varies per token</td></tr>
                          <tr><td><b>Confident model</b></td><td><span class="r">Admits junk</span></td><td><span class="g">Narrows automatically</span></td></tr>
                          <tr><td><b>Uncertain model</b></td><td><span class="r">Cuts valid options</span></td><td><span class="g">Widens automatically</span></td></tr>
                          <tr><td><b>Typical values</b></td><td>20–50</td><td>0.9–0.95</td></tr>
                        </tbody>
                      </table></div>
              <p><strong>Which to use:</strong> Top-P is the sensible default and is what most APIs expose. Top-K is useful as a hard safety cap on the tail, and some stacks apply both (K first, then P). The practical guidance most providers give — and a good line to repeat — is <strong>tune temperature or top-p, not both simultaneously</strong>, because you can't attribute the effect.</p>
          - id: '3.4'
            question: What are frequency and presence penalties? How do they influence repetition and diversity?
            lead: Both subtract from the logits of tokens that have already appeared, discouraging repetition — but they differ in whether the penalty scales with how often the token appeared.
            body: |-
              <dl class="kv">
                        <dt>frequency_penalty</dt><dd>Penalty <strong>proportional to the count</strong> of prior occurrences. A word used five times is penalised five times as hard as one used once. Targets verbatim loops and overused words.</dd>
                        <dt>presence_penalty</dt><dd><strong>Flat penalty</strong> applied once a token has appeared at all, regardless of count. Pushes the model toward introducing new vocabulary and new topics.</dd>
                      </dl>
              <p>Typical ranges are −2.0 to 2.0, with useful values usually between 0.1 and 0.8. Rules of thumb: use a small <strong>frequency</strong> penalty when output degenerates into repeated phrases; use a small <strong>presence</strong> penalty when you want topical breadth, e.g. "give me 20 distinct ideas" where the model keeps circling the same three.</p>
              <div class="box trap"><b class="t">Trap to avoid — this is the real answer</b><p>These penalties are blunt token-level instruments with no semantic awareness. Push them above ~1.0 and the model starts avoiding words it <em>needs</em>: technical terms, the subject's name, required JSON keys, recurring identifiers in code. In factual or structured-output tasks, high penalties actively cause errors. For most RAG and extraction workloads the right value is <strong>0</strong> — if you're seeing repetition there, fix the prompt or the retrieved context, not the sampler.</p></div>
              <p>Note also that not every provider exposes both; some expose a single repetition penalty (a multiplicative variant common in open-source stacks), which is worth flagging if you're asked about portability across models.</p>
          - id: '3.5'
            question: How would you configure parameters differently for a creative writing task versus a factual Q&A system?
            lead: 'They optimise for opposite properties: creative writing wants variance and surprise, factual Q&amp;A wants reproducibility and grounding. Almost every parameter moves in the opposite direction.'
            body: |-
              <div class="tw"><table>
                        <thead><tr><th>Parameter</th><th>Factual Q&amp;A / RAG</th><th>Creative writing</th><th>Why</th></tr></thead>
                        <tbody>
                          <tr><td><b>temperature</b></td><td>0 – 0.2</td><td>0.8 – 1.1</td><td>Reproducibility vs. surprise</td></tr>
                          <tr><td><b>top_p</b></td><td>1.0 (let temperature do the work)</td><td>0.9 – 0.95</td><td>Trim the incoherent tail without flattening voice</td></tr>
                          <tr><td><b>frequency_penalty</b></td><td>0</td><td>0.2 – 0.5</td><td>Facts need repeated terms; prose doesn't</td></tr>
                          <tr><td><b>presence_penalty</b></td><td>0</td><td>0.2 – 0.6</td><td>Encourage new imagery and topics</td></tr>
                          <tr><td><b>max_tokens</b></td><td>Tight — answers are short</td><td>Generous</td><td>Cost control vs. room to develop</td></tr>
                          <tr><td><b>stop sequences</b></td><td>Often used for structure</td><td>Rare</td><td>Structured output needs boundaries</td></tr>
                          <tr><td><b>seed</b></td><td>Set it</td><td>Leave unset</td><td>Regression testing vs. variety across generations</td></tr>
                        </tbody>
                      </table></div>
              <p>Beyond sampling, the whole configuration differs. Factual Q&amp;A gets a strict system prompt with an abstain instruction, structured output / JSON schema enforcement, low top-k retrieval with citations, and a faithfulness check on the output. Creative writing gets a rich persona prompt, few-shot style examples, no schema, and human judgement instead of automated scoring.</p>
              <div class="box tip"><b class="t">Bonus point</b><p>Mention generating <em>n</em> candidates at high temperature and selecting the best with a critic model — the creative-task equivalent of retrieval reranking.</p></div>
      - name: Deep-dive
        filter_value: Deep-Dive
        questions:
          - id: '3.6'
            question: What is output determinism, and how would you achieve near-deterministic outputs in production?
            lead: Determinism means identical inputs produce identical outputs. Note the word "near" in the question — that's deliberate, and acknowledging why full determinism is unattainable with a hosted model is the point of the question.
            body: |-
              <p><strong>What you control:</strong></p>
              <ul>
                        <li><code>temperature = 0</code> (greedy decoding) and a fixed <code>seed</code> where the provider supports one.</li>
                        <li><strong>Pin the model version</strong> — <code>model-2026-05-01</code>, never a floating <code>-latest</code> alias. Silent model upgrades are the most common cause of "it changed and we didn't touch anything."</li>
                        <li><strong>Freeze the prompt</strong>, and everything that composes it: template version, retrieved chunks, chunk order. In RAG this is the big one — non-deterministic retrieval makes the LLM's determinism irrelevant.</li>
                        <li><strong>Constrain the output space</strong> — JSON schema / structured outputs / grammar-constrained decoding removes whole classes of variation.</li>
                        <li><strong>Cache</strong> — for a genuinely fixed input, serving a cached response is exact determinism, and it's cheaper.</li>
                      </ul>
              <p><strong>Why residual non-determinism remains:</strong> floating-point addition isn't associative, so GPU kernel reductions vary with batch composition and hardware; providers batch requests from many tenants, so your numerics depend on who else is calling. Ties in the argmax then break differently, and a single divergent token cascades. Mixture-of-experts routing adds another batch-dependent source. Providers expose <code>system_fingerprint</code> precisely so you can detect when the backend configuration changed.</p>
              <div class="box tip"><b class="t">How to close</b><p>“So I'd design for <em>stability</em> rather than bit-exactness: pin versions, constrain outputs, cache, and — most importantly — write tests that assert semantic properties (schema valid, correct field extracted, faithful to context) rather than exact string equality. String-equality tests against an LLM are flaky by construction.”</p></div>
          - id: '3.7'
            question: How do parameters like temperature interact with each other? Can conflicting settings cause unintended behaviour?
            lead: 'Yes — they compose in a specific order, and several common combinations are either redundant or actively self-defeating. The pipeline is: logits → penalties → temperature scaling → top-k truncation → top-p truncation → renormalise → sample.'
            body: |-
              <p><strong>The interactions that matter:</strong></p>
              <ul>
                        <li><strong>Temperature 0 makes top-p and top-k inert.</strong> Greedy decoding picks the argmax; truncating a distribution you never sample from changes nothing. Setting <code>temperature=0, top_p=0.7</code> isn't wrong, it's just theatre — and it misleads the next engineer into thinking top_p is doing something.</li>
                        <li><strong>High temperature + low top-p partially cancel.</strong> You flatten the distribution, then cut off the tail you just created. The result is more uniform sampling among a few candidates — not the same as either setting alone, and hard to reason about. This is why the standard advice is to tune one.</li>
                        <li><strong>Low temperature + high penalties fight each other.</strong> The temperature says "be confident and consistent"; the penalty forcibly suppresses the confident token because it appeared before. In structured output this produces malformed JSON — the model is banned from repeating a key it needs.</li>
                        <li><strong>Top-k and top-p together:</strong> the more restrictive one wins for that token, so the effective behaviour flips between them unpredictably as the distribution shape changes.</li>
                        <li><strong>max_tokens interacts with everything downstream:</strong> higher temperature tends toward more rambling output, which hits the ceiling more often, which shows up as truncation bugs rather than as a sampling problem.</li>
                      </ul>
              <div class="box tip"><b class="t">The principle to state</b><p>“Change one parameter at a time, against a fixed eval set, and record the deltas. Most production configs I've seen with five tuned knobs are the residue of undocumented debugging, and half the settings do nothing.”</p></div>
          - id: '3.8'
            question: If a deployed model is producing inconsistent or hallucinated outputs, which parameters would you adjust first and why?
            lead: I'd separate the two symptoms first, because they have different causes. Inconsistency is usually a sampling or version problem and parameters fix it. Hallucination is usually a grounding problem, and parameters barely touch it — so answering “lower the temperature” alone is the wrong answer here.
            body: |-
              <p><strong>For inconsistency — parameters first, in this order:</strong></p>
              <ol>
                        <li><code>temperature</code> → 0–0.2. Biggest single lever on variance.</li>
                        <li>Check for a floating model alias; pin the version. Then check <code>system_fingerprint</code> for a silent backend change.</li>
                        <li>Neutralise redundant knobs: <code>top_p = 1</code>, penalties = 0, so one thing controls variance.</li>
                        <li>Set a <code>seed</code> if available; add structured output constraints.</li>
                        <li>Verify the prompt is actually identical — retrieved chunks, chunk ordering, timestamps and conversation history injected into the template are common hidden sources of variation.</li>
                      </ol>
              <p><strong>For hallucination — parameters are step zero, not the fix:</strong></p>
              <ol>
                        <li>Drop temperature to near 0 and zero the penalties. Cheap, worth doing, rarely sufficient.</li>
                        <li><strong>Inspect the retrieved context.</strong> Was the answer even in the prompt? Most "hallucinations" in RAG are retrieval failures wearing a disguise.</li>
                        <li>Tighten the prompt: explicit abstain instruction, require citations per claim, clearly delimit the context block.</li>
                        <li>Reduce noise: rerank and keep fewer, better chunks; irrelevant context increases fabrication.</li>
                        <li>Add a verification pass — faithfulness scoring or a claim-checking step — and route low-confidence answers to abstention or a human.</li>
                        <li>Consider a stronger model for the generation step; some are markedly better at declining to answer.</li>
                      </ol>
              <div class="box trap"><b class="t">The line that wins this question</b><p>“Temperature controls variance, not veracity. A hallucinating model at temperature 0 just hallucinates consistently.”</p></div>
  - id: s4
    accent: s4
    title: Context Management
    summary: Windows, token budgets, chunking, the lost-in-the-middle effect, and memory beyond a single conversation.
    nav_tag: windows, chunking, memory
    diagram: |-
      <svg viewBox="0 0 860 250" xmlns="http://www.w3.org/2000/svg">
            <text x="215" y="18" class="svg-t" text-anchor="middle">“Lost in the middle” retrieval accuracy</text>
            <line x1="60" y1="200" x2="390" y2="200" stroke="var(--line2)"></line>
