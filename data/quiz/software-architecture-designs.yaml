# Generated by scripts/generate-quiz.mjs. Review this diff before publishing.
# Source of truth for the questions themselves is data/<deck>.yaml.
deck: software-architecture-designs
items:
  - question_id: '1.1'
    stem: What most clearly characterizes a monolithic architecture?
    options:
      - text: >-
          The application's main capabilities are packaged and released together as one
          deployable unit.
        why: >-
          The card explains that a monolith combines most or all application
          capabilities into a single runtime and release unit.
        correct: true
      - text: >-
          Each application capability is developed and deployed as an independently
          running service, with communication occurring through network calls.
        why: >-
          This describes a distributed or microservices architecture rather than a
          monolith's combined runtime and release unit.
      - text: >-
          All of the application's code must exist in one source file and cannot be
          organized into separate modules or layers.
        why: >-
          A monolith can still have well-defined internal modules and layers; its
          defining feature is the deployment boundary, not one-file source code.
      - text: >-
          The application must use one shared database, and every capability must store
          and retrieve data through the same schema.
        why: >-
          A shared data store is common in monoliths and can simplify consistency, but
          it is not required to define the architecture.
  - question_id: '1.2'
    stem: What is the defining characteristic of a microservices architecture?
    options:
      - text: >-
          It separates an application by technical layers such as presentation, business
          logic, and persistence, with each layer deployed as an independently scalable
          service.
        why: >-
          This confuses capability-oriented service boundaries with splitting a system
          into technical tiers.
      - text: >-
          It turns each module into a separate process while keeping a shared database
          and coordinated releases, so services avoid most network and consistency
          problems.
        why: >-
          Shared storage and coordinated releases undermine independent ownership and do
          not remove distributed-system concerns.
      - text: >-
          It gives every service its own implementation and deployment pipeline,
          allowing failures, data changes, and workflows to remain isolated without
          cross-service testing or coordination.
        why: >-
          Independent deployment does not eliminate distributed workflows, consistency
          challenges, integration testing, or operational coordination.
      - text: >-
          It divides an application into independently owned services, each focused on a
          business capability and connected through explicit APIs or messages.
        why: >-
          The card describes services as focused on capabilities, owned by teams, and
          communicating through stable API or messaging contracts.
        correct: true
  - question_id: '1.3'
    stem: >-
      Which statement best distinguishes Service-Oriented Architecture from
      microservices?
    options:
      - text: >-
          The main difference is that SOA uses large services and microservices use
          small services; both otherwise follow the same ownership, deployment, and
          integration model.
        why: >-
          It reduces the distinction to service size and ignores the important
          differences in autonomy, governance, deployment, and data ownership.
      - text: >-
          SOA and microservices are mutually exclusive architectures, because a system
          cannot combine enterprise service contracts with independently deployable,
          autonomous services.
        why: >-
          The card explicitly notes that microservices can be viewed as a more
          autonomous and independently deployable style of service architecture.
      - text: >-
          SOA often coordinates broader enterprise services through shared governance,
          whereas microservices usually emphasise autonomous teams and independently
          deployable services aligned with bounded business contexts.
        why: >-
          The card contrasts SOA's enterprise-wide governance and broader capabilities
          with microservices' autonomous ownership, independent deployment, and bounded
          contexts.
        correct: true
      - text: >-
          SOA requires a centrally governed enterprise service bus and shared standards,
          while microservices reject formal governance and must use only direct API
          calls.
        why: >-
          It treats common SOA practices as requirements and incorrectly claims that
          microservices cannot use governance or messaging.
  - question_id: '2.1'
    stem: Which statement best describes how an event-driven architecture coordinates work?
    options:
      - text: >-
          Services send commands directly to known recipients, with each producer
          responsible for invoking the consumers that must perform the next action.
        why: >-
          This describes direct request-based coupling rather than publishing immutable
          event facts through shared event infrastructure.
      - text: >-
          An event producer must know which consumers exist and update its integration
          logic whenever a new consumer is added to the workflow.
        why: >-
          EDA decouples producers from consumers, so new consumers can often be added
          without changing the producer.
      - text: >-
          Consumers process an event synchronously as part of the producer's operation,
          so the producer cannot complete until every consumer has finished.
        why: >-
          The architecture supports independent asynchronous processing rather than
          requiring every consumer to finish before the producer continues.
      - text: >-
          Services publish immutable records of state changes to event infrastructure,
          allowing independent consumers to receive and process them asynchronously.
        why: >-
          The card defines events as immutable records of facts and explains that
          producers and consumers communicate through infrastructure without direct
          coupling.
        correct: true
  - question_id: '2.2'
    stem: What is the defining communication model of the Publisher-Subscriber pattern?
    options:
      - text: >-
          The broker assigns each event to exactly one worker in a shared subscription,
          so additional subscribers divide the workload instead of each receiving the
          event.
        why: >-
          This is competing-consumer queue semantics; separate Pub/Sub subscriptions can
          independently receive the same event.
      - text: >-
          Publishers send events to the broker, which guarantees durable delivery,
          global ordering, and exactly-once processing for every subscriber.
        why: >-
          Those operational guarantees depend on the messaging system and are not
          guaranteed by the Pub/Sub pattern itself.
      - text: >-
          Publishers send events to a broker without addressing consumers directly,
          while subscribers receive events matching their declared interests.
        why: >-
          The card explains that publishers emit events to a broker without knowing the
          consumers, and that the broker routes matching events to subscriber interests.
        correct: true
      - text: >-
          Publishers send each event directly to a predetermined consumer, which
          processes it synchronously before the publisher continues.
        why: >-
          This describes point-to-point, tightly coupled request or callback
          communication rather than broker-mediated asynchronous Pub/Sub.
  - question_id: '2.3'
    stem: What is a key trade-off of asynchronous communication in distributed systems?
    options:
      - text: >-
          The two styles have essentially the same consistency and coupling
          characteristics, so the choice should depend mainly on which interface is
          simpler to implement.
        why: >-
          The card identifies different runtime coupling, consistency, resilience, and
          operational trade-offs rather than treating the choice as merely an interface
          concern.
      - text: >-
          Asynchronous communication decouples services and can absorb traffic spikes,
          but it introduces delayed results, eventual consistency, and more complex
          failure handling.
        why: >-
          The card says asynchronous work improves isolation and buffering while
          requiring status tracking, eventual consistency, and explicit failure
          handling.
        correct: true
      - text: >-
          Synchronous communication is usually preferable for high-volume workflows
          because waiting for a response prevents overload and keeps failures isolated
          between services.
        why: >-
          This reverses the trade-off: synchronous calls add capacity and failure
          coupling, while asynchronous communication can buffer spikes and isolate
          temporary outages.
      - text: >-
          Asynchronous communication gives the caller the completed result immediately,
          while queues hide latency and remove the need for retries or failure recovery.
        why: >-
          Asynchronous work returns before completion and still requires explicit
          handling of delivery failures, retries, and recovery.
  - question_id: '2.4'
    stem: >-
      Why should consumers in an at-least-once event-driven system be designed for
      idempotency?
    options:
      - text: >-
          They should recognise repeated events, using a durable event or business key
          and coordinating deduplication with the business update so retries do not
          apply the side effect twice.
        why: >-
          The card explains that retries can create duplicates and recommends durable
          idempotency keys with transactional coordination of deduplication and the
          business change.
        correct: true
      - text: >-
          They should enforce a single global event order, so consumers can process
          messages sequentially without needing to handle late or out-of-order delivery.
        why: >-
          The card says global ordering is often unnecessary and consumers may still
          need to tolerate late events even when ordering is scoped.
      - text: >-
          They should rely on the broker's exactly-once delivery guarantee, because that
          prevents retries from causing an external business side effect to be applied
          twice.
        why: >-
          The card explains that at-least-once delivery is common and that exactly-once
          behavior is difficult when consumption and external side effects are separate.
      - text: >-
          They should move any failed event directly to a dead-letter queue and discard
          it, rather than retrying or replaying it after the underlying problem is
          fixed.
        why: >-
          The card recommends bounded retries, preserving failure details, diagnosing
          the cause, and deliberate replay with idempotency still enforced.
  - question_id: '3.1'
    stem: Which description best characterizes a layered architecture?
    options:
      - text: >-
          It separates software according to where components run, such as client,
          server, and database machines, without requiring each layer to have a distinct
          responsibility.
        why: >-
          This confuses responsibility-based software layers with physical deployment
          tiers.
      - text: >-
          It lets every layer call any other layer directly, provided the calls use
          defined interfaces rather than relying on implementation details.
        why: >-
          Layered architecture normally constrains dependencies to point downward
          instead of allowing unrestricted cross-layer calls.
      - text: >-
          It places presentation, business rules, and persistence in a single service
          layer, while the surrounding layers mainly handle configuration and
          deployment.
        why: >-
          This removes the separation of responsibilities that the presentation,
          application or domain, and data-access layers are meant to provide.
      - text: >-
          It separates software into responsibility-based layers, with each layer using
          services from the layer beneath it.
        why: >-
          The card defines layers by focused responsibilities and states that
          dependencies normally point downward through the stack.
        correct: true
  - question_id: '3.2'
    stem: >-
      Which statement best describes the division of responsibility in a client-server
      architecture?
    options:
      - text: >-
          The server manages user interaction and gathers input, while the client
          applies the shared business rules and accesses protected resources.
        why: >-
          This reverses the usual responsibilities: clients present results and gather
          input, whereas servers apply shared rules and control protected resources.
      - text: >-
          The client initiates requests, while the server’s defining responsibility is
          to maintain session state; validation and business logic can remain on the
          client.
        why: >-
          Stateful session management is optional, but server-side validation and
          business logic are required to enforce authoritative shared rules.
      - text: >-
          The client manages interaction and initiates requests, while the server
          enforces shared rules, controls protected resources, and returns results.
        why: >-
          The card assigns user-facing work and request initiation to clients, and
          authentication, authorization, business logic, and resource management to
          servers.
        correct: true
      - text: >-
          The client authenticates users and enforces authorization, while the server
          mainly stores shared data and returns it to requesters.
        why: >-
          This treats the client as the security authority and reduces the server to a
          database, contrary to the server’s responsibility for access control and
          protected resources.
  - question_id: '3.3'
    stem: How does MVC divide responsibilities to promote separation of concerns?
    options:
      - text: >-
          The view receives user input and invokes model operations directly, while the
          controller is limited to formatting the model’s state for presentation.
        why: >-
          The controller is responsible for receiving and interpreting input and
          coordinating model operations, whereas formatting output is primarily the
          view’s role.
      - text: >-
          The model manages data and business rules, the view renders output, and the
          controller processes input and coordinates the other two.
        why: >-
          The card assigns domain behavior to the model, presentation to the view, and
          input handling and coordination to the controller.
        correct: true
      - text: >-
          The view owns application data and business rules, the model renders the
          user-facing output, and the controller mainly stores persistent state.
        why: >-
          This reverses the responsibilities assigned to the model and view and
          mischaracterizes the controller.
      - text: >-
          The model should contain only database access, while the controller is
          responsible for implementing the application’s business rules before passing
          results to the view.
        why: >-
          Business rules belong on the model or application-service side rather than
          accumulating in the controller; the model is more than a persistence layer.
  - question_id: '3.4'
    stem: >-
      What trade-off does the CAP theorem impose when a distributed data store
      experiences a network partition?
    options:
      - text: >-
          It must prioritise either strong consistency by restricting some requests or
          availability by serving responses that may be stale.
        why: >-
          The card explains that coordination failures during a partition force the
          store to choose between preserving strong consistency and continuing to answer
          requests.
        correct: true
      - text: >-
          It must permanently sacrifice one of consistency, availability, or partition
          tolerance, so a store cannot provide all three even when its replicas can
          communicate normally.
        why: >-
          This misstates CAP as a permanent choice of only two properties rather than a
          trade-off that arises during a network partition.
      - text: >-
          It can preserve both strong consistency and availability during a partition by
          using quorum reads and writes, because partition tolerance guarantees that
          enough replicas can always coordinate.
        why: >-
          Quorums cannot guarantee coordination across every partition; preserving
          strong consistency may require rejecting or delaying requests and therefore
          sacrificing availability.
      - text: >-
          Consistency in CAP means that replicas eventually converge after
          reconciliation, so an available store can satisfy the theorem by accepting
          conflicting writes and resolving them later.
        why: >-
          The relevant consistency guarantee is linearizable visibility of the latest
          successful write, not merely eventual convergence after conflicts are
          resolved.
  - question_id: '4.1'
    stem: >-
      What is the main deployment and scaling distinction between monolithic and
      microservices architectures?
    options:
      - text: >-
          Both monoliths and microservices are normally deployed as one application;
          microservices mainly differ by having separate internal modules that
          communicate within the same process.
        why: >-
          This reverses the deployment distinction: microservices are separately
          deployable services and commonly communicate across process or network
          boundaries.
      - text: >-
          A monolith is defined by having no modular structure, while microservices are
          defined by using separate databases for every service and therefore scale
          independently.
        why: >-
          A monolith can contain well-structured modules, and independent databases are
          not what the card identifies as the defining deployment and scaling
          distinction.
      - text: >-
          A monolith is deployed and typically scaled as one application, whereas
          microservices can be deployed and scaled independently by service.
        why: >-
          The card identifies the deployment unit and resulting scaling boundary as the
          key difference.
        correct: true
      - text: >-
          A monolith cannot be scaled horizontally, because adding capacity requires
          changing or splitting the application, whereas microservices are designed to
          scale automatically.
        why: >-
          This confuses the usual scaling boundary with an inability to scale and
          incorrectly treats microservices as automatically scalable.
  - question_id: '4.2'
    stem: What is the defining approach of the Strangler Fig pattern?
    options:
      - text: >-
          The pattern is best for systems whose capabilities cannot be separated and
          whose traffic cannot be selectively controlled, because all functionality can
          migrate behind one shared facade.
        why: >-
          The approach depends on bounded, independently testable capabilities and a
          practical way to route selected traffic during coexistence.
      - text: >-
          A routing layer gradually directs selected capabilities from the legacy system
          to tested replacements until the old paths can be retired.
        why: >-
          The card describes coexisting old and new implementations, moving bounded
          capabilities incrementally, and removing their legacy paths.
        correct: true
      - text: >-
          A permanent proxy is placed in front of the legacy application so that it can
          remain unchanged while new services are added around it.
        why: >-
          This mistakes the entry point for the pattern itself and omits deliberately
          moving capabilities and retiring their legacy implementations.
      - text: >-
          The legacy system is replaced by a newly built system in one coordinated
          cutover, avoiding the complexity of running old and new implementations
          together.
        why: >-
          This describes a big-bang rewrite rather than incremental coexistence,
          validation, rollback, and capability-by-capability migration.
  - question_id: '4.3'
    stem: What best characterizes a peer-to-peer architecture?
    options:
      - text: >-
          It distributes resource-serving responsibilities among participating nodes,
          allowing each peer to request resources in one operation and provide them in
          another.
        why: >-
          The card states that peers can act as clients or servers and that resources
          are distributed across participating nodes rather than concentrated in a
          dedicated server tier.
        correct: true
      - text: >-
          It concentrates resource-serving responsibilities in a dedicated server, while
          participating clients primarily request resources from that central authority.
        why: >-
          This describes the client-server model rather than P2P, which distributes
          serving responsibilities across participating nodes.
      - text: >-
          It requires every node to be permanently identical and to provide and request
          resources at the same time, with no directory, bootstrap service, or other
          infrastructure.
        why: >-
          P2P peers may serve in one operation and request in another, and the system
          can still use infrastructure for discovery or coordination.
      - text: >-
          It automatically eliminates bottlenecks, peer-failure problems, and
          consistency conflicts because resources are distributed across the
          participating nodes.
        why: >-
          Distribution can improve resilience and scaling, but only with mechanisms such
          as replication, discovery, conflict resolution, and membership coordination.
  - question_id: '4.4'
    stem: >-
      What is the core communication strategy in a hybrid microservices and event-driven
      architecture?
    options:
      - text: >-
          Route every interaction through the event broker and avoid synchronous calls,
          so all services remain fully decoupled and the system never waits on another
          service.
        why: >-
          It wrongly applies asynchronous messaging to immediate queries and commands,
          where the card recommends synchronous communication.
      - text: >-
          Let services share a central database for consistent cross-service updates,
          using domain events mainly as notifications after the shared records have been
          changed.
        why: >-
          It violates independent data ownership and replaces meaningful domain events
          with database-centered coupling.
      - text: >-
          Assume the broker guarantees exactly-once delivery, so consumers can update
          state without idempotency, retries, or failure isolation.
        why: >-
          The card requires consumers to tolerate repeated delivery and failures rather
          than relying on exactly-once broker behavior.
      - text: >-
          Let independently owned services publish domain events for asynchronous
          reactions, while retaining synchronous calls for operations that need an
          immediate response.
        why: >-
          The card recommends events for loose coupling and later reactions, but
          synchronous communication for immediate validation, commands, or current-data
          queries.
        correct: true
