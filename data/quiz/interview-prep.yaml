# Generated by scripts/generate-quiz.mjs. Review this diff before publishing.
# Source of truth for the questions themselves is data/<deck>.yaml.
deck: interview-prep
items:
  - question_id: '1.1'
    stem: What is the defining mechanism of Retrieval-Augmented Generation (RAG)?
    options:
      - text: >-
          RAG retrieves relevant document chunks at query time and places them in the
          prompt so the model can answer from that supplied evidence without changing
          its trained weights.
        why: >-
          The card describes retrieval into the context window at inference time and
          explicitly says that RAG does not modify the model’s weights.
        correct: true
      - text: >-
          RAG fine-tunes the language model on newly retrieved documents so that the
          model's weights are updated and its knowledge persists after the retrieval
          step.
        why: >-
          This confuses retrieval-augmented generation with fine-tuning; RAG supplies
          context at inference time without changing the model's weights.
      - text: >-
          RAG lets the language model search the document collection or internet itself,
          select the relevant sources, and use its internal search results to compose
          the answer.
        why: >-
          The retrieval layer performs the search; the model only receives the chunks
          that the application chooses to place in its prompt.
      - text: >-
          RAG retrieves documents after the model has generated an answer, using the
          retrieved text mainly to attach citations or verify what the model already
          knew.
        why: >-
          Retrieval happens before generation so the selected chunks can ground the
          model's answer, rather than serving only as post-generation verification.
  - question_id: '1.2'
    stem: What problem does RAG solve that a pre-trained LLM cannot solve on its own?
    options:
      - text: >-
          Fine-tuning is the better solution for adding private or recently changed
          facts, because the model permanently learns them and does not need a retrieval
          system at answer time.
        why: >-
          This confuses behavioral fine-tuning with knowledge injection; the card says
          facts are costly to update through fine-tuning and require retraining.
      - text: >-
          Long-context prompting is generally preferable to RAG because putting the
          entire corpus in the prompt gives the model all relevant information without
          retrieval or indexing overhead.
        why: >-
          This treats corpus stuffing as a scalable alternative, although the card says
          it becomes expensive, slow and less reliable as the corpus grows.
      - text: >-
          RAG mainly changes the model’s style and task behavior; it does not
          meaningfully address knowledge cutoffs, private data, hallucinated answers or
          source attribution.
        why: >-
          This assigns RAG’s role to fine-tuning and directly contradicts the card’s
          four stated benefits of retrieval-grounded generation.
      - text: >-
          RAG provides current or private information at retrieval time and grounds the
          response in source text that can be checked and cited.
        why: >-
          The card says retrieval addresses knowledge cutoffs and private data while
          grounding enables verification and attribution.
        correct: true
  - question_id: '1.3'
    stem: >-
      What principle best describes how the stages of a RAG pipeline affect final answer
      quality?
    options:
      - text: >-
          The reranker should score every document in the vector store before the
          generator sees any context, since reranking is the primary way to achieve high
          recall.
        why: >-
          This places the expensive cross-encoder before candidate retrieval, even
          though it is intended to rescore only tens of retrieved chunks.
      - text: >-
          The embedding model may be changed independently between indexing and querying
          as long as both models produce vectors with the store’s configured
          dimensionality.
        why: >-
          The card requires the same embedding model at index and query time; matching
          dimensionality alone does not preserve semantic compatibility.
      - text: >-
          The pipeline’s final quality is limited by its weakest upstream stage, so
          debugging should begin with ingestion and retrieval rather than the prompt
          alone.
        why: >-
          The card says a generator cannot compensate for incorrect retrieval, and that
          debugging starts at ingestion.
        correct: true
      - text: >-
          Because the generator synthesises the final response, prompt design and
          temperature are the main quality controls; a capable LLM can usually
          compensate for incomplete retrieval.
        why: >-
          This treats the generator as able to overcome upstream retrieval failures,
          contrary to the pipeline’s weakest-stage constraint.
  - question_id: '1.4'
    stem: How do production RAG systems commonly combine keyword and dense retrieval?
    options:
      - text: >-
          They run keyword search first and invoke vector retrieval only when BM25
          returns no results.
        why: >-
          Dense retrieval does not serve merely as a fallback: it returns a result for
          every query, and hybrid systems fuse both rankings.
      - text: >-
          They run both retrieval methods and fuse their rankings so each can compensate
          for the other’s weaknesses.
        why: >-
          The card says production systems rarely choose one method because keyword and
          dense retrieval fail in opposite directions.
        correct: true
      - text: >-
          They use dense vector retrieval exclusively, since semantic similarity
          subsumes exact token matching and handles every query better.
        why: >-
          This ignores dense retrieval’s weakness with rare identifiers and the card’s
          recommendation to combine both methods.
      - text: >-
          They keep BM25 as the sole retriever, because exact token matches are more
          reliable than embedding similarity for supplying context.
        why: >-
          This misses the synonym and paraphrase cases where dense retrieval helps, as
          well as the production use of hybrid search.
  - question_id: '1.5'
    stem: >-
      How should a RAG system handle retrieved context that is irrelevant or conflicts
      with the model’s existing knowledge?
    options:
      - text: >-
          Filter out weakly relevant passages before generation, and explicitly
          prioritise recent authoritative sources while requiring disagreements to be
          surfaced.
        why: >-
          The card recommends similarity thresholds, reranking or relevance grading for
          irrelevant context, and a stated precedence rule with source authority and
          conflict disclosure for contradictions.
        correct: true
      - text: >-
          Pass all retrieved passages to the model and tell it to use them as helpful
          background, since the model can ignore irrelevant text and reconcile
          contradictions on its own.
        why: >-
          This assumes prompting and the model's judgment are sufficient, even though
          irrelevant passages can make answers worse and conflicts require an explicit
          precedence rule.
      - text: >-
          Treat the model's training knowledge as the default authority, using retrieved
          documents only when they agree with what the model already knows.
        why: >-
          This reverses the recommended precedence for enterprise knowledge, where
          current and authoritative retrieved documents should generally override
          parametric memory.
      - text: >-
          When retrieval conflicts with the model, discard the conflicting passages and
          answer from the remaining context or the model's prior knowledge without
          exposing the disagreement.
        why: >-
          Silently removing contradictory evidence prevents conflict disclosure and can
          preserve an outdated or unsupported answer instead of surfacing the
          disagreement.
  - question_id: '1.6'
    stem: Which statement best distinguishes naive, advanced, and modular RAG architectures?
    options:
      - text: >-
          Naive RAG uses a fixed retrieve-then-generate path, while advanced and modular
          RAG mainly improve retrieval quality by tuning embeddings and increasing
          top-k.
        why: >-
          It reduces advanced RAG to retrieval tuning and misses its pre- and
          post-retrieval steps and modular RAG's routing and loops.
      - text: >-
          Advanced RAG replaces the linear pipeline with routers, iterative retrieval,
          and self-reflection, whereas modular RAG keeps one retrieval pass but uses
          better chunking and reranking.
        why: >-
          It assigns modular RAG's defining graph structure to advanced RAG and advanced
          techniques to modular RAG.
      - text: >-
          Naive RAG is intended for complex multi-hop questions, advanced RAG is mainly
          for demos, and modular RAG is the standard choice for small homogeneous
          corpora.
        why: It reverses the card's guidance about when each architecture is sufficient.
      - text: >-
          Naive RAG follows a fixed retrieve-then-generate path, advanced RAG optimises
          that path before and after retrieval, and modular RAG connects replaceable
          components that can route, loop, or retry.
        why: >-
          The card defines naive RAG as a straight retrieval pipeline, advanced RAG as
          pre- and post-retrieval optimisation, and modular RAG as a reconfigurable
          graph of modules.
        correct: true
  - question_id: '1.7'
    stem: >-
      Why should a RAG system be evaluated with separate retrieval and generation
      metrics rather than only with its final-answer quality?
    options:
      - text: >-
          Retrieval recall is the main quality metric; once the relevant chunks are
          present, generation quality can be assumed from the retrieved evidence.
        why: >-
          Relevant context does not guarantee a faithful or relevant answer, so
          generation needs its own evaluation.
      - text: >-
          Operational measures such as latency, cost, and abstention rate should replace
          labelled retrieval and generation evaluations because they reflect real
          production performance.
        why: >-
          Operational metrics matter, but they do not reveal whether failures come from
          missing context or faulty answer synthesis.
      - text: >-
          Separate metrics reveal whether an incorrect answer originated from missing
          relevant context or from faulty answer synthesis.
        why: >-
          The card says retrieval and generation can fail independently, so measuring
          only the final answer cannot identify which stage caused the problem.
        correct: true
      - text: >-
          An end-to-end correctness score is sufficient, because it captures the quality
          of retrieval and generation in the metric that users ultimately experience.
        why: >-
          It ignores that retrieval and synthesis fail independently, so a final-answer
          score cannot identify the source of an error.
  - question_id: '1.8'
    stem: How should you debug a failing RAG query in production?
    options:
      - text: >-
          Once the correct chunk appears in retrieval, treat the remaining failure as a
          generation issue and focus on temperature, prompting, or model changes rather
          than checking truncation, reranking, or context position.
        why: >-
          A retrieved chunk can still be lost during prompt assembly or ignored because
          of context-position effects, so generation is not the only remaining failure
          stage.
      - text: >-
          Log the retrieved chunks, scores, final prompt, and answer, then check in
          order whether the answer exists in the corpus, appears in retrieval, reaches
          the final prompt, or fails during generation.
        why: >-
          The debugging procedure requires these logs and traces each failure backwards
          through corpus presence, retrieval, prompt assembly, and generation.
        correct: true
      - text: >-
          Start by inspecting the final prompt and tuning its instructions; retrieval
          details are secondary, so logging the answer and prompt is sufficient unless
          the model reports a missing source.
        why: >-
          It reverses the prescribed debugging order and omits the required retrieved
          chunk IDs and scores.
      - text: >-
          For a failing query, first search the index at increasing values of k; if the
          relevant chunk is absent from the results, improve retrieval, without first
          checking whether the answer was ingested into the corpus.
        why: >-
          It skips the initial corpus-presence check, so missing content can be
          misdiagnosed as a retrieval miss.
  - question_id: '1.9'
    stem: What is the best first approach when retrieved chunks appear to conflict?
    options:
      - text: >-
          Check their source metadata, dates, versions, authority, and status first,
          because many apparent contradictions are caused by documents from different
          points in time.
        why: >-
          The card says to distinguish genuine disagreement from versioning problems and
          use metadata to resolve avoidable conflicts before the model processes the
          text.
        correct: true
      - text: >-
          Pass all retrieved chunks to the model without filtering, since it can compare
          their wording and infer which statement is correct from the surrounding
          context.
        why: >-
          This skips the metadata-based version, authority, and status checks that
          should resolve avoidable conflicts before generation.
      - text: >-
          Resolve conflicting statements by selecting the answer supported by the
          greatest number of retrieved chunks, treating repeated wording as evidence
          that the policy is current.
        why: >-
          This confuses duplicate or stale documents with authoritative evidence and can
          let an older policy win by frequency.
      - text: >-
          Ask the model to reconcile conflicting values into a single compromise answer,
          such as averaging the deadlines, so the user receives one clear result rather
          than competing positions.
        why: >-
          Averaging or silently merging incompatible policy statements hides material
          disagreement instead of citing the sources and applying recency and authority.
  - question_id: '2.1'
    stem: >-
      What fundamentally distinguishes a vector database from a traditional relational
      database?
    options:
      - text: >-
          It stores high-dimensional embeddings but retrieves records by exact metadata
          predicates and joins, just as a relational database does.
        why: >-
          This mistakes vector storage for vector similarity search and describes the
          relational query model instead.
      - text: >-
          It returns the exact records closest to a query vector with a deterministic
          guarantee, using ordinary ordered indexes to find them.
        why: >-
          Vector databases normally provide approximate nearest-neighbour results and do
          not rely on one-dimensional B-tree ordering.
      - text: >-
          It groups records into broad clusters and returns a matching cluster, rather
          than ranking individual records by their vector distance.
        why: >-
          Clustering structures such as IVF can support search, but the result is still
          a ranked k-nearest-neighbour list.
      - text: >-
          It ranks the k records with embeddings nearest to a query vector, rather than
          returning rows that satisfy exact predicates.
        why: >-
          The card contrasts vector databases' k-nearest-neighbour similarity queries
          with relational databases' exact predicates, joins, and ranges.
        correct: true
  - question_id: '2.2'
    stem: >-
      Which statement best describes how an embedding is produced from text and why its
      geometry reflects meaning?
    options:
      - text: >-
          The text is tokenised and passed through an autoregressive language model,
          with the final token's hidden state used directly as the document vector; no
          pooling is needed.
        why: >-
          The card describes pooling token-level encoder representations, not taking the
          final autoregressive state without pooling.
      - text: >-
          The transformer produces a vector whose semantic geometry is inherent in its
          architecture; normalising that vector is what makes matched texts close and
          mismatched texts distant.
        why: >-
          Normalisation changes the similarity calculation, while contrastive
          training—not the architecture alone—learns which texts should be close.
      - text: >-
          The text is tokenised and encoded by a transformer, whose token
          representations are pooled into one normalised vector; contrastive training
          makes semantically matched texts close and mismatched texts distant.
        why: >-
          The card explains tokenisation, transformer encoding, pooling and
          normalisation, then says contrastive training learns the geometric
          relationships.
        correct: true
      - text: >-
          The text is converted into a bag of word or token counts, then reduced to a
          fixed-size vector; texts are close mainly when they share many of the same
          terms.
        why: >-
          This substitutes lexical count-based features for transformer hidden states
          and learned semantic geometry.
  - question_id: '2.3'
    stem: Why are vector databases useful for large-scale embedding search?
    options:
      - text: >-
          They are preferred mainly because separating embeddings into another system
          keeps them transactionally consistent with the source rows.
        why: >-
          Dedicated vector stores generally add a consistency boundary; the card
          identifies scale, filtered-search quality, and operational features as their
          advantages.
      - text: >-
          They provide purpose-built approximate-nearest-neighbour indexes that avoid
          scanning every stored vector for each query.
        why: >-
          The card says a plain table requires a full scan, while a vector index reduces
          the search to a few thousand comparisons.
        correct: true
      - text: >-
          They are necessary because standard databases cannot store high-dimensional
          embeddings as float arrays or retrieve them as records.
        why: >-
          This confuses the ability to store the data with the ability to search it
          efficiently; ordinary databases can store embeddings.
      - text: >-
          They make similarity search exact by comparing every stored vector against the
          query with a more efficient implementation of the same full scan.
        why: >-
          The key benefit is an approximate-nearest-neighbour index that avoids
          comparing every vector, not a faster full scan or guaranteed exact search.
  - question_id: '2.4'
    stem: >-
      Which statement best captures the main trade-off among Flat, HNSW, and IVF vector
      indexes?
    options:
      - text: >-
          Flat provides exact, maximum-recall search but scales linearly; HNSW offers
          fast high-recall search with high memory use, while IVF reduces memory and
          build costs with tunable recall.
        why: >-
          The card describes Flat as exhaustive and exact, HNSW as fast but
          memory-heavy, and IVF as the memory-and-build-time compromise with recall
          controlled by nprobe.
        correct: true
      - text: >-
          IVF provides exact maximum-recall results because searching the nearest
          centroid is equivalent to scanning every vector; nprobe mainly changes
          latency, not recall.
        why: >-
          It confuses centroid selection with exhaustive search and incorrectly treats
          IVF recall as fixed and exact.
      - text: >-
          HNSW achieves its speed by using less memory than Flat and IVF, but its recall
          is generally lower because graph navigation examines only a small subset of
          vectors.
        why: >-
          It reverses HNSW's memory trade-off and understates its usual high-recall
          performance.
      - text: >-
          HNSW is the best choice for heavily changing collections because its graph
          supports incremental inserts without maintenance, whereas IVF is intended for
          frequently updated data.
        why: >-
          It ignores HNSW's tombstone and graph-degradation problems under heavy churn
          and misstates IVF's preference for static corpora.
  - question_id: '2.5'
    stem: >-
      Why is approximate nearest-neighbour search generally preferred to exact search in
      production systems?
    options:
      - text: >-
          It uses an index to calculate the exact nearest neighbours without scanning
          every vector, preserving exhaustive-search accuracy while reducing latency.
        why: >-
          ANN indexes reduce the amount of data examined by accepting that some true
          nearest neighbours may be missed.
      - text: >-
          It compresses the vectors into a lower-dimensional representation and then
          performs an exact search over that smaller representation.
        why: >-
          Dimensionality reduction is not the defining ANN mechanism; ANN primarily
          avoids examining most vectors through graphs, partitions, or hash buckets.
      - text: >-
          It is preferred mainly because approximate neighbours are more semantically
          accurate than exact neighbours, so production systems can trade speed for
          better retrieval quality.
        why: >-
          ANN improves cost and latency, but its neighbours are not inherently more
          accurate; it deliberately gives up some retrieval accuracy.
      - text: >-
          It searches only part of the vector space, giving up a small amount of
          neighbour accuracy for much lower query cost and latency.
        why: >-
          The card explains that ANN avoids scanning most data, achieving sublinear
          search while trading exactness for practical production performance.
        correct: true
  - question_id: '2.6'
    stem: What decision framework should guide the choice of a vector database?
    options:
      - text: >-
          Default to a managed service such as Pinecone for every production workload,
          because eliminating infrastructure work outweighs concerns about vendor
          lock-in, residency, and cost at scale.
        why: >-
          The card treats managed SaaS as one operating-model choice and explicitly
          identifies lock-in, residency, and scale cost as trade-offs.
      - text: >-
          Start with Chroma or FAISS and keep that choice for production as the corpus
          grows, since an embedded library provides the same database capabilities
          without introducing distributed infrastructure.
        why: >-
          The card describes Chroma and FAISS as excellent for prototypes but not
          production databases on their own.
      - text: >-
          Evaluate expected scale first, then filtering and hybrid-search needs,
          operating model, compliance requirements, and projected cost rather than
          choosing from benchmark or demo results alone.
        why: >-
          The card lists scale, filtering, hybrid search, operations, residency and
          compliance, and projected-QPS cost as its selection criteria.
        correct: true
      - text: >-
          Choose the database with the strongest benchmark latency and highest
          advertised vector capacity, since those measurements matter more than
          deployment details or the shape of the application data.
        why: >-
          This reduces selection to benchmark results and ignores filtering, joins,
          operations, compliance, and projected cost.
  - question_id: '2.7'
    stem: >-
      What is the correct way to handle an embedding model update when the vector store
      still contains embeddings from the previous model?
    options:
      - text: >-
          Treat the change as ordinary data drift: keep the current vectors, monitor
          retrieval quality on recent queries, and fine-tune or swap the model only if
          results worsen.
        why: >-
          This confuses corpus or vocabulary change with a model-version change, which
          requires re-embedding rather than monitoring alone.
      - text: >-
          Perform a versioned migration: re-embed the stored source text into a separate
          collection, validate the new index, and switch to it only after evaluation and
          shadow testing.
        why: >-
          The card says embeddings from different models cannot be compared and
          recommends building a new versioned collection, evaluating it, and cutting
          over after shadow traffic.
        correct: true
      - text: >-
          Keep the existing v1 index and embed incoming queries with v2, since a
          stronger model should still retrieve the closest v1 vectors; monitor scores
          for any degradation.
        why: >-
          This incorrectly assumes embeddings from different model versions share a
          comparable vector space.
      - text: >-
          Re-embed documents gradually in place, replacing v1 vectors as batches finish,
          and let queries search the collection throughout the migration.
        why: >-
          This creates a mixed-version index without isolation or version assertions, so
          queries can compare incompatible vectors during the rollout.
  - question_id: '2.8'
    stem: >-
      Which sequence best reflects the card’s recommended approach to improving vector
      retrieval relevance at scale?
    options:
      - text: >-
          Improve the representation first, then the retrieval strategy and reranking,
          and only afterward tune index parameters against measured recall.
        why: >-
          The card orders optimisation as representation, retrieval, ranking, and
          finally index and infrastructure tuning.
        correct: true
      - text: >-
          Start by increasing ef_search or nprobe and enlarging the candidate set, since
          index recall is the main determinant of retrieval relevance; change the
          embeddings only if that fails.
        why: >-
          It treats index tuning as the first and primary intervention, even though it
          only improves recall against the existing representations.
      - text: >-
          Use a strong dense embedding model with larger chunks and retrieve the top
          results directly, avoiding BM25, query expansion, and cross-encoder reranking
          to keep the pipeline simple.
        why: >-
          It ignores the card's hybrid retrieval, query rewriting, multi-query
          expansion, and reranking strategies that address lexical gaps and
          passage-level relevance.
      - text: >-
          Keep the representation and retrieval pipeline fixed, then apply
          business-aware boosts and a cross-encoder to the top few vector results; this
          should provide most of the relevance improvement.
        why: >-
          It applies ranking before validating the embedding and retrieval strategy,
          although poor chunking or candidate recall can prevent the reranker from
          recovering the right documents.
  - question_id: '2.9'
    stem: >-
      Which approach correctly separates result fusion from metadata filtering in a
      hybrid search system?
    options:
      - text: >-
          Add the BM25 and cosine-similarity scores directly, then sort the combined
          results before applying metadata filters and reranking.
        why: >-
          It treats scores from different scales as comparable and delays filtering,
          which can produce thin results or violate security constraints.
      - text: >-
          Run an unrestricted ANN search, post-filter the results for permissions and
          tenancy, and rerank the remaining documents with a cross-encoder.
        why: >-
          Security filters must be hard pre-filters; post-filtering can expose
          unauthorized candidates and leave too few valid results.
      - text: >-
          Apply every metadata condition as a hard pre-filter and brute-force vector
          search within the resulting subset, using those filters instead of reranking
          soft attributes.
        why: >-
          Pre-filtering all attributes is unnecessarily slow for large subsets and loses
          the recommended use of soft attributes as reranking boosts.
      - text: >-
          Fuse dense-vector and BM25 rankings with Reciprocal Rank Fusion, apply
          permissions and tenancy as hard pre-filters, then rerank the combined top
          results with a cross-encoder.
        why: >-
          The card recommends RRF for dense-plus-BM25 fusion, hard pre-filters for
          security constraints, and cross-encoder reranking afterward.
        correct: true
  - question_id: '3.1'
    stem: What does changing an LLM's temperature primarily affect?
    options:
      - text: >-
          Low temperature improves factual accuracy by suppressing hallucinations, while
          high temperature makes the model more reliable by encouraging it to consider
          additional possibilities.
        why: >-
          Temperature changes output variance, not factuality or grounding; high
          temperature does not make answers more reliable.
      - text: >-
          Low temperature flattens the next-token distribution and increases variation,
          while high temperature sharpens it around the model’s most likely token for
          deterministic output.
        why: >-
          The effects are reversed: dividing logits by a low temperature sharpens the
          distribution, whereas a high temperature flattens it.
      - text: >-
          High temperature is best for structured outputs such as JSON, code, and
          extraction, while low temperature is preferable for brainstorming, fiction,
          and generating diverse marketing variants.
        why: >-
          The recommended uses are reversed: structured and exact tasks generally use
          low temperature, while creative variety generally uses higher temperature.
      - text: >-
          Low temperature concentrates probability on likely tokens for predictable
          outputs, while high temperature flattens the distribution to allow more varied
          and surprising outputs.
        why: >-
          The card says temperature controls the sharpness of the next-token
          distribution: low values are near-deterministic, while high values increase
          variety.
        correct: true
  - question_id: '3.2'
    stem: What happens when a model reaches the max tokens limit?
    options:
      - text: >-
          The model treats the value as a target for response length, usually planning a
          complete answer that ends naturally near the requested token count.
        why: >-
          Max tokens is a hard ceiling and cost or latency cap, not a length instruction
          the model plans around.
      - text: >-
          When the limit is reached, the API automatically continues generation in
          another segment so the response remains complete, without requiring special
          handling.
        why: >-
          Hitting the limit stops generation and produces a length finish reason;
          continuation or retry must be implemented by the application.
      - text: >-
          Generation stops once the limit is reached, potentially mid-sentence, and the
          API reports a length finish reason.
        why: >-
          The card defines max tokens as a hard ceiling on generated tokens and says
          reaching it stops generation with a length finish reason.
        correct: true
      - text: >-
          The limit applies to the combined input and output, so it determines how many
          tokens remain available for generation after the prompt is counted.
        why: >-
          This confuses max tokens being output-only with the separate context-window
          constraint that input and output must fit.
  - question_id: '3.3'
    stem: What is the key difference between Top-K and Top-P sampling?
    options:
      - text: >-
          Top-P should be combined with Top-K whenever possible, and both should be
          tuned together so the candidate set is controlled by probability mass and a
          hard count at the same time.
        why: >-
          Although some systems apply both, the card recommends tuning temperature or
          Top-P rather than simultaneously tuning multiple sampling controls.
      - text: >-
          Top-K always samples from a fixed number of highest-probability tokens,
          whereas Top-P selects as many tokens as needed to reach a chosen cumulative
          probability.
        why: >-
          The card says Top-K has a fixed candidate count, while Top-P varies its
          candidate set according to cumulative probability mass.
        correct: true
      - text: >-
          Top-P always samples from a fixed number of the most likely tokens, while
          Top-K expands or contracts the candidate set until a target probability mass
          is covered.
        why: >-
          This reverses the defining behavior: Top-K fixes the candidate count, whereas
          Top-P fixes the cumulative probability threshold.
      - text: >-
          Top-K is generally the better default because its fixed candidate count
          automatically narrows confident predictions and preserves more valid choices
          when the model is uncertain.
        why: >-
          Those adaptive behaviors belong to Top-P; a fixed K can admit unnecessary tail
          tokens or cut off legitimate alternatives.
  - question_id: '3.4'
    stem: >-
      How do frequency and presence penalties differ in the way they discourage repeated
      content?
    options:
      - text: >-
          Frequency penalty increases with each prior occurrence, whereas presence
          penalty applies the same one-time reduction once a token has appeared.
        why: >-
          The card defines frequency penalty as proportional to occurrence count and
          presence penalty as a flat penalty triggered by any prior occurrence.
        correct: true
      - text: >-
          Presence penalty increases with each prior occurrence, while frequency penalty
          applies the same one-time reduction as soon as a token has appeared.
        why: >-
          This reverses the defining distinction: frequency scales with the occurrence
          count, while presence is a flat penalty.
      - text: >-
          Both penalties apply a flat reduction after a token first appears, so neither
          becomes stronger when that token is used repeatedly.
        why: >-
          Frequency penalty is cumulative and grows in proportion to the number of prior
          occurrences.
      - text: >-
          Frequency and presence penalties understand phrases and topics directly:
          frequency targets repeated phrases, while presence targets repeated subjects
          or ideas.
        why: >-
          Both are blunt token-level logit penalties with no semantic awareness of
          phrases, topics, or meaning.
  - question_id: '3.5'
    stem: How should sampling settings differ between factual Q&A and creative writing?
    options:
      - text: >-
          Use higher temperature and unset seeds for factual Q&A, but low temperature
          and fixed seeds for creative writing.
        why: >-
          It reverses the sampling strategy: factual systems favour reproducibility,
          while creative systems favour variance.
      - text: >-
          Use low temperature and fixed seeds for factual Q&A, but keep penalties at
          zero for creative writing to avoid distorting the model's style.
        why: >-
          Creative writing uses frequency and presence penalties to reduce repetition
          and encourage new imagery or topics.
      - text: >-
          Keep the same sampling and reproducibility settings for both tasks, relying
          mainly on prompt wording to distinguish factual answers from creative prose.
        why: >-
          The configuration should differ beyond prompting, including penalties, token
          budgets, stop sequences, seeds, and output constraints.
      - text: >-
          Use low temperature and fixed seeds for factual Q&A, but higher temperature
          and unset seeds for creative writing.
        why: >-
          The table contrasts low temperature and set seeds for factual Q&A with higher
          temperature and unset seeds for creative writing.
        correct: true
  - question_id: '3.6'
    stem: Which approach best achieves near-deterministic model outputs in production?
    options:
      - text: >-
          Pin the model version and freeze the prompt template, but allow retrieval to
          return whichever relevant chunks are available; the model will remain stable
          because its weights are fixed.
        why: >-
          It ignores that changing retrieved chunks or their order changes the effective
          prompt and can change the output.
      - text: >-
          Use structured output for parsing, then make production tests assert exact
          response strings so any variation is detected as a failure.
        why: >-
          Exact string equality is fragile for hosted models; tests should focus on
          semantic properties such as schema validity, extraction correctness, and
          faithfulness.
      - text: >-
          Pin the model and prompt, use low-variance decoding, constrain the output
          format, cache fixed requests, and test semantic properties rather than exact
          strings.
        why: >-
          The card recommends temperature zero, a fixed seed, pinned versions, frozen
          prompts, constrained outputs, caching, and semantic tests because hosted
          models retain residual non-determinism.
        correct: true
      - text: >-
          Set temperature to zero and use a fixed seed; with greedy decoding, a hosted
          model will produce bit-identical outputs for the same input.
        why: >-
          It treats decoding controls as sufficient, overlooking residual variation from
          batching, hardware, floating-point operations, and backend changes.
  - question_id: '3.7'
    stem: >-
      What is the effect of setting temperature to zero while also specifying top-k or
      top-p sampling limits?
    options:
      - text: >-
          Low temperature and high repetition penalties reinforce consistent structured
          output by making the model both confident and less repetitive.
        why: >-
          It reverses the interaction described in the card: penalties can suppress a
          needed repeated token and produce malformed structured output.
      - text: >-
          The top-k and top-p limits have no effect because zero temperature selects the
          highest-probability token greedily instead of sampling from a truncated
          distribution.
        why: >-
          The card states that greedy decoding at temperature zero makes both top-k and
          top-p inert.
        correct: true
      - text: >-
          The top-k and top-p limits still shape the result at zero temperature, because
          greedy decoding chooses the highest-probability token only after the
          distribution has been truncated.
        why: >-
          It incorrectly treats truncation as affecting greedy argmax selection; the
          card says both limits are inert at temperature zero.
      - text: >-
          High temperature combined with low top-p is effectively the same as using low
          temperature, since both settings reduce the number of plausible tokens
          sampled.
        why: >-
          It confuses partially cancelling settings with equivalent behaviour; the card
          says the combination produces a distinct, harder-to-reason-about distribution.
  - question_id: '3.8'
    stem: >-
      How should you distinguish parameter tuning for inconsistent outputs from tuning
      for hallucinated outputs?
    options:
      - text: >-
          Lowering temperature can reduce output variation, but hallucinations generally
          require grounding and verification changes rather than parameter tuning alone.
        why: >-
          The card identifies temperature as the main lever for inconsistency while
          treating hallucination primarily as a retrieval, prompting, and verification
          problem.
        correct: true
      - text: >-
          Raise temperature and add a frequency penalty first, because more varied and
          less repetitive generations are less likely to hallucinate the same
          unsupported answer.
        why: >-
          It confuses diversity and repetition controls with factual grounding; raising
          temperature increases variance and does not improve veracity.
      - text: >-
          Set top_p close to zero while leaving temperature unchanged, since nucleus
          sampling is the primary control for both inconsistent outputs and fabricated
          claims.
        why: >-
          It treats top_p as the main universal lever, whereas the card identifies
          temperature as the main variance control and retrieval and verification as the
          hallucination fixes.
      - text: >-
          Pin the model version, provide a fixed seed, and monitor the system
          fingerprint first, because deterministic execution should prevent the model
          from inventing unsupported facts.
        why: >-
          Version pinning and seeding can address reproducibility, but a consistently
          reproduced answer can still be hallucinated without grounding or verification.
  - question_id: '4.1'
    stem: What does an LLM's context window represent?
    options:
      - text: >-
          It is the model's persistent memory for a user, allowing information from
          earlier conversations to remain available without resending the conversation
          history.
        why: >-
          It confuses the per-request context window with persistent memory, which the
          card says LLMs do not have between calls.
      - text: >-
          It is the advertised amount of text the model can reliably reason over in one
          request, so any prompt that fits within the token limit should work well
          without further budgeting.
        why: >-
          It treats the hard capacity as the useful capacity and ignores the quality
          degradation that can occur before the stated maximum.
      - text: >-
          It is the maximum token capacity available to one request, shared by the
          prompt, conversation history, supplied documents, question, and generated
          response.
        why: >-
          The card defines the context window as the tokens the model can attend to in
          one forward pass, with all of those inputs and the output sharing the limit.
        correct: true
      - text: >-
          It is the maximum number of input tokens the model can read before generating
          a response; the generated output is counted separately and does not reduce the
          space available for the prompt.
        why: >-
          It incorrectly excludes generated tokens, even though the prompt and output
          share the context-window limit.
  - question_id: '4.2'
    stem: What is the safest way to design around a model's advertised token window?
    options:
      - text: >-
          The newest headline windows of 2M–10M tokens are production-ready for
          whole-corpus reasoning, so their advertised size is a better planning figure
          than measured task quality.
        why: >-
          It treats marketing ceilings as demonstrated usable capacity, despite the card
          warning that quality near those limits is not established.
      - text: >-
          Treat published limits as upper bounds, design for a smaller effective window,
          and verify retrieval quality on your own data because model figures change
          over time.
        why: >-
          The card says reliable performance is typically around 60–70% of the stated
          maximum, recommends measuring it with a needle-in-a-haystack test, and warns
          that limits change quarterly.
        correct: true
      - text: >-
          Use the vendor’s advertised maximum as the application’s working context size,
          since a model that accepts the full window should remain reliable throughout
          it.
        why: >-
          It confuses the hard published ceiling with the smaller effective window where
          retrieval and reasoning remain dependable.
      - text: >-
          Treat input and output as one shared token allowance, so a model with a
          1M-token context should also support generation approaching 1M tokens.
        why: >-
          It incorrectly assumes output limits match input limits; generation caps are
          separate and usually much smaller.
  - question_id: '4.3'
    stem: >-
      What happens when a request exceeds the model's available context window at the
      raw API layer?
    options:
      - text: >-
          The API rejects the request with a context-length error instead of processing
          only part of the sequence.
        why: >-
          The card says the raw API returns an immediate 400 error when the input plus
          reserved output exceeds the context limit.
        correct: true
      - text: >-
          The model silently drops the earliest tokens and answers using the remaining
          part of the sequence.
        why: >-
          This attributes framework-level truncation behaviour to the model; the raw API
          rejects the oversized request instead.
      - text: >-
          The API accepts the request and generates a shorter response so that the total
          sequence fits within the context window.
        why: >-
          An overlong request is rejected before processing rather than being repaired
          by shortening the output.
      - text: >-
          The request is accepted whenever the input alone fits, because the model's
          context limit does not include the output reserved for generation.
        why: >-
          The input and reserved output must fit together, so an input below the limit
          can still trigger a context-length error.
  - question_id: '4.4'
    stem: >-
      Which strategy is generally the best starting point when answering a targeted
      question about a document that is too large for the context window?
    options:
      - text: >-
          Process every document chunk independently, then combine the chunk outputs
          before answering the question.
        why: >-
          This applies map-reduce, which is intended for tasks requiring the whole
          document rather than a targeted question.
      - text: >-
          Include the entire document in the prompt and rely on the model to fit it
          within the available context.
        why: >-
          A document that exceeds the context window cannot be handled reliably by
          simply placing all of it in one prompt.
      - text: >-
          Feed the chunks through sequentially while refining a running answer across
          the entire document.
        why: >-
          Refine processing is slower and can drift over many steps, so it is not the
          default for targeted questions.
      - text: >-
          Retrieve only the document passages relevant to the question instead of
          processing the entire document.
        why: >-
          The card identifies retrieval-augmented generation as the default for targeted
          questions about long documents.
        correct: true
  - question_id: '4.5'
    stem: >-
      Which chunking approach best preserves information quality throughout a RAG
      pipeline?
    options:
      - text: >-
          Prefer large chunks that preserve entire sections and surrounding explanation,
          because complete context is more important than keeping embeddings narrowly
          focused.
        why: >-
          Large chunks improve self-containment but dilute embeddings, reduce retrieval
          precision, and introduce more irrelevant material into the context window.
      - text: >-
          Create very small, non-overlapping chunks to maximize embedding focus and
          retrieval precision, then rely on the language model to reconstruct any facts
          split across chunk boundaries.
        why: >-
          Small chunks without overlap can fragment answers, and the language model
          cannot reliably recover information that was separated or omitted during
          retrieval.
      - text: >-
          Split documents at semantic boundaries, add modest overlap, and retain heading
          context so chunks remain focused, retrievable, and sufficiently complete.
        why: >-
          The card recommends splitting on headings and other semantic boundaries,
          adding 10–20% overlap, and prepending the document title and heading path.
        correct: true
      - text: >-
          Use a fixed chunk size such as 512 tokens with 50-token overlap across the
          corpus, since a consistent setting provides reliable retrieval regardless of
          document type.
        why: >-
          It treats a common starting point as a universal rule and ignores that the
          optimal size depends on document structure and must be evaluated empirically.
  - question_id: '4.6'
    stem: >-
      What is the key distinction between sliding-window, hierarchical-summarisation,
      and retrieval-based approaches to long contexts?
    options:
      - text: >-
          Sliding-window methods discard older content by age, hierarchical
          summarisation discards detail through compression, and retrieval-based methods
          discard content by recency.
        why: >-
          Retrieval is query-relevance-based rather than a recency-based method; it can
          fetch information from anywhere in the archive.
      - text: >-
          Sliding-window methods discard older content, hierarchical summarisation
          discards detail, and retrieval-based methods discard content judged irrelevant
          to the current query.
        why: >-
          The card frames the approaches by what they throw away: age, detail, and
          relevance respectively.
        correct: true
      - text: >-
          Sliding-window methods discard detail through compression, hierarchical
          summarisation discards older content by age, and retrieval-based methods
          discard content judged irrelevant to the current query.
        why: >-
          It assigns summarisation's loss of detail to sliding windows and sliding
          windows' age-based loss to hierarchical summarisation.
      - text: >-
          Sliding-window methods discard older content by age, hierarchical
          summarisation discards content judged irrelevant to the current query, and
          retrieval-based methods discard detail while preserving a global gist.
        why: >-
          It confuses retrieval with summarisation by claiming retrieval builds a global
          gist and loses detail, while assigning relevance-based selection to
          summarisation.
  - question_id: '4.7'
    stem: >-
      What performance pattern characterises the lost-in-the-middle problem in long
      contexts?
    options:
      - text: >-
          Fact-retrieval accuracy is typically highest for information near the
          beginning or end of the context and lower for information placed in the
          middle, with the weakness increasing as the context grows.
        why: >-
          The card describes a U-shaped retrieval-accuracy curve and says the effect
          worsens with longer contexts.
        correct: true
      - text: >-
          Retrieval accuracy declines mainly because long contexts exceed the model's
          usable window, but the position of a fact within that window has little
          systematic effect.
        why: >-
          It treats the problem as simple context-window overflow and denies the
          documented U-shaped position effect.
      - text: >-
          Information placed in the middle is usually easiest to retrieve because it is
          surrounded by supporting context, while facts at the boundaries are more
          likely to be overlooked.
        why: >-
          It reverses the observed pattern: the card says retrieval is strongest near
          the beginning and end, not in the middle.
      - text: >-
          The problem is best mitigated by adding more surrounding context and extending
          the prompt, since a larger context gives the model more evidence to recover
          facts that were missed.
        why: >-
          Adding more context generally worsens the position effect; the recommended
          approach is to reduce, reorder, structure, or decompose the context.
  - question_id: '4.8'
    stem: What happens when a production request uses a substantially larger prompt?
    options:
      - text: >-
          Both input-token cost and time to first token grow roughly linearly with
          prompt length, so a much larger context mainly affects the bill rather than
          latency.
        why: >-
          It misses the disproportionate latency increase caused by quadratic prefill
          attention.
      - text: >-
          A large context window can replace retrieval in production because putting all
          potentially relevant documents into the prompt avoids retrieval errors without
          materially increasing serving costs.
        why: >-
          It treats a large context as a substitute for RAG and ignores its cost,
          latency, throughput, and accuracy penalties at scale.
      - text: >-
          Streaming reduces total request latency by allowing decoding to complete
          faster, rather than merely making the first output appear sooner.
        why: >-
          It confuses lower perceived latency with lower total latency; streaming does
          not reduce the time required to generate the full response.
      - text: >-
          Input-token cost grows roughly in proportion to prompt length, while time to
          first token rises more sharply because prefill attention scales quadratically
          with sequence length.
        why: >-
          The card states that cost is approximately linear in input tokens, whereas
          prefill attention makes latency worse than linear as the context grows.
        correct: true
  - question_id: '4.9'
    stem: >-
      How should a conversational AI organise memory so it can remain coherent across
      context windows?
    options:
      - text: >-
          Keep the complete transcript as the primary memory and prepend increasingly
          large portions of it to each prompt as the conversation continues.
        why: >-
          This relies on unbounded retention rather than working-memory limits,
          summaries, decay, and selective retrieval, so it eventually exceeds the
          context and attention budget.
      - text: >-
          Extract user facts into a durable profile, but preserve every conflicting
          value with its original timestamp so the model can decide which version to use
          later.
        why: >-
          The write path must resolve contradictions and overwrite stale values; leaving
          conflicting facts side by side risks false memories and inconsistent
          responses.
      - text: >-
          Use separate working, episodic, profile, and summary tiers, each with its own
          storage, lifetime, and retrieval policy.
        why: >-
          The card describes four memory tiers with distinct contents, storage methods,
          and injection rules.
        correct: true
      - text: >-
          Use one vector store for the entire conversation history and retrieve the most
          semantically similar passages for every new message.
        why: >-
          It collapses recent context, episodic events, and durable profile facts into
          one relevance-based mechanism, losing the distinct retrieval rules described
          in the card.
  - question_id: '5.1'
    stem: >-
      What is the most reliable way to compare GPT, Claude and Gemini for a real
      product?
    options:
      - text: >-
          Assume the three families are effectively interchangeable in modalities,
          context and governance, and select among them mainly by brand preference or
          headline token price.
        why: >-
          It denies the durable differences in native inputs, long-context behaviour,
