  - question_id: '5.2'
    stem: >-
      What is the fundamental deployment distinction between proprietary and open-weight
      models?
    options:
      - text: >-
          Proprietary models are accessed through an API, while open-weight models
          provide weights for self-hosted deployment and its associated
          responsibilities.
        why: >-
          The lead contrasts renting proprietary capability through an API with owning
          the deployment of open-weight models.
        correct: true
      - text: >-
          Proprietary models generally provide their weights under a commercial licence,
          while open-source models keep the weights behind an API; the main difference
          is the provider's pricing model.
        why: >-
          This reverses the deployment distinction: proprietary models are typically
          API-served, while open-weight models provide weights for self-hosting.
      - text: >-
          Open-source models normally include the training data, source code and weights
          under an unrestricted licence, so they can be freely modified and
          redistributed without checking licence terms.
        why: >-
          Most such models are open-weight rather than fully open-source, and their
          training data, code and licences vary.
      - text: >-
          Self-hosted models charge per token with no fixed infrastructure cost, whereas
          proprietary APIs require GPUs, serving infrastructure and on-call work but
          keep data inside your perimeter.
        why: >-
          This swaps the cost, operational-burden and data-control trade-offs:
          self-hosting has fixed GPU and ops costs and can keep data local, while APIs
          have none of those infrastructure responsibilities.
  - question_id: '5.3'
    stem: What is the most reliable way to choose an LLM for a business use case?
    options:
      - text: >-
          Start with the highest-performing model on public leaderboards, then check
          whether its latency, cost, licence, and data-handling requirements are
          acceptable for production.
        why: >-
          This treats general benchmark position as the primary decision criterion and
          postpones hard constraints that should eliminate candidates first.
      - text: >-
          Choose a model based on the task category and its advertised capabilities,
          using the provider's benchmark results instead of building a separate
          evaluation for the business's examples.
        why: >-
          Task labels and vendor benchmarks do not establish how candidates perform on
          representative real inputs or reveal task-specific failure modes.
      - text: >-
          Begin with the cheapest available model and deploy it whenever it produces
          acceptable sample outputs, escalating only if users later report quality
          problems.
        why: >-
          The cheapest model is a useful candidate to test, but deployment should follow
          a structured evaluation of quality, reliability, latency, cost, and
          constraints rather than informal sampling and reactive escalation.
      - text: >-
          First eliminate models that violate hard requirements, then benchmark the
          remaining candidates on representative real tasks and compare their overall
          operating costs and performance.
        why: >-
          The card recommends filtering by constraints before running a task-specific
          evaluation and scoring quality, latency, cost, reliability, and related
          factors.
        correct: true
  - question_id: '5.4'
    stem: >-
      What most fundamentally distinguishes encoder-only, decoder-only, and
      encoder–decoder transformers?
    options:
      - text: >-
          Encoders and decoders both primarily produce contextual representations, while
          encoder–decoders are the only transformer family trained with language
          modelling objectives and able to generate text.
        why: >-
          Decoder-only models are trained for next-token prediction and generate text,
          whereas encoder–decoders use sequence-to-sequence objectives rather than being
          the only generative family.
      - text: >-
          Encoder–decoders are two independent encoder stacks used mainly for
          embeddings, while decoder-only models require a separate encoder and
          cross-attention to transform an input sequence.
        why: >-
          It omits the encoder–decoder cross-attention design and incorrectly assigns a
          separate encoder requirement to decoder-only models.
      - text: >-
          Encoders use bidirectional attention for understanding, decoders use causal
          attention for continuation, and encoder–decoders combine both to transform one
          sequence into another.
        why: >-
          The card identifies attention direction and training objective as the key
          difference: bidirectional understanding, causal continuation, and sequence
          transformation.
        correct: true
      - text: >-
          Encoders use causal attention to predict the next token, decoders use
          bidirectional attention to build representations, and encoder–decoders use a
          single shared attention pattern for both tasks.
        why: >-
          This reverses the defining attention patterns and incorrectly treats
          encoder–decoders as having one shared pattern rather than bidirectional
          encoding plus causal decoding.
  - question_id: '5.5'
    stem: >-
      When is a smaller fine-tuned model the better choice than a large general-purpose
      model?
    options:
      - text: >-
          It is preferable for low-volume work where building and maintaining a training
          pipeline costs more than inference.
        why: >-
          At low volume, the card says engineering costs can outweigh inference savings,
          favouring the large general-purpose model.
      - text: >-
          It is preferable for a stable, repetitive, high-volume task with a
          well-defined output format.
        why: >-
          The card recommends small fine-tuned models for stable repetitive work, high
          call volumes, and rigid output schemas.
        correct: true
      - text: >-
          It is preferable for an open-ended task whose requirements change frequently
          and demand broad capability.
        why: >-
          This is the case for staying with a large general-purpose model, whose breadth
          handles changing task requirements.
      - text: >-
          It is preferable when labelled examples are unavailable and deep, general
          reasoning is the core of the product.
        why: >-
          The card identifies both a lack of training data and reasoning depth as
          reasons to use the large model instead.
  - question_id: '5.6'
    stem: >-
      What distinguishes instruction-tuned models from base models, and when should each
      generally be used?
    options:
      - text: >-
          Instruction-tuned models are trained to follow requests and are usually the
          right choice for products, while base models are better starting points for
          substantial custom fine-tuning.
        why: >-
          The card contrasts next-token pretraining with instruction tuning and
          recommends instruct variants for applications but base models for heavily
          domain-specific fine-tuning.
        correct: true
      - text: >-
          Base models are usually the right choice for products because their
          unrestricted completions make them more flexible for chat, RAG, and tool use
          than aligned variants.
        why: >-
          It reverses the practical recommendation: instruction-tuned models are
          preferred for applications, while base models lack request-following behaviour
          and guardrails.
      - text: >-
          Instruction-tuned models are the better starting point for substantial domain
          fine-tuning because their existing alignment provides useful formatting and
          behaviour that base models do not have.
        why: >-
          For heavily custom fine-tuning, the card recommends starting from a base model
          to avoid inheriting another system’s alignment and formatting habits.
      - text: >-
          Instruction-tuned models can be prompted as ordinary plain-text completion
          models, since their chat behaviour does not depend on role markers, special
          tokens, or a particular turn format.
        why: >-
          Instruct models expect a specific chat template, and using the wrong format
          can substantially degrade their quality.
  - question_id: '5.7'
    stem: >-
      What architecture is usually the best fit for a cost-sensitive enterprise
      application?
    options:
      - text: >-
          Use the small open model for all requests because its low latency, full data
          control, and low per-token cost make it the most economical enterprise choice.
        why: >-
          It applies the small model's strengths to every query and ignores its weaker
          multi-step reasoning and the need to escalate difficult work.
      - text: >-
          Use the frontier API model as the single production model because it offers
          the best quality with no GPU or serving operations, making its per-token
          pricing preferable at any volume.
        why: >-
          It treats the API's zero fixed cost as universally cheaper and ignores that
          high-volume traffic can make self-hosting several times less expensive.
      - text: >-
          Deploy a mid-size open model as the sole workhorse, since its stronger quality
          and in-house data residency justify the substantial multi-GPU serving
          footprint.
        why: >-
          It assumes steady utilisation and one model can handle every task, overlooking
          the small model's efficiency for simple traffic and the frontier model's
          advantage on the hardest queries.
      - text: >-
          Use a router across small open, larger open, and frontier API models, sending
          simple high-volume work to self-hosted models and escalating difficult queries
          to the frontier model.
        why: >-
          The card recommends routing traffic by query difficulty and volume instead of
          choosing one model for every request.
        correct: true
  - question_id: '5.8'
    stem: >-
      What is the most defensible way to compare two LLMs for a specific production
      task?
    options:
      - text: >-
          Give both models the same production prompt and run each example once, then
          select the model with the higher mean score and lower average response time.
        why: >-
          A single shared prompt can be unfairly tuned to one model, while one trial and
          mean scores hide variance and catastrophic failures.
      - text: >-
          Choose the model with the lower price per token after checking its benchmark
          quality, because token pricing is the main determinant of the cost of
          completing a task.
        why: >-
          Per-token price does not capture verbosity, retries, failed attempts, caching,
          or the actual cost per completed task.
      - text: >-
          Use a task-specific held-out evaluation set and compare the models
          experimentally, with model-specific prompts, repeated trials, and controlled
          measurements.
        why: >-
          The card recommends replacing generic benchmarks with a task-specific harness
          and treating the comparison as a controlled experiment.
        correct: true
      - text: >-
          Use a widely reported public benchmark and compare headline accuracy and
          average latency, since standardized scores provide the fairest basis for
          choosing between models.
        why: >-
          This relies on generic, potentially contaminated benchmarks and summary
          averages rather than a task-specific evaluation.
  - question_id: '5.9'
    stem: >-
      What is the main performance and accuracy trade-off when quantizing a language
      model?
    options:
      - text: >-
          Quantization primarily reduces the model's disk footprint; it has little
          effect on inference memory or generation speed because the model still
          performs the same computation.
        why: >-
          The card says smaller weights reduce the inference memory footprint and can
          speed generation in memory-bandwidth-bound workloads.
      - text: >-
          Reducing weights from FP16 to INT8 or INT4 cuts memory use and can speed
          generation, but it introduces an accuracy cost that is more noticeable at
          INT4.
        why: >-
          The card explains that smaller weights reduce the memory footprint and improve
          generation speed, while INT8 has near-negligible quality impact and INT4
          causes a small but real degradation.
        correct: true
      - text: >-
          GGUF is a specific 4-bit quantization level, while INT8 and INT4 are file
          formats used by different serving systems.
        why: >-
          This confuses GGUF, which is a file format, with INT8 and INT4, which are
          numerical precisions.
      - text: >-
          Reducing weights to INT4 usually preserves the same accuracy as FP16 while
          improving speed, because lower precision changes storage but not the model's
          computations.
        why: >-
          INT4 introduces a small but real quality loss, especially for reasoning,
          mathematics, long context, and rare knowledge.
