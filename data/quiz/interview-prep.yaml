      - text: >-
          Compare their ecosystem, integrations, supported modalities, context handling,
          APIs, governance options and cost against representative product tasks rather
          than assuming one family is universally smarter.
        why: >-
          The card says capability rankings vary by task and recommends evaluating
          practical differences such as tooling, modalities, context, compliance and
          price.
        correct: true
      - text: >-
          Rank the families by a single benchmark and choose the highest-scoring one,
          since the strongest general model will normally be best for any product
          workload.
        why: >-
          It treats an abstract capability ranking as decisive, contrary to the card's
          warning that results vary by task and release.
      - text: >-
          Treat Claude as an Anthropic-only service and Gemini as a Google Cloud-only
          service, since their deployment options are largely confined to their own
          providers.
