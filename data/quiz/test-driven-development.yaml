# Generated by scripts/generate-quiz.mjs. Review this diff before publishing.
# Source of truth for the questions themselves is data/<deck>.yaml.
deck: test-driven-development
items:
  - question_id: '1.1'
    stem: Which statement best describes Test Driven Development (TDD)?
    options:
      - text: >-
          TDD starts with an automated example of a small behaviour, then uses that test
          to shape the implementation and guide the design.
        why: >-
          The card defines TDD as expressing each small behaviour in an executable test
          before implementation and using it as design feedback.
        correct: true
      - text: >-
          TDD implements a feature first and then adds automated tests to confirm that
          the finished code satisfies its requirements.
        why: >-
          This describes testing after implementation rather than using an executable
          example to drive the implementation and design.
      - text: >-
          TDD begins with a complete architectural design and uses tests to lock down
          the internal implementation details of each component.
        why: >-
          TDD encourages incremental design and tests observable behavior, not a fully
          specified architecture or fixed implementation details.
      - text: >-
          TDD guarantees defect-free software by requiring exhaustive tests for every
          code path before the system is considered complete.
        why: >-
          TDD provides fast feedback and protects intended behavior, but it does not
          guarantee the absence of defects or require exhaustive coverage.
  - question_id: '1.2'
    stem: Which statement correctly describes the Red-Green-Refactor cycle in TDD?
    options:
      - text: >-
          Implement the desired behaviour first, write a test that confirms the
          completed code works, then refactor the design before adding more
          functionality.
        why: >-
          This reverses the red and green stages: TDD starts with a failing test rather
          than production code.
      - text: >-
          Write a failing test for the whole feature, implement all anticipated
          behaviour until the suite passes, then refactor the code and tests together.
        why: >-
          The cycle is intended to proceed in small behaviours, and green adds only what
          the current failing test requires rather than the whole anticipated feature.
      - text: >-
          Write a failing test, implement enough code for it to pass, then change the
          behaviour during refactoring if the new design seems more useful.
        why: >-
          Refactoring may improve structure but must preserve externally visible
          behaviour; changing it belongs in a new red-green cycle.
      - text: >-
          Write a failing test for a small behaviour, make the simplest change that
          passes it, then improve the design without altering its observable behaviour
          before repeating the cycle.
        why: >-
          The card defines red as writing a failing test, green as implementing the
          simplest passing code, and refactor as improving structure while preserving
          behaviour.
        correct: true
  - question_id: '1.3'
    stem: What is a key benefit of writing tests before production code?
    options:
      - text: >-
          It mainly improves quality by increasing code-coverage numbers, even when the
          tests do not describe important behavior.
        why: >-
          The benefit comes from clarifying behavior and catching regressions, not from
          having coverage metrics without meaningful assertions.
      - text: >-
          It eliminates the need for later regression testing because behavior was
          verified before the production code was written.
        why: >-
          Tests provide an automated regression safety net, but they still require
          maintenance and do not replace all later verification.
      - text: >-
          It exposes unclear requirements and design problems while the implementation
          is still inexpensive to change.
        why: >-
          The card says tests make expected behaviour concrete, reveal awkward
          boundaries or coupling, and provide feedback while design changes are still
          cheap.
        correct: true
      - text: >-
          It lets developers define the internal algorithm and data structures in
          advance, making the implementation easier to follow.
        why: >-
          Tests should specify observable behavior rather than prescribe internal
          implementation details.
  - question_id: '2.1'
    stem: Which description best captures a good unit test in a TDD workflow?
    options:
      - text: >-
          It exercises the internal methods and data structures directly, so refactoring
          is constrained but the test can detect any change in implementation.
        why: >-
          This confuses behavior-oriented testing with testing implementation details,
          which makes tests brittle during refactoring.
      - text: >-
          It combines several related workflows in one scenario and shares setup with
          other tests, reducing duplication while still covering the system broadly.
        why: >-
          This mistakes broad coverage and shared setup for good unit-test design,
          sacrificing focus and independence.
      - text: >-
          It uses realistic timing, random inputs, and the surrounding environment to
          reveal failures that narrowly controlled tests might miss.
        why: >-
          This confuses realism with unit-test reliability; environmental, timing, and
          random dependencies make results nondeterministic and slower.
      - text: >-
          It checks a clear, observable behaviour independently and quickly, produces
          repeatable results, and makes failures useful for diagnosing the problem.
        why: >-
          The card describes good tests as focused on behaviour, fast, deterministic,
          independent, and informative when they fail.
        correct: true
  - question_id: '2.2'
    stem: >-
      What structure best reflects the Arrange, Act, Assert approach to writing a
      focused test?
    options:
      - text: >-
          Prepare the inputs, perform every related operation needed by the scenario,
          and assert the final state after the complete sequence.
        why: >-
          The Act phase should focus on the behavior under test, ideally one operation,
          rather than exercising a broad workflow.
      - text: >-
          Set up the test while checking that each dependency is valid, then execute the
          behavior and assert both setup conditions and the result.
        why: >-
          This mixes assertions into Arrange and adds checks unrelated to the focused
          outcome, weakening the separation between phases.
      - text: >-
          Set up inputs and dependencies, perform the behaviour under test, and verify
          its externally meaningful outcome.
        why: >-
          The card defines Arrange as preparation, Act as exercising the behaviour, and
          Assert as checking the observable result.
        correct: true
      - text: >-
          Create the object under test, invoke the operation, and verify its internal
          method calls rather than its externally visible result.
        why: >-
          This replaces behavioral assertions with implementation-detail checks, which
          the card says to avoid.
  - question_id: '2.3'
    stem: Why is test isolation important in TDD?
    options:
      - text: >-
          It requires every test to be a unit test with all external dependencies
          mocked, because integration tests cannot be isolated.
        why: >-
          Isolation is not limited to unit tests; integration tests can remain isolated
          from one another while using real components and controlled setup and cleanup.
      - text: >-
          It keeps each test independent and repeatable, so failures provide fast,
          understandable feedback during implementation and refactoring.
        why: >-
          The card says isolated tests avoid shared state and uncontrolled dependencies,
          making results reliable, failures focused, and feedback quick.
        correct: true
      - text: >-
          It allows tests to share fixtures and setup as long as the entire suite is run
          in its prescribed order, making the suite faster to maintain.
        why: >-
          Isolation requires tests to work alone, in any order, or in parallel; relying
          on shared state or execution order is hidden coupling.
      - text: >-
          It mainly protects production data from being changed by tests, while
          test-to-test dependencies are acceptable if cleanup runs after the suite
          finishes.
        why: >-
          Isolation concerns independence between tests as well as protection of
          external resources; cleanup only at the end cannot prevent order-dependent
          behavior.
  - question_id: '2.4'
    stem: >-
      What is the recommended way to test code that depends on databases, networks, or
      external services?
    options:
      - text: >-
          Inject those dependencies behind narrow interfaces and supply controlled test
          doubles in unit tests, while checking real adapters separately with
          integration tests.
        why: >-
          The card recommends injecting dependencies, using stubs, fakes, spies, or
          mocks for deterministic unit tests, and testing real integrations separately.
        correct: true
      - text: >-
          Use the real database, network client, or external service in unit tests so
          the tests validate the complete behavior against production-like dependencies.
        why: >-
          This confuses unit tests with integration tests and sacrifices the speed,
          isolation, and determinism expected from unit tests.
      - text: >-
          Construct concrete dependencies inside the unit and replace them at test time
          with global mocks or patched network and database calls.
        why: >-
          This avoids dependency injection, couples tests to global state and
          construction details, and makes controlled failure and repeatable behavior
          harder.
      - text: >-
          Mock every dependency and internal method, then assert the exact sequence and
          arguments of all calls so the test confirms the implementation was followed
          precisely.
        why: >-
          This overuses interaction-based testing and produces brittle tests that can
          pass while missing observable behavior or fail after harmless refactoring.
  - question_id: '3.1'
    stem: Why does refactoring play a central role in test-driven development?
    options:
      - text: >-
          Refactoring is adding the next feature while reorganizing the code, with the
          tests updated to describe the new behaviour once the implementation is
          complete.
        why: >-
          It confuses structural cleanup with changing behaviour and adding scope, which
          should be handled as a separate TDD step.
      - text: >-
          Refactoring is designing the final architecture before writing tests, so the
          first implementation does not need to be revisited after the tests pass.
        why: >-
          It reverses the TDD refactoring loop: the card describes improving the
          deliberately minimal design after reaching a green test state.
      - text: >-
          Refactoring is primarily optimizing execution speed or memory usage, even when
          that requires changing the system’s observable behaviour.
        why: >-
          It mistakes performance optimization for the broader structural improvement
          that preserves observable behaviour.
      - text: >-
          Passing tests let developers improve code structure continuously while
          checking that its existing behaviour is preserved.
        why: >-
          The card explains that green tests provide fast feedback and a safety net for
          cleaning up the minimal initial design without changing observable behaviour.
        correct: true
  - question_id: '3.2'
    stem: How does TDD help guide software design?
    options:
      - text: >-
          By starting with likely future requirements, TDD encourages developers to
          establish reusable frameworks, abstraction layers, and extension points before
          implementing individual behaviors.
        why: >-
          TDD's incremental approach discourages speculative architecture rather than
          requiring it upfront.
      - text: >-
          By making implementation details easy to assert, TDD encourages tightly
          coupled tests that preserve the existing structure and make internal changes
          safer.
        why: >-
          Tests focused on implementation details can preserve poor design; TDD's
          benefit comes from testing useful behavior through boundaries.
      - text: >-
          By requiring code to be used through tests, TDD reveals awkward boundaries
          early and encourages simpler implementations built around focused behavior.
        why: >-
          The card explains that tests expose awkward APIs and overloaded components,
          while incremental feedback discourages speculative architecture.
        correct: true
      - text: >-
          By writing tests after the implementation is complete, TDD lets developers
          validate the finished architecture without allowing test constraints to
          influence early design decisions.
        why: >-
          This reverses TDD's design feedback loop: tests influence interfaces and
          structure before implementation is committed.
  - question_id: '3.3'
    stem: What is the defining constraint of refactoring after the tests pass in TDD?
    options:
      - text: >-
          It mainly optimizes runtime performance by replacing working code with faster
          algorithms, even when the structure and responsibilities remain unchanged.
        why: >-
          Performance optimization can be a separate activity, whereas the card
          emphasizes structural improvement, clarity, and responsibility boundaries.
      - text: >-
          It changes the code's structure while preserving the externally observable
          behaviour verified by the tests.
        why: >-
          The card says refactoring improves design without changing established
          behaviour, with tests rerun to detect unintended changes.
        correct: true
      - text: >-
          It adds the next piece of functionality and updates the tests to describe the
          new behaviour before improving the design.
        why: >-
          This confuses refactoring with the next red phase, where new behaviour is
          specified and implemented.
      - text: >-
          It changes externally observable behaviour when the new design is cleaner, as
          long as the existing tests still pass.
        why: >-
          Refactoring must preserve established behaviour; passing tests alone does not
          justify an intentional behavioural change.
  - question_id: '3.4'
    stem: What is the safest way to carry out a refactoring change during TDD?
    options:
      - text: >-
          Make one small structural change at a time, run the relevant tests, and keep
          new behaviour separate from the refactoring.
        why: >-
          The card says refactoring should preserve externally observable behaviour
          through small, independently testable steps and warns against mixing concerns.
        correct: true
      - text: >-
          Design a reusable abstraction or framework first, then refactor the existing
          code to fit it before adding further behavior.
        why: >-
          This encourages speculative abstraction before the duplication or variation is
          understood, which can make future changes harder.
      - text: >-
          When refactoring causes test failures, weaken the assertions or remove tests
          that are coupled to the old implementation so the suite becomes green again.
        why: >-
          This treats test failures as obstacles rather than regression signals and
          hides behavior changes instead of correcting the design or contract.
      - text: >-
          Prefer a broad rewrite when the design is complicated, since replacing the
          code in one pass is more efficient than validating many small transformations.
        why: >-
          A large-bang rewrite removes the safety net and makes it difficult to identify
          which change introduced a regression.
  - question_id: '4.1'
    stem: Which situation is most likely to make TDD challenging to apply initially?
    options:
      - text: >-
          For legacy or tightly coupled code, the team should write a complete unit-test
          suite before making any structural changes, rather than first adding
          characterization tests or creating a testing seam.
        why: >-
          It applies a rigid test-first sequence where the card recommends
          characterization tests or small seams as practical preparation for
          difficult-to-test code.
      - text: >-
          When behavior depends on visual output, hardware, or platform-specific
          details, TDD is especially reliable because automated tests can capture those
          details more precisely than other feedback.
        why: >-
          It incorrectly treats visual, physical, and platform-specific behavior as easy
          for automated tests to capture, whereas the card identifies those tests as
          potentially brittle or incomplete.
      - text: >-
          TDD can be harder when requirements are changing or the work is still
          exploratory, because tests may capture assumptions that will soon be
          discarded.
        why: >-
          The card says unclear, rapidly changing requirements and experimental work can
          make test-first development add friction before the behaviour or design has
          stabilised.
        correct: true
      - text: >-
          TDD is most difficult when the implementation is already stable, because
          writing tests before coding mainly duplicates work that has already been
          completed.
        why: >-
          It reverses the issue described by the card: the main challenges concern
          uncertainty, exploration, coupling, and difficult feedback, not stable code
          that is already implemented.
  - question_id: '4.2'
    stem: What is a sound way to introduce TDD when working on legacy code?
    options:
      - text: >-
          Prefer broad end-to-end tests for each change so the legacy system is
          validated as a whole before introducing seams or isolated unit tests.
        why: >-
          The card recommends focused tests at seams and around specific defects because
          whole-system tests can be slow, difficult to isolate, and less useful for
          incremental design.
      - text: >-
          First capture the behaviour that must remain stable, then use focused failing
          tests to guide changes and protect against regressions.
        why: >-
          The card recommends characterization tests as a baseline, followed by
          bug-driven tests and incremental changes.
        correct: true
      - text: >-
          Rewrite the existing suite into a clean test-first workflow before changing
          legacy code, since characterization tests preserve too much accidental
          behavior.
        why: >-
          The card recommends using characterization tests as a practical baseline
          rather than postponing work until the suite is rewritten.
      - text: >-
          Treat every passing legacy test as a reliable statement of intended behavior,
          and make refactoring subordinate to preserving all existing assertions.
        why: >-
          Passing tests may be flaky, incomplete, or coupled to implementation details,
          so they must be evaluated rather than treated as definitive.
  - question_id: '4.3'
    stem: How do integration and end-to-end tests complement unit tests in a TDD workflow?
    options:
      - text: >-
          They check interactions and critical whole-system journeys, while unit tests
          provide fast, focused feedback on isolated behaviour.
        why: >-
          The card says broader tests validate real component collaboration and
          important user journeys, whereas unit tests form TDD's fast inner loop.
        correct: true
      - text: >-
          They test individual components in isolation at higher levels of detail, while
          unit tests verify that the deployed system works across its boundaries.
        why: >-
          This reverses the responsibilities of unit tests and integration or end-to-end
          tests.
      - text: >-
          They should replace most unit tests in TDD because realistic system-level
          coverage gives more useful feedback than isolated tests.
        why: >-
          The card says broader tests complement unit tests, which remain the fast and
          precise inner loop.
      - text: >-
          They are mainly used after implementation to check that the system is
          complete, rather than to guide development alongside unit tests.
        why: >-
          Integration and acceptance-level tests can be added during the workflow to
          drive and verify behavior that crosses boundaries.
  - question_id: '4.4'
    stem: >-
      What is the most effective way to introduce TDD to a team that does not yet use
      it?
    options:
      - text: >-
          Require the whole team to write every line test-first immediately, using
          coverage targets to verify that the practice is being followed.
        why: >-
          It turns TDD into an immediate compliance exercise and prioritizes coverage
          percentage over meaningful feedback and sustainable learning.
      - text: >-
          Introduce TDD by adding a dedicated testing phase after implementation, with
          tests reviewed separately from the production code.
        why: >-
          It preserves a separate testing phase instead of integrating fast test-first
          feedback into the normal development and review workflow.
      - text: >-
          Begin with the team’s most critical and complex component, then standardize
          the approach across all projects once its tests are in place.
        why: >-
          It chooses an unnecessarily difficult starting point and expands by decree
          rather than using a manageable pilot and evidence-based adaptation.
      - text: >-
          Start with a focused pilot, support the team with pairing and coaching, assess
          the results, and expand the practice gradually.
        why: >-
          The card recommends incremental adoption through a bounded pilot, practical
          support, fast feedback, and evidence-based adaptation.
        correct: true
