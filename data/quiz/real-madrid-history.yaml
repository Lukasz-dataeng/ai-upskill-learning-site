deck: real-madrid-history
items:
  - question_id: '1.1'
    stem: Which statement accurately describes Real Madrid’s foundation?
    options:
      - text: >-
          The club was formally founded on 6 March 1902 as Madrid Football Club,
          adopting the name Real Madrid in 1920.
        why: >-
          The card identifies 6 March 1902 as the official foundation date, gives Madrid
          Football Club as the original name, and says Real was added in 1920.
        correct: true
      - text: >-
          The club was founded on 6 March 1902 as Real Madrid, with the royal title
          included from the beginning.
        why: >-
          It confuses the club’s later name with its original name; “Real” was added in
          1920.
      - text: >-
          The club was formally founded in 1920 as Real Madrid, when King Alfonso XIII
          granted it the title “Real.”
        why: >-
          It treats the royal title being granted as the club’s foundation, although the
          club had been formally established as Madrid Football Club in 1902.
      - text: >-
          The club was founded in the late nineteenth century as Madrid Football Club,
          before being renamed Real Madrid in 1920.
        why: >-
          It mistakes the club’s earlier football roots in Madrid for the official
          foundation date, which is 6 March 1902.
  - question_id: '1.3'
    stem: >-
      Which statement best summarises Real Madrid’s early record in Spain’s main
      domestic competitions?
    options:
      - text: >-
          Real Madrid won four cups from 1905 to 1908, but its first league title in
          1931–32 was followed by a failure to retain the championship.
        why: >-
          It incorrectly denies the club’s consecutive league titles in 1931–32 and
          1932–33.
      - text: >-
          Real Madrid finished as champions in La Liga’s inaugural 1929 season, then
          later added the titles of 1931–32 and 1932–33.
        why: It mistakes the inaugural-season runners-up finish for a championship.
      - text: >-
          Real Madrid won four successive cups from 1905 to 1908, then secured
          consecutive league titles in 1931–32 and 1932–33 after La Liga began.
        why: >-
          The card describes an early run of four cup victories followed by Real
          Madrid’s first two league championships.
        correct: true
      - text: >-
          Real Madrid won four successive La Liga championships from 1905 to 1908,
          before adding its first Copa del Rey triumph in 1917.
        why: >-
          It confuses the Campeonato de España cup with La Liga, which did not begin
          until 1929.
  - question_id: '2.1'
    stem: What was Santiago Bernabéu’s central contribution to Real Madrid?
    options:
      - text: >-
          He was primarily remembered as a former Real Madrid player and coach whose
          greatest contribution came from his work on the pitch rather than from running
          the institution.
        why: >-
          This mistakes Bernabéu’s playing background for his central role as president
          and institution-builder.
      - text: >-
          He preserved the existing Chamartín ground and concentrated on improving the
          domestic team, without making a major investment in a new stadium or club
          infrastructure.
        why: >-
          The card specifically credits him with leading construction of Nuevo Chamartín
          and expanding the club’s institutional and financial scale.
      - text: >-
          He strengthened Real Madrid mainly by developing local talent and keeping the
          club focused on Spanish competition, while its international rise came under
          later presidents.
        why: >-
          This reverses his support for elite recruitment and the European Cup project
          during his own presidency.
      - text: >-
          He built the club’s institutional strength and international ambition, helping
          turn Real Madrid into a leading force in European football.
        why: >-
          The card credits him with developing the stadium, administration, finances,
          recruitment strategy, and European outlook behind Madrid’s mid-century rise.
        correct: true
  - question_id: '2.2'
    stem: >-
      What was the main significance of Real Madrid winning the first five European
      Cups?
    options:
      - text: >-
          The achievement showed that Real Madrid benefited from winning the inaugural
          European Cup, but it did not demonstrate sustained excellence across
          successive campaigns.
        why: >-
          It treats the success as a one-time advantage and ignores the five consecutive
          knockout-tournament victories.
      - text: >-
          The titles were an important early success, but they had little lasting effect
          on the club’s appeal to players, supporters, or its later commitment to
          European competition.
        why: >-
          It denies the institutional and historical impact that the card identifies as
          central to the streak’s significance.
      - text: >-
          The sequence established Real Madrid as Europe’s first dominant force and
          became the basis of its lasting international reputation.
        why: >-
          The card says the victories made the club synonymous with elite continental
          football and founded its global reputation.
        correct: true
      - text: >-
          The run was chiefly a domestic achievement, reinforcing Real Madrid’s standing
          in Spain rather than establishing a broader European identity.
        why: >-
          It misidentifies the competition as primarily domestic, whereas the sequence
          created the club’s international reputation.
  - question_id: '2.3'
    stem: >-
      Which group of players is identified as part of Real Madrid’s legendary team of
      the 1950s and early 1960s?
    options:
      - text: >-
          José María Zárraga and Miguel Muñoz led the attack, while Juan Alonso supplied
          the midfield control behind them.
        why: >-
          Zárraga and Muñoz provided midfield leadership and balance, whereas Juan
          Alonso was one of the team’s goalkeepers.
      - text: >-
          Alfredo Di Stéfano, Ferenc Puskás, Francisco Gento, Raymond Kopa, Héctor Rial,
          José María Zárraga, Miguel Muñoz, Marquitos, and José Santamaría were among
          the side’s notable players.
        why: >-
          The card names these attackers, midfielders, and defenders as key members of
          the team.
        correct: true
      - text: >-
          Alfredo Di Stéfano, Francisco Gento, Héctor Rial, José María Zárraga, and
          Miguel Muñoz were the principal defenders, supported by Marquitos and José
          Santamaría.
        why: >-
          The card identifies Di Stéfano, Gento, and Rial as attacking players and
          Zárraga and Muñoz as midfielders, not defenders.
      - text: >-
          Raymond Kopa was a late addition to the early-1960s team, while Ferenc Puskás
          had already been a leading player from the start of the 1950s.
        why: >-
          The card says Kopa belonged mainly to the earlier part of the period and
          Puskás joined in the late 1950s.
  - question_id: '2.4'
    stem: >-
      What best describes how the Yé-yé generation extended Real Madrid’s Di Stéfano-era
      legacy?
    options:
      - text: >-
          It retained the earlier team’s winning standards while building a younger,
          predominantly Spanish side that won the 1966 European Cup.
        why: >-
          The card says the Yé-yé group preserved Madrid’s competitive culture but
          relied more on internal development and won Europe without the Di Stéfano-era
          stars.
        correct: true
      - text: >-
          It replaced the Di Stéfano-era stars with another group of internationally
          recruited players who restored Madrid’s European dominance.
        why: >-
          The Yé-yé side was predominantly Spanish and relied more on internal
          development than on a new collection of foreign stars.
      - text: >-
          It reproduced the Di Stéfano team’s style around a single dominant playmaker
          rather than developing a more collective structure.
        why: >-
          The generation inherited the earlier standards but did not duplicate its
          football or depend on one central playmaker.
      - text: >-
          It preserved Madrid’s domestic strength after Di Stéfano’s departure but could
          not match the earlier side’s success in Europe.
        why: >-
          The Yé-yé team validated its European standing by winning the 1966 European
          Cup.
  - question_id: '3.1'
    stem: >-
      Which statement best describes Real Madrid's La Liga record and periods of
      greatest dominance?
    options:
      - text: >-
          Real Madrid have won 36 European Cup and Champions League titles, with their
          strongest runs coming in the 1960s and the late 1980s.
        why: >-
          This confuses the club’s La Liga total with its record in European
          competition.
      - text: >-
          Real Madrid have won 36 La Liga titles, with their strongest runs coming in
          the 1980s and the 2010s rather than the 1960s.
        why: >-
          The card specifically identifies the 1960s as the most dominant decade, with
          eight championships.
      - text: >-
          Real Madrid have won 36 La Liga titles, but their strongest period was one
          uninterrupted run from the 1960s through the late 1980s.
        why: >-
          The club’s successes came in distinct periods, not one continuous championship
          streak across both decades.
      - text: >-
          Real Madrid have won 36 La Liga titles, with their strongest runs coming in
          the 1960s and the late 1980s.
        why: >-
          The card identifies 36 titles as the Spanish record and highlights eight
          championships in the 1960s and five consecutive titles from 1985–86 to
          1989–90.
        correct: true
  - question_id: '3.2'
    stem: What best describes the main impact of the Quinta del Buitre on Real Madrid?
    options:
      - text: >-
          The five players remained together at Real Madrid throughout their careers,
          providing a stable core that dominated both Spanish and European competition.
        why: >-
          They did not have identical careers at the club; Pardeza left earlier, and the
          generation fell short of winning the European Cup.
      - text: >-
          The Quinta marked a shift away from La Fábrica, as Real Madrid relied mainly
          on established foreign stars to rebuild its domestic authority.
        why: >-
          The group’s significance was precisely that academy-developed players became
          central to the team and reinforced the importance of La Fábrica.
      - text: >-
          The academy-based group helped restore domestic dominance, winning five
          straight La Liga titles while making homegrown talent central to the club’s
          identity.
        why: >-
          The card links the group to five consecutive league titles, renewed domestic
          authority, and a stronger emphasis on La Fábrica.
        correct: true
      - text: >-
          The group’s defining achievement was winning the European Cup, completing Real
          Madrid’s return to the top of European football in the late 1980s.
        why: >-
          The Quinta won back-to-back UEFA Cups but did not win the European Cup,
          despite reaching the latter stages.
  - question_id: '3.3'
    stem: >-
      What best describes Real Madrid’s main European difficulty across the 1970s and
      1980s?
    options:
      - text: >-
          The UEFA Cup victories confirmed that Madrid had already returned to the
          European elite, and its later European Cup exits were mainly isolated
          misfortunes.
        why: >-
          The card presents the UEFA Cup wins as improvement but stresses that repeated
          defeats to leading opponents exposed a continuing gap at European Cup level.
      - text: >-
          The club rebuilt successfully enough to win UEFA Cups, but could not
          consistently overcome elite opponents in the European Cup.
        why: >-
          The card explains that Madrid improved in the 1980s and won consecutive UEFA
          Cups, yet repeatedly lost to leading European sides in the European Cup.
        correct: true
      - text: >-
          The club’s main problem was losing its domestic dominance, as weak Spanish
          results prevented it from making meaningful progress in European competitions.
        why: >-
          The card says Madrid remained domestically successful at times; the central
          difficulty was translating that strength into European Cup success.
      - text: >-
          Madrid’s European decline continued throughout both decades, with the club
          failing to rebuild a competitive side or win any major European trophies.
        why: >-
          This wrongly ignores the successful rebuilding period and the consecutive UEFA
          Cup victories in the 1980s.
  - question_id: '3.4'
    stem: >-
      How did Real Madrid manage the transition from the Quinta del Buitre generation to
      Florentino Pérez’s early presidency?
    options:
      - text: >-
          Madrid combined continuity from established leaders and academy graduates with
          international recruitment, squad renewal, and a more commercially ambitious
          presidential strategy.
        why: >-
          The card describes veterans and academy products preserving continuity while
          the club refreshed the squad and adopted Pérez’s global, star-driven approach.
        correct: true
      - text: >-
          Madrid replaced the Quinta del Buitre almost overnight with Pérez’s star
          signings, leaving academy graduates and long-serving leaders largely outside
          the club’s new sporting identity.
        why: >-
          The transition was gradual, and figures such as Raúl and other established
          leaders continued to provide continuity.
      - text: >-
          The end of the Quinta del Buitre produced a prolonged sporting decline, with
          Madrid failing to win major European or domestic honors until Pérez rebuilt
          the team after 2000.
        why: >-
          Madrid won the European Cup in 1998 and 2000 and also captured domestic and
          European titles during Pérez’s early presidency.
      - text: >-
          Madrid preserved the old team’s structure under Pérez by prioritizing tactical
          continuity and coaching authority, while international recruitment and
          commercial ambitions remained secondary.
        why: >-
          Pérez’s presidency emphasized global commercial growth and star recruitment,
          creating tension with squad balance and coaching authority rather than simply
          preserving the previous structure.
  - question_id: '4.1'
    stem: >-
      What was the central purpose of Florentino Pérez’s “Galácticos” policy at Real
      Madrid?
    options:
      - text: >-
          It focused on gradually developing young academy players and complementing
          them with relatively unknown signings rather than building the squad around
          internationally recognized superstars.
        why: >-
          This reverses the policy’s emphasis on marquee transfers and contrasts it with
          an approach the card explicitly distinguishes from the Galácticos strategy.
      - text: >-
          It was a formal transfer rule requiring Real Madrid to sign a fixed number of
          world-famous players each season in order to remain eligible for major
          competitions.
        why: >-
          The Galácticos policy was a club strategy, not a competition regulation or
          fixed mandatory transfer quota.
      - text: >-
          It combined signing elite global stars to improve the team with using their
          fame to expand Real Madrid’s commercial reach and international profile.
        why: >-
          The card describes linked sporting and commercial aims: adding decisive
          players while attracting attention, supporters, sponsorships, broadcasting
          interest, and merchandise sales.
        correct: true
      - text: >-
          It was primarily a marketing campaign in which Real Madrid signed famous
          players to increase merchandise sales and global attention, with their
          sporting contribution being secondary.
        why: >-
          This reduces the policy to commercial promotion and omits its equally
          important aim of strengthening the team with elite players.
  - question_id: '4.2'
    stem: >-
      Which group of players is most strongly associated with Real Madrid’s defining
      Galácticos signings?
    options:
      - text: >-
          Luís Figo, Zinedine Zidane, Ronaldo Nazário, David Beckham, Michael Owen, and
          Robinho were all equally defining Galácticos.
        why: >-
          The card distinguishes the first four defining superstars from the later,
          broader-period additions.
      - text: >-
          Luís Figo, Zinedine Zidane, Ronaldo Nazário, and David Beckham formed the
          defining group of Galácticos.
        why: >-
          The card identifies these four players as the principal and defining
          Galácticos signings.
        correct: true
      - text: >-
          Luís Figo, Zinedine Zidane, Ronaldo Nazário, and Michael Owen were the
          defining Galácticos.
        why: >-
          It incorrectly substitutes Michael Owen for David Beckham in the defining
          first four.
      - text: >-
          Ronaldo Nazário, David Beckham, Michael Owen, and Robinho made up the
          principal group of Galácticos.
        why: >-
          It treats the later additions as the principal group and leaves out Figo and
          Zidane.
  - question_id: '4.3'
    stem: Which best describes Real Madrid’s adaptation to modern football?
    options:
      - text: >-
          Real Madrid has built a worldwide commercial and media network that supports
          sporting investment while modernizing its stadium and business operations.
        why: >-
          The card explains that global branding, diversified revenue, digital
          engagement, and stadium modernization reinforce the club’s sporting and
          international position.
        correct: true
      - text: >-
          Real Madrid has mainly preserved a traditional match-day business model,
          relying on Spanish ticket sales and broadcasting income rather than expanding
          into wider commercial activities.
        why: >-
          It overlooks the club’s international sponsorships, merchandising, digital
          channels, hospitality, and other diversified revenue streams.
      - text: >-
          Real Madrid has adapted to globalization primarily by signing famous players,
          assuming their popularity alone will create international supporters and
          commercial growth.
        why: >-
          It reduces globalization to star recruitment and ignores the broader media,
          partnership, digital, merchandising, and stadium strategies.
      - text: >-
          Real Madrid has prioritized commercial expansion by replacing its historic
          identity with a purely entertainment-focused business designed to attract
          tourists and sponsors.
        why: >-
          The club has commercialized its identity while continuing to use its history,
          sporting success, supporters, and competitive ambitions as central parts of
          the brand.
  - question_id: '4.4'
    stem: >-
      What best summarises the overall success and main limitation of the Galácticos
      strategy?
    options:
      - text: >-
          It was primarily a sporting model that produced sustained domestic and
          European dominance, while its commercial effects were secondary and largely
          unrelated to the choice of players.
        why: >-
          This wrongly treats the strategy as consistently dominant on the field and
          dismisses the central commercial purpose and impact of signing famous stars.
      - text: >-
          The strategy was financially unsuccessful because the transfer fees and wages
          of famous players outweighed any gains from sponsorships, merchandising,
          international exposure, and media attention.
        why: >-
          This mistakes the card’s recognition of substantial commercial benefits for a
          claim that the model generated no meaningful financial value.
      - text: >-
          By assembling several of the world’s best players, the policy naturally
          created a balanced and cohesive team, so tactical problems and weak squad
          depth were not significant criticisms.
        why: >-
          This assumes individual quality automatically produces complementary roles,
          stable tactics, and adequate depth, contrary to the card’s main sporting
          criticism.
      - text: >-
          It greatly increased Real Madrid’s commercial profile and brought elite
          talent, but star signings alone could not ensure squad balance, tactical
          cohesion, or consistent sporting success.
        why: >-
          The card describes major brand and sporting benefits while warning that
          prestige could outpace balanced recruitment and coherent team building.
        correct: true
