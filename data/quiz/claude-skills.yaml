# Generated by scripts/generate-quiz.mjs. Review this diff before publishing.
# Source of truth for the questions themselves is data/<deck>.yaml.
deck: claude-skills
items:
  - question_id: '1.1'
    stem: >-
      Which description best captures the kinds of tasks Claude is primarily designed to
      handle?
    options:
      - text: >-
          Claude is primarily suited to language work, including understanding and
          transforming text, analysing information, solving problems, assisting with
          programming, and supporting conversations.
        why: >-
          The card identifies language understanding, text generation and
          transformation, analysis, reasoning, programming assistance, and interactive
          assistance as Claude’s main task categories.
        correct: true
      - text: >-
          Claude is primarily suited to generating and interpreting images, audio, and
          video, while language understanding and text transformation are secondary
          uses.
        why: >-
          The card defines Claude’s main strengths as language-centered tasks rather
          than multimodal media generation and interpretation.
      - text: >-
          Claude is mainly a text drafting and rewriting tool, and it is not intended
          for structured reasoning, information analysis, programming help, or
          conversational task support.
        why: >-
          The card explicitly includes analysis, reasoning, programming assistance, and
          interactive assistance among Claude’s primary task categories.
      - text: >-
          Claude is suited to language, analysis, reasoning, and programming tasks with
          reliable results even when the input is incomplete or the information is
          specialized and current.
        why: >-
          The card presents these as capabilities whose performance depends on input
          quality and information needs, and says important outputs should be checked.
  - question_id: '1.2'
    stem: Which limitation should users keep in mind when evaluating Claude's answers?
    options:
      - text: >-
          Claude's fluent, detailed responses are usually sufficient evidence that the
          information is accurate, so independent checking is rarely necessary.
        why: >-
          It mistakes confident presentation for correctness, despite the possibility of
          hallucinated or incorrect claims.
      - text: >-
          Claude can reliably provide the latest events and private organizational
          information even when that information has not been supplied or connected
          through a tool.
        why: >-
          It incorrectly assumes the model automatically has current and private
          knowledge.
      - text: >-
          When a request is underspecified, Claude can determine the user's intended
          meaning without clarification and will not need to make assumptions.
        why: >-
          It ignores the limitation that Claude may choose a reasonable interpretation
          that differs from the user's intent.
      - text: >-
          Claude can present invented or incorrect information in a fluent and confident
          way, so important claims require independent verification.
        why: >-
          The card explains that Claude may hallucinate plausible-looking details and
          that important outputs should be checked independently.
        correct: true
  - question_id: '1.3'
    stem: What is a key limitation of Claude's training data in shaping its responses?
    options:
      - text: >-
          Claude mainly repeats information exactly as it appeared in its training data,
          so its responses do not substantially reflect the prompt, conversation, or
          later post-training behavior.
        why: >-
          The card says outputs combine learned patterns with alignment, safety
          training, the prompt, and current conversation rather than reproducing source
          material verbatim.
      - text: >-
          Because Claude is trained on a broad mixture of material, it should have
          similarly strong, current, and reliable coverage of obscure topics, local
          perspectives, and recent developments.
        why: >-
          The card warns that broad training does not ensure equal coverage, freshness,
          or reliability, especially for underrepresented or newer information.
      - text: >-
          Claude may reproduce omissions, stereotypes, or dominant viewpoints from
          uneven training data, although later alignment and safety training can reduce
          some of these effects.
        why: >-
          The card explains that training data reflects uneven coverage and recurring
          assumptions, while post-training reduces but does not eliminate resulting
          bias.
        correct: true
      - text: >-
          Claude’s alignment and safety training remove biases inherited from its
          training data, so its responses can generally be treated as neutral across
          groups and disputed issues.
        why: >-
          The card says post-training can reduce some biased patterns but cannot
          eliminate bias or guarantee neutrality.
  - question_id: '2.1'
    stem: >-
      Which combination best describes the components of a well-structured prompt for
      Claude?
    options:
      - text: >-
          It describes the desired result and audience, then leaves the scope,
          constraints, output structure, and evaluation standard for Claude to infer.
        why: >-
          A strong prompt makes these elements explicit rather than relying on Claude to
          infer them.
      - text: >-
          It provides extensive background and examples, assigns Claude a role, and asks
          it to produce the most useful response without imposing a fixed format.
        why: >-
          Background and examples can help, but the card requires explicit requirements,
          output format, and success criteria.
      - text: >-
          It gives Claude the source material first, adds a broad task description, and
          relies on a detailed formatting request to make the result measurable.
        why: >-
          A formatting request alone does not replace a clear objective, relevant
          context, constraints, and defined success criteria.
      - text: >-
          It states a clear objective, provides necessary context, sets requirements and
          constraints, specifies the output format, and defines success criteria.
        why: >-
          The card identifies these five elements as the usual components of a
          well-structured prompt.
        correct: true
  - question_id: '2.2'
    stem: How do well-chosen few-shot examples improve Claude's performance on a task?
    options:
      - text: >-
          They eliminate the need for explicit instructions because Claude will reliably
          infer the intended task from any set of examples.
        why: >-
          Examples clarify instructions but do not guarantee correctness or replace the
          need for accurate, unambiguous guidance.
      - text: >-
          They are most effective when they cover as many cases as possible, even if the
          examples use different formats or give inconsistent answers.
        why: >-
          Large numbers and inconsistency can obscure the intended pattern and teach the
          wrong rule.
      - text: >-
          They provide a concrete input-to-output pattern that clarifies the task's
          expected interpretation, format, and level of detail.
        why: >-
          The card explains that examples demonstrate how to interpret inputs and
          produce desired outputs, making abstract instructions concrete and reducing
          ambiguity.
        correct: true
      - text: >-
          They mainly increase Claude's confidence by giving it more text to analyze,
          even when the examples are unrelated to the new inputs.
        why: >-
          Relevance matters; unrelated examples can distract Claude rather than improve
          performance.
  - question_id: '2.3'
    stem: >-
      What is the key difference between explicit instructions and implicit guidance in
      a prompt?
    options:
      - text: >-
          Assigning Claude a role such as “careful copy editor” is an explicit
          instruction that guarantees attention to grammar, consistency, and preserving
          meaning without further requirements.
        why: >-
          A role provides implicit guidance about likely priorities, but it does not
          guarantee every behavior or replace explicit constraints.
      - text: >-
          Explicit instructions state requirements directly and make them checkable,
          whereas implicit guidance relies on context or cues that may be interpreted
          less consistently.
        why: >-
          The card describes explicit requirements as direct and observable, while
          implicit guidance is inferred from context, tone, roles, examples, or
          information order and is less predictable.
        correct: true
      - text: >-
          Explicit instructions are mainly used to establish tone and persona, whereas
          implicit guidance specifies the task, format, and constraints that Claude can
          check directly.
        why: >-
          This reverses the roles: direct instructions define observable requirements,
          while tone and persona are common sources of implicit guidance.
      - text: >-
          Explicit instructions and implicit guidance are equivalent as long as the
          prompt provides enough context, because Claude will reliably infer unstated
          requirements from its role and examples.
        why: >-
          The card says implicit cues are less predictable and should not replace
          explicit statements of important expectations.
  - question_id: '2.4'
    stem: What is the most effective way to use negative constraints in a prompt?
    options:
      - text: >-
          State the unwanted behaviour specifically and pair the restriction with a
          clear alternative that defines what Claude should do instead.
        why: >-
          The card says negative constraints work best when they are specific,
          observable, and paired with a replacement behaviour.
        correct: true
      - text: >-
          List every possible unwanted output in detail, without suggesting
          replacements, because Claude can infer the intended behaviour from the
          prohibitions.
        why: >-
          The card says restrictions work best when paired with a clear replacement
          behaviour rather than relying on inference.
      - text: >-
          Use broad negative wording such as “don’t be verbose” or “don’t hallucinate,”
          since general prohibitions are more flexible and avoid overconstraining the
          response.
        why: >-
          Vague prohibitions are harder to follow than specific, observable constraints
          that define the desired output.
      - text: >-
          Repeat important prohibitions throughout the prompt and add many exceptions,
          because exhaustive negative instructions make compliance more reliable than
          concise, prioritized constraints.
        why: >-
          The card warns that repeated unwanted outputs and long lists of exceptions can
          make instructions harder to follow.
  - question_id: '3.1'
    stem: What is the main benefit of chain-of-thought prompting on multi-step tasks?
    options:
      - text: >-
          It guarantees a correct answer by forcing the model to state every assumption
          and calculation before reaching a conclusion.
        why: >-
          Chain-of-thought can still contain false assumptions and coherent-looking
          errors, so it does not guarantee correctness.
      - text: >-
          Its main benefit comes from displaying a long reasoning trace to the user, so
          the full internal sequence should normally be included in the final response.
        why: >-
          The card says a concise rationale or structured summary is usually preferable
          to exposing a long reasoning trace.
      - text: >-
          It is mainly useful for retrieving isolated facts because breaking factual
          recall into ordered steps prevents the model from omitting details.
        why: >-
          The technique is most useful for multi-step conditions, transformations,
          calculations, and decisions rather than isolated factual recall.
      - text: >-
          It guides the model through ordered substeps, which can reduce skipped steps
          when handling multiple conditions, transformations, calculations, or
          decisions.
        why: >-
          The card says that decomposing a problem and applying steps in sequence can
          reduce the chance of missing an important step.
        correct: true
  - question_id: '3.2'
    stem: Which approach most effectively uses role-playing to shape Claude's responses?
    options:
      - text: >-
          Describe only the desired tone and formatting, since the persona itself should
          determine the task, audience, and content of the response.
        why: >-
          A role can influence perspective and style, but it does not replace explicit
          objectives, audience guidance, or substantive requirements.
      - text: >-
          Use the persona to override conflicting instructions and let Claude follow the
          role’s priorities even when they conflict with higher-priority constraints.
        why: >-
          Role-playing does not grant permission to ignore higher-priority instructions
          or other boundaries.
      - text: >-
          Define a task-relevant persona along with the audience, desired style,
          objective, and output constraints.
        why: >-
          The card recommends combining a relevant role with explicit objectives,
          audience and style guidance, and boundaries or format requirements.
        correct: true
      - text: >-
          Assign Claude an impressive expert identity and rely on that persona to supply
          authoritative knowledge and professional judgment.
        why: >-
          This treats a claimed credential as a source of real-world authority or
          private knowledge, which role-playing cannot provide.
  - question_id: '3.3'
    stem: >-
      Which approach best supports reliable handling of a complex, multi-step task with
      Claude?
    options:
      - text: >-
          Keep the full conversation and every prior draft in context throughout the
          task so Claude can continuously reconsider all earlier material while
          completing each successive step.
        why: >-
          The recommended workflow passes relevant structured artifacts between stages
          rather than repeatedly carrying the entire conversation.
      - text: >-
          Break the task into explicit stages with defined inputs and outputs, require
          structured intermediate artifacts, and use a separate review pass to check the
          result against requirements and evidence.
        why: >-
          The card recommends treating complex work as a workflow, making stages
          explicit, producing structured artifacts, and adding independent verification.
        correct: true
      - text: >-
          Give Claude one comprehensive prompt describing the entire objective, then let
          it determine the necessary steps and return the completed deliverable in a
          single response.
        why: >-
          This relies on an unstructured one-shot request instead of decomposing the
          work and checking intermediate results.
      - text: >-
          Ask Claude to produce a detailed plan and extensive reasoning first, then
          accept the final answer as long as the plan appears coherent without requiring
          a separate verification pass.
        why: >-
          A plausible plan or long reasoning transcript does not replace an independent
          review against requirements, edge cases, and evidence.
  - question_id: '3.4'
    stem: What is the most reliable way to troubleshoot an unexpected Claude response?
    options:
      - text: >-
          Reproduce the issue with the smallest relevant prompt, then change one
          instruction, input, example, or setting at a time while checking the result
          against explicit success criteria.
        why: >-
          The card recommends minimal reproduction, observable success criteria, and
          incremental testing that changes only one element at a time.
        correct: true
      - text: >-
          Add more explanation, examples, and constraints to the existing prompt until
          Claude follows the request, without first reducing the prompt or separating
          the possible causes.
        why: >-
          This treats additional prose as the default fix and skips minimal reproduction
          and controlled testing.
      - text: >-
          Assume the prompt is the cause, rewrite it completely, and then change the
          model, temperature, and other generation settings together to find a
          combination that works.
        why: >-
          The problem may come from context or application layers, and changing several
          variables at once prevents identifying the cause.
      - text: >-
          Evaluate the revised prompt from one typical response, since a successful
          answer on that example is enough to show that the troubleshooting change
          worked.
        why: >-
          The card calls for explicit success criteria and testing across representative
          easy, typical, and adversarial cases rather than relying on one output.
  - question_id: '4.1'
    stem: >-
      Which statement best describes Claude’s capabilities for content generation and
      summarization?
    options:
      - text: >-
          Claude’s summarization is limited to shortening one document into a general
          overview, rather than extracting decisions, action items, or comparisons.
        why: >-
          It overlooks the card’s examples of preserving priorities, identifying
          decisions and action items, and comparing multiple supplied documents.
      - text: >-
          Claude can create useful content and summaries from a minimal prompt, because
          specifying the audience, purpose, tone, length, and output structure adds
          little value.
        why: >-
          The card emphasizes that these prompt details improve the usefulness and focus
          of the result.
      - text: >-
          Claude can create structured drafts in a requested style and condense supplied
          material into summaries, key points, decisions, or action items.
        why: >-
          The card describes drafting varied content while adapting audience and tone,
          and summarizing documents or notes into concise, prioritized outputs.
        correct: true
      - text: >-
          Claude can produce publish-ready drafts and reliable summaries that usually do
          not require checking against the source material.
        why: >-
          It treats generated content as final and factual, whereas the card says
          important claims should be reviewed for accuracy.
  - question_id: '4.2'
    stem: What is an effective way to use Claude for brainstorming?
    options:
      - text: >-
          Use Claude’s brainstormed ideas as ready-to-implement recommendations, since
          its ability to generate connections removes the need for independent judgment
          or validation.
        why: >-
          The card warns that Claude’s ideas can be generic, impractical, or
          assumption-based, so people must retain judgment and check the leading
          options.
      - text: >-
          Use Claude in stages: generate a wide range of ideas first, then compare,
          refine, and turn the strongest options into practical next steps.
        why: >-
          The card recommends starting with broad possibilities before evaluating them
          against criteria and developing the best ideas into experiments, plans, or
          other actions.
        correct: true
      - text: >-
          Ask Claude for one highly original idea at the outset, then develop that idea
          rather than spending time comparing alternatives.
        why: >-
          This replaces the card’s breadth-first process with a single-idea approach and
          risks committing before exploring meaningful possibilities.
      - text: >-
          Provide Claude with the evaluation criteria first and ask it to produce only
          the highest-scoring ideas, avoiding unconventional options that may not seem
          immediately feasible.
        why: >-
          The card recommends generating diverse and unconventional possibilities before
          applying criteria, not filtering them at the initial stage.
  - question_id: '4.3'
    stem: >-
      What is the appropriate role for Claude when it is used for sensitive coding or
      legal-review work?
    options:
      - text: >-
          Claude should support a qualified human’s work, while confidential data is
          minimized, consequential outputs are checked, and the human retains authority
          over approval and action.
        why: >-
          The card requires supervised use, protection of sensitive information,
          verification of important outputs, and accountable human approval.
        correct: true
      - text: >-
          Claude may independently approve legal conclusions or deploy coding changes
          when its response is confident and a qualified professional is available to
          review the results afterward.
        why: >-
          It puts consequential authority and action before human approval, whereas the
          card requires review and authorization before reliance or deployment.
      - text: >-
          Sensitive documents and credentials can be provided to Claude when they
          improve accuracy, provided the organization later deletes the conversation and
          records who used the system.
        why: >-
          It treats later deletion and audit records as sufficient, ignoring the
          requirements for prior authorization, data minimization, and protection of
          confidential information.
      - text: >-
          A brief expert review is generally enough for Claude-generated legal or coding
          work, since fluent explanations and plausible citations usually indicate that
          the output is reliable.
        why: >-
          It mistakes apparent fluency and a cursory review for verification, rather
          than requiring source checking, testing, security review, and enough context
          to challenge the output.
  - question_id: '4.4'
    stem: >-
      What is the most effective role for Claude in creative writing and complex
      problem-solving work?
    options:
      - text: >-
          Have Claude produce polished creative work from a brief and accept most of its
          wording, since extensive human revision would reduce the speed and consistency
          benefits of collaboration.
        why: >-
          This treats Claude as an autonomous author and overlooks the need to preserve
          the writer’s voice, correct continuity errors, and perform human editing.
      - text: >-
          Rely on Claude’s structured explanations and confident conclusions as the
          final solution to difficult problems, using outside checks only when the
          response appears unclear or incomplete.
        why: >-
          Fluent reasoning can still contain unsupported premises, calculation errors,
          or faulty dependencies, so important results require independent validation.
      - text: >-
          Restrict Claude mainly to summarising material and correcting grammar, because
          generating alternatives or reasoning through complex problems creates more
          risk than practical value.
        why: >-
          The card identifies exploration, critique, alternative development, and
          structured problem-solving as major opportunities when human judgment and
          verification remain in the workflow.
      - text: >-
          Use Claude to explore alternatives, develop and critique ideas, and organise
          complex material, while retaining human control and independently checking
          important claims.
        why: >-
          The card presents Claude as a collaborator for rapid exploration and
          structured reasoning, but stresses that its output requires human editorial
          judgment and external verification.
        correct: true
